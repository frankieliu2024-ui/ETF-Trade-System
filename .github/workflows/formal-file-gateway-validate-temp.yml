name: formal-file-gateway-validate-temp
on:
  push:
    branches:
      - maintenance/formal-file-mutation-gateway-20260827
    paths:
      - "scripts/apply_index_gateway_patch_temp.py"
permissions:
  contents: write
concurrency:
  group: formal-file-gateway-validate-temp
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch system index entry
        run: python scripts/apply_index_gateway_patch_temp.py
      - name: Compile formal mutation modules
        run: python -m py_compile scripts/formal_file_mutation_gateway.py scripts/process_state_sync_request.py scripts/sync_formal_files.py scripts/apply_trade_fact_correction.py scripts/check_production_mutation_protocol.py
      - name: Run gateway and existing formal sync tests
        run: python -m unittest tests.test_formal_file_mutation_gateway tests.test_market_formal_file_sync
      - name: Validate production mutation protocol
        run: python scripts/check_production_mutation_protocol.py
      - name: Commit stable system index update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF_SYSTEM_INDEX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: route formal fact maintenance through canonical gateway"
          git push origin HEAD:maintenance/formal-file-mutation-gateway-20260827
