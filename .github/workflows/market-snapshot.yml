name: ETF market snapshot

on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "manual"
      probe_only:
        description: "Fetch and validate without writing a valid node"
        required: true
        default: "false"
  schedule:
    # UTC. Trigger every 10 minutes across the possible A-share window.
    # The runner applies the Asia/Shanghai session guard. Cron is a trigger target,
    # not a promise of exact execution time; decision freshness is determined from
    # captured_at and config/runtime_policy.json.
    - cron: "*/10 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-market-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "2"
      HITHINK_TIMEOUT_SECONDS: "25"
      HITHINK_MAX_WORKERS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install hithink-finance CLI
        run: npm install --global @hithink-tech/hithink-finance-cli
      - name: Run data-only snapshot
        env:
          NODE_LABEL: ${{ github.event.inputs.node || 'scheduled' }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
        run: |
          if [ "$PROBE_ONLY" = "true" ]; then
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL" --probe-only
          else
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL"
          fi
      - name: Build objective intraday market delta
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_market_delta.py
      - name: Build resilient overseas core index context
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_overseas_context.py
      - name: Build dynamic stock context from current account
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_stock_context.py
      - name: Collect current account-stock market facts
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_account_stock_market.py
      - name: Build state context and candidates
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_state_context.py
      - name: Build on-demand query context
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_query_context.py
      - name: Build post-market review event when closed
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_post_market_review.py
      - name: Build ChatGPT task read probe
        if: ${{ success() && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_chatgpt_task_probe.py
      - name: Commit runtime/data artifacts
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/snapshots data/state/CURRENT.json data/state/runtime_health.json data/state/market_delta.json data/state/overseas_context.json data/state/stock_context.json data/state/stock_market_context.json data/state/dashboard_update_candidate.json data/state/decision_context.json data/state/query_context.json data/state/chatgpt_task_probe.json post_market_review/post_market_review_event.json data/state/review_context.json events/events.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: record market snapshot/runtime health"
          git pull --rebase origin main
          git push origin HEAD:main
