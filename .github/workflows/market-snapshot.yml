name: ETF market snapshot

# Schedule registration marker: this workflow remains on the default branch for GitHub cron dispatch.
on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - close
      probe_only:
        description: "Fetch and validate without writing a valid node"
        required: true
        default: "false"
  schedule:
    # Unified ten-minute pulse clock with Beijing boundary coverage 07:55-16:05.
    # Boundary pulses are phase-gated and are not automatically A-share continuous-session facts.
    - cron: "55 23 * * 0-4" # Beijing 07:55 Mon-Fri
    - cron: "5,15,25,35,45,55 0-7 * * 1-5" # Beijing 08:05-15:55 Mon-Fri
    - cron: "5 8 * * 1-5" # Beijing 16:05 Mon-Fri

permissions:
  contents: write

concurrency:
  group: etf-market-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "2"
      HITHINK_TIMEOUT_SECONDS: "25"
      GITHUB_EVENT_INPUTS_NODE: ${{ github.event.inputs.node || '' }}
      GITHUB_EVENT_INPUTS_PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
      SCHEDULED_CRON: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check exchange calendar and capture window
        id: session_gate
        run: python scripts/runtime_session_gate.py
      - name: Record skipped runtime health
        if: ${{ steps.session_gate.outputs.should_capture != 'true' }}
        env:
          SESSION_MARKET_DATE: ${{ steps.session_gate.outputs.market_date }}
          SESSION_MARKET_PHASE: ${{ steps.session_gate.outputs.market_phase }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SESSION_REASON: ${{ steps.session_gate.outputs.reason }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
          ETF_HEALTH_PATH: ${{ 'data/state/runtime_health.json' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          now = datetime.now(shanghai).isoformat(timespec='seconds')
          health_path = Path(os.environ.get('ETF_HEALTH_PATH', 'data/state/runtime_health.json'))
          current_path = Path('data/state/CURRENT.json')
          health = json.loads(health_path.read_text(encoding='utf-8')) if health_path.exists() else {}
          current = json.loads(current_path.read_text(encoding='utf-8')) if current_path.exists() else {}
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          health.update({
              'status': 'SKIPPED',
              'quality_status': 'SKIPPED',
              'reason': os.environ.get('SESSION_REASON') or 'outside_a_share_capture_window',
              'failure_stage': 'session_gate',
              'scheduled_for': 'cron:' + os.environ.get('EVENT_SCHEDULE', '') if os.environ.get('EVENT_SCHEDULE') else ('workflow_dispatch'),
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'SCHEDULE_OR_DISPATCH',
              'started_at': now,
              'finished_at': now,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': '',
              'latest_snapshot': current.get('latest_snapshot', health.get('latest_snapshot', '')),
              'market_date': current.get('market_date') or os.environ.get('SESSION_MARKET_DATE', ''),
              'market_phase': os.environ.get('SESSION_MARKET_PHASE', 'OUTSIDE_SESSION'),
          })
          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/setup-node@v7
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        with:
          node-version: "22"
      - name: Start optional Hithink fallback CLI bootstrap
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        shell: bash
        run: |
          # Tencent is the primary A-share provider. Start the optional
          # fallback installation in parallel so it cannot delay first core
          # snapshot acquisition; cloud_runner_snapshot.py waits for it only
          # if a fallback path is actually needed.
          npm install --global @hithink-tech/hithink-finance-cli >/tmp/hithink-finance-install.log 2>&1 &
          echo "HITHINK_CLI_INSTALL_PID=$!" >> "$GITHUB_ENV"
      - name: Load unified provider concurrency policy
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          policy = json.loads(Path("config/runtime_policy.json").read_text(encoding="utf-8"))
          key = "scheduled_provider_max_workers"
          value = policy.get(key)
          if not isinstance(value, int) or value < 1:
              raise SystemExit(f"invalid {key}={value!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"HITHINK_MAX_WORKERS={value}\n")
          print(f"provider concurrency: {key}={value}")
          PY

      - name: Run data-only snapshot
        id: capture
        # Scheduled pulses and user requests share the same phase-aware producer.
        # `scheduled` is resolved by cloud_runner_snapshot.py into auction/live/close
        # from the actual A-share market phase, avoiding generic live labels after close.
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        env:
          NODE_LABEL: ${{ github.event.inputs.node || 'scheduled' }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
          SCHEDULED_CLOSE_INTENT: ${{ steps.session_gate.outputs.close_intent }}
          REQUEST_TIME_CLOSE_RECOVERY: ${{ steps.session_gate.outputs.request_time_close_recovery }}
          WAIT_FOR_CLOSE_BOUNDARY_SECONDS: ${{ steps.session_gate.outputs.wait_for_close_boundary_seconds }}
          # Query-time refresh has its own health projection and must not overwrite canonical snapshot health.
          ETF_HEALTH_PATH: data/state/runtime_health.json
        run: |
          if [ "${WAIT_FOR_CLOSE_BOUNDARY_SECONDS:-0}" -gt 0 ]; then
            echo "scheduled close intent received; waiting ${WAIT_FOR_CLOSE_BOUNDARY_SECONDS}s for 15:00 boundary"
            sleep "$WAIT_FOR_CLOSE_BOUNDARY_SECONDS"
          fi
          if [ "$PROBE_ONLY" = "true" ]; then
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL" --probe-only
          else
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL"
          fi
      - name: Normalize runtime health observability
        if: ${{ steps.capture.outcome == 'success' && steps.session_gate.outputs.should_capture == 'true' }}
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
          ETF_HEALTH_PATH: data/state/runtime_health.json
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          path = Path(os.environ.get('ETF_HEALTH_PATH', 'data/state/runtime_health.json'))
          data = json.loads(path.read_text(encoding='utf-8'))
          snapshot_path = Path(data.get('latest_snapshot', ''))
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8')) if snapshot_path.exists() else {}
          provider_times = [row.get('as_of_beijing') for row in (snapshot.get('rows') or []) if row.get('as_of_beijing')]
          planned = snapshot.get('planned_time', '')
          market_date = snapshot.get('market_date', data.get('market_date', ''))
          data.update({
              'scheduled_for': f'{market_date} {planned}' if planned else f'{market_date} {snapshot.get("node", "")}',
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),
              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'SCHEDULE_OR_DISPATCH',
              'started_at': data.get('run_started_at', ''),
              'finished_at': data.get('captured_at_beijing', datetime.now(shanghai).isoformat(timespec='seconds')),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': max(provider_times) if provider_times else '',
              'failure_stage': '',
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify a new valid snapshot was written
        id: snapshot_result
        if: ${{ steps.capture.outcome == 'success' }}
        env:
          ETF_HEALTH_PATH: data/state/runtime_health.json
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ.get('ETF_HEALTH_PATH', 'data/state/runtime_health.json'))
          written = False
          reason = 'runtime_health_missing'
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              status = data.get('status', '')
              same_run = str(data.get('workflow_run_id', '')) == str(os.environ.get('GITHUB_RUN_ID', ''))
              written = status in {'PASS', 'DEGRADED'} and same_run and bool(data.get('latest_snapshot'))
              reason = status or 'missing_status'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"snapshot_written={'true' if written else 'false'}\n")
              f.write(f"reason={reason}\n")
          print(json.dumps({'snapshot_written': written, 'reason': reason}, ensure_ascii=False))
          PY
      - name: Publish core snapshot and CURRENT immediately
        if: ${{ (steps.snapshot_result.outputs.snapshot_written == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.probe_only != 'true') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Consistency is persisted by its own workflow; excluding it prevents a
          # concurrent audit write from conflicting with the market-data commit.
          # Only market facts and the canonical market CURRENT pointer belong here.
          # Account, decision, Dashboard, notification and audit projections have
          # separate owners and must never be swept into this commit.
          git add -- data/market/snapshots data/state/CURRENT.json data/state/runtime_health.json
          if ! git diff --cached --quiet; then
            mkdir -p /tmp/etf-core-publish
            git diff --cached --name-only -z > /tmp/etf-core-files
            while IFS= read -r -d '' file; do
              mkdir -p "/tmp/etf-core-publish/$(dirname "$file")"
              cp "$file" "/tmp/etf-core-publish/$file"
            done < /tmp/etf-core-files
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              while IFS= read -r -d '' file; do
                mkdir -p "$(dirname "$file")"
                cp "/tmp/etf-core-publish/$file" "$file"
              done < /tmp/etf-core-files
              git add -- data/market/snapshots data/state/CURRENT.json data/state/runtime_health.json
              git commit -m "data: publish core market snapshot"
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then exit 1; fi
            done
          fi
