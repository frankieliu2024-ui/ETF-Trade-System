        if: ${{ steps.query_context.outcome == 'success' && (steps.state_sync.outputs.formal_completion != 'true' || steps.state_sync.outputs.formal_post_close_review == 'true') && (steps.triggering_request.outputs.formal_completion != 'true' || steps.state_sync.outputs.formal_post_close_review == 'true') && (github.event_name == 'push' || steps.state_sync.outputs.processed == 'true' || steps.snapshot_result.outputs.snapshot_written == 'true' || github.event.inputs.formal_context_recovery_request != '') && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_state_context.py --decision-ready-only

      - name: Promote formal request gate after full context validation
        id: formal_gate_promotion
        if: ${{ steps.query_context.outcome == 'success' && steps.state_context.outcome == 'success' && env.TRIGGERING_REQUEST_EXPECTED == 'true' && github.event.inputs.probe_only != 'true' }}
        run: |
          test -s data/state/query_context.json
          test -s data/state/decision_context.json
          python -c 'import json; from pathlib import Path; p=json.loads(Path("data/state/query_context.json").read_text()); assert isinstance(p.get("decision_fact_pack",{}).get("decision_work_package"),dict); d=json.loads(Path("data/state/decision_context.json").read_text()); assert d.get("generated_at")'
          if [ "$TRIGGERING_REQUEST_EXPECTED" = "true" ]; then
            formal_request_source=$(python - "$TRIGGERING_REQUEST_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(str(request.get("source") or "").strip().upper())
          PY
            )
            case "$formal_request_source" in
              CHATGPT_MANUAL_FORMAL_ANALYSIS|CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS|CHATGPT_SCHEDULED_FORMAL_ANALYSIS)
                ;;
              *)
                echo "Non-Formal request; skip Formal Decision gate projection."
                exit 0
                ;;
            esac
            python - "$TRIGGERING_REQUEST_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "request_id": str(request.get("request_id") or "").strip(),
              "parent_request_id": str(request.get("parent_request_id") or "").strip(),
              "task_run_id": str(request.get("task_run_id") or "").strip(),
              "occurrence_id": str(request.get("occurrence_id") or "").strip(),
              "source": str(request.get("source") or "").strip(),
              "entry_mode": str(request.get("entry_mode") or "").strip(),              "requested_at_beijing": str(request.get("requested_at_beijing") or "").strip(),
              "market_date": str(request.get("market_date") or "").strip(),
          }          decision = json.loads(Path("data/state/decision_context.json").read_text(encoding="utf-8"))
          trigger = (decision.get("observability") or {}).get("trigger") or {}
          actual = {              key: str(trigger.get(key) or decision.get(key) or "").strip()              for key in expected
          }          for key, value in expected.items():
              if not value or actual[key] != value:
                  raise SystemExit(
                      f"formal request decision_context {key} mismatch after state context build: "
                      f"expected={value} actual={actual[key]}"
                  )
          PY
          fi
          TRIGGERING_REQUEST_FILE="$TRIGGERING_REQUEST_FILE" python scripts/refresh_gate.py --annotate-contexts
      - name: Build post-market review context
        # Review is a close/state-sync consumer, not a generic intraday pulse
        # responsibility. Explicit/manual close remains a legal recovery path.
        if: ${{ always() && steps.state_sync.outcome != 'failure' && (steps.state_sync.outputs.formal_completion != 'true' || steps.state_sync.outputs.formal_post_close_review == 'true') && (steps.triggering_request.outputs.formal_completion != 'true' || steps.state_sync.outputs.formal_post_close_review == 'true') && (steps.state_sync.outputs.processed == 'true' || (steps.snapshot_result.outputs.snapshot_written == 'true' && (steps.session_gate.outputs.close_intent == 'true' || github.event.inputs.node == 'close')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.node == 'close') || steps.state_sync.outputs.formal_post_close_review == 'true') && github.event.inputs.probe_only != 'true' }}
        continue-on-error: true
        run: python scripts/build_post_market_review.py
      - name: Rebuild E2E usability state after close-review projection
        # The close-review producer must publish before the E2E consumer reads
        # closure/evidence/business-completion state; otherwise stale or future
        # close_review data can survive in e2e_status.
        if: ${{ always() && steps.state_sync.outcome != 'failure' && (steps.query_context.outcome == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.node == 'close')) && (steps.state_sync.outputs.formal_completion != 'true' || steps.state_sync.outputs.formal_post_close_review == 'true') && (steps.triggering_request.outputs.formal_completion != 'true' || steps.state_sync.outputs.formal_post_close_review == 'true') && (github.event_name == 'push' || steps.state_sync.outputs.processed == 'true' || github.event.inputs.formal_context_recovery_request != '' || (github.event_name == 'workflow_dispatch' && github.event.inputs.node == 'close')) && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_e2e_status.py
      - name: Commit downstream runtime/data artifacts
        # A failed close-derived refresh must not publish a mixed generation
        # containing fresh market facts alongside stale risk/decision state.
        if: ${{ always() && steps.state_sync.outcome != 'failure' && steps.risk_refresh.outcome != 'failure' && (steps.session_gate.outcome == 'success' || steps.capture.outcome == 'success' || steps.state_sync.outputs.processed == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Finalize runtime health from the post-retry snapshot, not the initial capture result.
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          health_path = Path('data/state/runtime_health.json')
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              raise SystemExit(0)
          if health_path.exists():
              health = json.loads(health_path.read_text(encoding='utf-8'))
              snapshot_path = Path(str(health.get('latest_snapshot') or ''))
              if snapshot_path.is_file():
                  snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
                  if str(snapshot.get('workflow_run_id', '')) == str(__import__('os').environ.get('GITHUB_RUN_ID', '')):
                      quality = str(snapshot.get('quality_status') or '')
                      if quality in {'PASS', 'DEGRADED'}:
                          provider_times = [row.get('as_of_beijing') for row in (snapshot.get('rows') or []) if row.get('as_of_beijing')]
                          health['status'] = quality
                          health['quality_status'] = quality
                          health['market_date'] = snapshot.get('market_date', health.get('market_date', ''))
                          health['node'] = snapshot.get('node', health.get('node', 'live'))
                          health['market_phase'] = snapshot.get('market_phase', health.get('market_phase', ''))
                          health['captured_at'] = snapshot.get('captured_at', health.get('captured_at', ''))
                          health['captured_at_beijing'] = snapshot.get('captured_at_beijing', health.get('captured_at_beijing', ''))
                          health['provider_as_of'] = max(provider_times) if provider_times else health.get('provider_as_of', '')
                          health['count'] = snapshot.get('count', health.get('count', 0))
                          health['latest_snapshot'] = str(snapshot_path).replace('\\\\', '/')
                          health['failure_stage'] = '' if quality == 'PASS' else health.get('failure_stage', '')
                          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          # system_consistency is owned by the dedicated audit workflow and may
          # change concurrently; keep it out of this data commit.
          # A formal request must never publish a READY projection alongside
          # an empty or differently-bound query context. Validate at the final
          # publish owner as well as at the builder boundary because the retry
          # reset/replay loop can otherwise reintroduce an empty derived file.
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", os.environ["GITHUB_SHA"], "--", "requests/live_snapshot/"],
              text=True,
          ).splitlines()
          formal_ids = []
          triggering_id = str(os.environ.get("TRIGGERING_REQUEST_ID") or "").strip()
          triggering_path = Path(os.environ.get("TRIGGERING_REQUEST_FILE") or "")
          if triggering_path.is_file():
              try:
                  obj = json.loads(triggering_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  obj = {}
              if str(obj.get("request_type") or "").upper() == "MARKET_QUOTE_REFRESH" and str(obj.get("source") or "") in {"CHATGPT_MANUAL_FORMAL_ANALYSIS", "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS", "CHATGPT_SCHEDULED_FORMAL_ANALYSIS"}:
                  formal_ids.append(triggering_id or str(obj.get("request_id") or "").strip())

          recovery_path = Path(os.environ.get("FORMAL_CONTEXT_RECOVERY_REQUEST") or "")
          if recovery_path.is_file():
              try:
                  recovery_obj = json.loads(recovery_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  recovery_obj = {}
              if str(recovery_obj.get("source") or "").upper() in {"CHATGPT_MANUAL_FORMAL_ANALYSIS", "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS", "CHATGPT_SCHEDULED_FORMAL_ANALYSIS"}:
                  recovery_id = str(recovery_obj.get("request_id") or "").strip()
                  if recovery_id:
                      formal_ids.append(recovery_id)
          if formal_ids:
              query_path = Path("data/state/query_context.json")
              if not query_path.exists() or query_path.stat().st_size == 0:
                  raise SystemExit("formal request cannot publish empty query_context.json")
              try:
                  context = json.loads(query_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"formal request query_context.json is invalid: {exc}")
              actual = str(((context.get("decision_fact_pack") or {}).get("trigger") or {}).get("request_id") or "").strip()
              if actual not in formal_ids:
                  raise SystemExit(f"formal request query_context request_id mismatch: expected={formal_ids} actual={actual}")
              pack = context.get("decision_fact_pack") or {}
              if not isinstance(pack.get("decision_work_package"), dict):
                  raise SystemExit("formal request query_context missing decision_work_package")
          PY
          git checkout -- data/state/system_consistency.json
          git reset -- data/state/notification_center.json
          # Never publish stale request-bound projections after a formal
          # query-context build failure. Core market facts remain publishable,
          # but derived decision state must wait for the same request to rebuild.
          if { [ -n "${TRIGGERING_REQUEST_ID:-}" ] || [ -n "${FORMAL_CONTEXT_RECOVERY_REQUEST:-}" ]; } && [ "${{ steps.query_context.outcome }}" != "success" ]; then
            git reset -- data/state/query_context.json data/state/decision_context.json data/state/e2e_status.json data/state/decision_trigger.json data/state/capital_efficiency_ranking.json || true
          fi
          git add -f -- data/state/query_context.json
          git add -A -- data/market/snapshots data/market/discovery_history data/state post_market_review events config/market/etf_monitor_universe.json ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
              git reset -- data/state/system_consistency.json
              git reset -- data/state/notification_center.json
          if git diff --cached --quiet; then
            exit 0
          fi
          mkdir -p /tmp/etf-downstream-publish
          git diff --cached --name-only -z > /tmp/etf-downstream-files
          while IFS= read -r -d '' file; do
            mkdir -p "/tmp/etf-downstream-publish/$(dirname "$file")"
            cp "$file" "/tmp/etf-downstream-publish/$file"
          done < /tmp/etf-downstream-files
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            while IFS= read -r -d '' file; do
              mkdir -p "$(dirname "$file")"
              cp "/tmp/etf-downstream-publish/$file" "$file"
            done < /tmp/etf-downstream-files
            # CURRENT may have advanced after the derived state was built (for
            # example a core snapshot or account/trade mirror publish). Rebuild
            # the canonical Phase4-derived trigger/ranking from execution-time
            # latest-main CURRENT after the final reset so a stale staged
            # decision_trigger cannot overwrite a newer trade/account fact.
            if [ "${{ steps.query_context.outcome }}" = "success" ] && \
               ( grep -zqxF 'data/state/decision_trigger.json' /tmp/etf-downstream-files || \
                 grep -zqxF 'data/state/capital_efficiency_ranking.json' /tmp/etf-downstream-files || \
                 { [ -n "${TRIGGERING_REQUEST_FILE:-}" ] && [ "${SCHEDULED_REVIEW_COMPLETION:-false}" != "true" ]; } ); then
              python scripts/build_state_context.py --decision-ready-only
            fi
            # query_context is the request-bound Formal Decision handoff. Keep it
            # explicitly staged through the final latest-main reset/publish loop;
            # a successful builder run is not sufficient if this file is omitted
            # from the downstream commit.
            # Explicit Formal replay must restore the historical request-bound
            # handoff after the latest-main reset, before final validation.
            if [ -n "${FORMAL_REPLAY_DWP_COMMIT:-}" ]; then
              git show "${FORMAL_REPLAY_DWP_COMMIT}:data/state/query_context.json" > data/state/query_context.json
            elif [ -n "${FORMAL_CONTEXT_RECOVERY_REQUEST:-}" ] && [ -s "/tmp/etf-downstream-publish/data/state/query_context.json" ]; then
              # Context recovery has no historical DWP commit. Preserve the
              # same request-bound handoff produced earlier in this run;
              # Phase4 rebuilding must not replace it with an empty context.
              cp "/tmp/etf-downstream-publish/data/state/query_context.json" data/state/query_context.json
            fi
            git add -f -- data/state/query_context.json
            git add -A -- data/market/snapshots data/market/discovery_history data/state post_market_review events config/market/etf_monitor_universe.json ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
            git reset -- data/state/system_consistency.json
            if [ -n "$FORMAL_PARENT_ID" ] || \
               { [ -n "$TRIGGERING_REQUEST_FILE" ] && [ "${SCHEDULED_REVIEW_COMPLETION:-false}" != "true" ]; } || \
               [ -n "${FORMAL_CONTEXT_RECOVERY_REQUEST:-}" ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("data/state/query_context.json")
          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit("final publish cannot omit non-empty request-bound query_context.json")
          try:
              context = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"final publish query_context.json is invalid: {exc}")
          # Formal replay carries a durable BDS child as the triggering envelope,
          # but query_context remains bound to the canonical parent request.
          # Validate against that parent during final publish.
          request_file = (
              os.environ.get("FORMAL_REPLAY_REQUEST", "")
              or os.environ.get("FORMAL_CONTEXT_RECOVERY_REQUEST", "")
              or os.environ.get("TRIGGERING_REQUEST_FILE", "")
          )
          expected = ""
          if request_file and Path(request_file).is_file():
              expected = str((json.loads(Path(request_file).read_text(encoding="utf-8"))).get("request_id") or "").strip()
          if expected:
              actual = str(((context.get("decision_fact_pack") or {}).get("trigger") or {}).get("request_id") or "").strip()
              if actual != expected:
                  raise SystemExit(f"final publish query_context request mismatch: expected={expected} actual={actual}")
          PY
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: record downstream market contexts and state sync [producer-run:${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
          done