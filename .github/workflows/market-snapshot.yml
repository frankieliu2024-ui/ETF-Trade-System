name: ETF market snapshot

# Schedule registration marker: this workflow remains on the default branch for GitHub cron dispatch.
on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "scheduled"
      probe_only:
        description: "Fetch and validate without writing a valid node"
        required: true
        default: "false"
      replay_request:
        description: "Existing requests/live_snapshot STATE_SYNC_ONLY request to replay from execution-time main"
        required: false
        default: ""
      formal_replay_request:
        description: "Existing canonical Formal Decision MARKET_QUOTE_REFRESH request with durable BUSINESS_DECISION_SOURCE to replay"
        required: false
        default: ""
      formal_context_recovery_request:
        description: "Existing canonical Formal Decision MARKET_QUOTE_REFRESH parent to rebuild request-bound context before BUSINESS_DECISION_SOURCE"
        required: false
        default: ""
  push:
    paths:
      - "requests/live_snapshot/**.json"
      - "scripts/cloud_runner_snapshot.py"
      - "scripts/query_time_market_refresh.py"
      - "scripts/tencent_quote.py"
      - "config/market/provider_priority.json"
  schedule:
    # Explicit opening-auction pulses, followed by ten-minute pulses in active A-share windows.
    - cron: "15,20,25,30,40,50 1 * * 1-5"
    - cron: "9,19,29,39,49,59 2-3,5-6 * * 1-5"
    - cron: "9,19 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-market-snapshot-${{ github.ref }}
  # A newer user request supersedes an older queued request. Scheduled pulses
  # and bot-produced snapshot/state commits never cancel an active request.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'request') }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "2"
      HITHINK_TIMEOUT_SECONDS: "25"
      QUERY_TIME_REFRESH: ${{ github.event_name == 'push' && 'true' || 'false' }}
      EVENT_BEFORE: ${{ github.event.before }}
      REPLAY_REQUEST: ${{ github.event.inputs.replay_request || '' }}
      FORMAL_REPLAY_REQUEST: ${{ github.event.inputs.formal_replay_request || '' }}
      FORMAL_CONTEXT_RECOVERY_REQUEST: ${{ github.event.inputs.formal_context_recovery_request || '' }}
      SCHEDULED_CRON: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Reject ambiguous recovery inputs
        if: \${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          # Use the already-bound job-level environment values. Re-evaluating
          # optional workflow_dispatch inputs in a step env can expose GitHub's
          # escaped empty/default representation (for example "\\") as a
          # non-empty string and falsely trip the mutual-exclusion gate.
          count=0
          [ -n "$REPLAY_REQUEST" ] && count=$((count + 1))
          [ -n "$FORMAL_REPLAY_REQUEST" ] && count=$((count + 1))
          [ -n "$FORMAL_CONTEXT_RECOVERY_REQUEST" ] && count=$((count + 1))
          if [ "$count" -gt 1 ]; then
            echo "replay_request, formal_replay_request and formal_context_recovery_request are mutually exclusive" >&2
            exit 1
          fi

      - name: Detect triggering request envelope before any runtime work
        id: triggering_request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          REQUEST_FILE=$(git show --format= --name-only "$GITHUB_SHA" -- 'requests/live_snapshot/*.json' | sed '/^$/d' | grep -vE '(__business_decision_source|__formal_completion)' | head -n 1 || true)
          REQUEST_EXPECTED=false
          if [ -n "$REQUEST_FILE" ]; then
            REQUEST_EXPECTED=true
            mkdir -p "/tmp/etf-triggering-request/$(dirname "$REQUEST_FILE")"
            cp "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE"
          fi
          {
            echo "TRIGGERING_REQUEST_FILE=$REQUEST_FILE"
            echo "TRIGGERING_REQUEST_EXPECTED=$REQUEST_EXPECTED"
          } >> "$GITHUB_ENV"
          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          echo "request_expected=$REQUEST_EXPECTED" >> "$GITHUB_OUTPUT"
          echo "triggering request: file=$REQUEST_FILE expected=$REQUEST_EXPECTED"

      - name: Bind explicit existing Formal Decision replay
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.formal_replay_request != '' }}
        shell: bash
        run: |
          REQUEST_FILE="${FORMAL_REPLAY_REQUEST}"
          python - "$REQUEST_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.is_absolute() or path.parts[:2] != ("requests", "live_snapshot") or ".." in path.parts or path.suffix != ".json":
              raise SystemExit("formal_replay_request must be one existing requests/live_snapshot/*.json path")
          if not path.is_file():
              raise SystemExit("formal_replay_request does not exist in execution-time main")
          request = json.loads(path.read_text(encoding="utf-8"))
          required = (
              str(request.get("request_type") or "").upper() == "MARKET_QUOTE_REFRESH"
              and str(request.get("source") or "").upper() == "CHATGPT_MANUAL_FORMAL_ANALYSIS"
              and str(request.get("intent") or "").upper() == "FORMAL_INTRADAY_ANALYSIS"
              and str(request.get("query_intent") or "").upper() == "FORMAL_INTRADAY_ANALYSIS"
              and request.get("force_refresh") is True
              and request.get("require_post_request_snapshot") is True
          )
          if not required:
              raise SystemExit("formal_replay_request is not an existing canonical Formal Decision refresh request")
          PY
          mkdir -p "/tmp/etf-triggering-request/$(dirname "$REQUEST_FILE")"
          cp "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE"
          {
            echo "TRIGGERING_REQUEST_FILE=$REQUEST_FILE"
            echo "TRIGGERING_REQUEST_EXPECTED=true"
          } >> "$GITHUB_ENV"
          echo "formal replay request: file=$REQUEST_FILE expected=true"

      - name: Bind existing Formal Decision context recovery parent
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.formal_context_recovery_request != '' }}
        shell: bash
        run: |
          REQUEST_FILE="${FORMAL_CONTEXT_RECOVERY_REQUEST}"
          python - "$REQUEST_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.is_absolute() or path.parts[:2] != ("requests", "live_snapshot") or ".." in path.parts or path.suffix != ".json" or not path.is_file():
              raise SystemExit("formal_context_recovery_request must be one existing requests/live_snapshot/*.json path")
          request = json.loads(path.read_text(encoding="utf-8"))
          valid = (str(request.get("request_type") or "").upper() == "MARKET_QUOTE_REFRESH" and str(request.get("source") or "").upper() == "CHATGPT_MANUAL_FORMAL_ANALYSIS" and str(request.get("intent") or "").upper() == "FORMAL_INTRADAY_ANALYSIS" and str(request.get("query_intent") or "").upper() == "FORMAL_INTRADAY_ANALYSIS" and request.get("force_refresh") is True and request.get("require_post_request_snapshot") is True)
          if not valid:
              raise SystemExit("formal_context_recovery_request is not an existing canonical Formal Decision refresh request")
          PY
          mkdir -p "/tmp/etf-triggering-request/$(dirname "$REQUEST_FILE")"
          cp "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE"
          echo "TRIGGERING_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          echo "TRIGGERING_REQUEST_EXPECTED=true" >> "$GITHUB_ENV"

      - name: Check exchange calendar and capture window
        id: session_gate
        run: python scripts/runtime_session_gate.py
      - name: Record skipped runtime health
        if: ${{ steps.session_gate.outputs.should_capture != 'true' && github.event_name != 'push' }}
        env:
          SESSION_MARKET_DATE: ${{ steps.session_gate.outputs.market_date }}
          SESSION_MARKET_PHASE: ${{ steps.session_gate.outputs.market_phase }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SESSION_REASON: ${{ steps.session_gate.outputs.reason }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          now = datetime.now(shanghai).isoformat(timespec='seconds')
          health_path = Path('data/state/runtime_health.json')
          current_path = Path('data/state/CURRENT.json')
          health = json.loads(health_path.read_text(encoding='utf-8')) if health_path.exists() else {}
          current = json.loads(current_path.read_text(encoding='utf-8')) if current_path.exists() else {}
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          health.update({
              'status': 'SKIPPED',
              'quality_status': 'SKIPPED',
              'reason': os.environ.get('SESSION_REASON') or 'outside_a_share_capture_window',
              'failure_stage': 'session_gate',
              'scheduled_for': 'cron:' + os.environ.get('EVENT_SCHEDULE', '') if os.environ.get('EVENT_SCHEDULE') else ('query_time_push' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'workflow_dispatch'),
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),
              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'QUERY_TIME_PUSH' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'SCHEDULE_OR_DISPATCH',
              'started_at': now,
              'finished_at': now,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': '',
              'latest_snapshot': current.get('latest_snapshot', health.get('latest_snapshot', '')),
              'market_date': os.environ.get('SESSION_MARKET_DATE', current.get('market_date', '')),
              'market_phase': os.environ.get('SESSION_MARKET_PHASE', 'OUTSIDE_SESSION'),
          })
          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY') }}
        with:
          node-version: "22"
      - name: Start optional Hithink fallback CLI bootstrap
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY') }}
        shell: bash
        run: |
          # Tencent is the primary A-share provider. Start the optional
          # fallback installation in parallel so it cannot delay first core
          # snapshot acquisition; cloud_runner_snapshot.py waits for it only
          # if a fallback path is actually needed.
          npm install --global @hithink-tech/hithink-finance-cli >/tmp/hithink-finance-install.log 2>&1 &
          echo "HITHINK_CLI_INSTALL_PID=$!" >> "$GITHUB_ENV"
      - name: Load unified provider concurrency policy
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY') }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          policy = json.loads(Path("config/runtime_policy.json").read_text(encoding="utf-8"))
          key = "query_provider_max_workers" if os.environ.get("GITHUB_EVENT_NAME") == "push" else "scheduled_provider_max_workers"
          value = policy.get(key)
          if not isinstance(value, int) or value < 1:
              raise SystemExit(f"invalid {key}={value!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"HITHINK_MAX_WORKERS={value}\n")
          print(f"provider concurrency: {key}={value}")
      - name: Run data-only snapshot
        id: capture
        # Scheduled pulses and user requests share the same phase-aware producer.
        # `scheduled` is resolved by cloud_runner_snapshot.py into auction/live/close
        # from the actual A-share market phase, avoiding generic live labels after close.
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        env:
          NODE_LABEL: ${{ github.event_name == 'push' && 'scheduled' || (github.event.inputs.node || 'scheduled') }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
          SCHEDULED_CLOSE_INTENT: ${{ steps.session_gate.outputs.close_intent }}
          REQUEST_TIME_CLOSE_RECOVERY: ${{ steps.session_gate.outputs.request_time_close_recovery }}
          WAIT_FOR_CLOSE_BOUNDARY_SECONDS: ${{ steps.session_gate.outputs.wait_for_close_boundary_seconds }}
        run: |
          if [ "${WAIT_FOR_CLOSE_BOUNDARY_SECONDS:-0}" -gt 0 ]; then
            echo "scheduled close intent received; waiting ${WAIT_FOR_CLOSE_BOUNDARY_SECONDS}s for 15:00 boundary"
            sleep "$WAIT_FOR_CLOSE_BOUNDARY_SECONDS"
          fi
          if [ "$PROBE_ONLY" = "true" ]; then
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL" --probe-only
          else
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL"
          fi
      - name: Normalize runtime health observability
        if: ${{ steps.capture.outcome == 'success' && steps.session_gate.outputs.should_capture == 'true' }}
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          path = Path('data/state/runtime_health.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          snapshot_path = Path(data.get('latest_snapshot', ''))
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8')) if snapshot_path.exists() else {}
          provider_times = [row.get('as_of_beijing') for row in (snapshot.get('rows') or []) if row.get('as_of_beijing')]
          planned = snapshot.get('planned_time', '')
          market_date = snapshot.get('market_date', data.get('market_date', ''))
          data.update({
              'scheduled_for': 'query_time_push' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else (f'{market_date} {planned}' if planned else f'{market_date} {snapshot.get("node", "")}'),
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),
              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'QUERY_TIME_PUSH' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'SCHEDULE_OR_DISPATCH',
              'started_at': data.get('run_started_at', ''),
              'finished_at': data.get('captured_at_beijing', datetime.now(shanghai).isoformat(timespec='seconds')),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': max(provider_times) if provider_times else '',
              'failure_stage': '',
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify a new valid snapshot was written
        id: snapshot_result
        if: ${{ steps.capture.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/state/runtime_health.json')
          written = False
          reason = 'runtime_health_missing'
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              status = data.get('status', '')
              same_run = str(data.get('workflow_run_id', '')) == str(os.environ.get('GITHUB_RUN_ID', ''))
              written = status in {'PASS', 'DEGRADED'} and same_run and bool(data.get('latest_snapshot'))
              reason = status or 'missing_status'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"snapshot_written={'true' if written else 'false'}\n")
              f.write(f"reason={reason}\n")
          print(json.dumps({'snapshot_written': written, 'reason': reason}, ensure_ascii=False))
          PY
      - name: Preserve triggering request envelope before core publish
        if: ${{ github.event_name == 'push' && github.event.inputs.probe_only != 'true' }}
        shell: bash
        run: |
          REQUEST_FILE="\${TRIGGERING_REQUEST_FILE:-}"
          if [ -z "$REQUEST_FILE" ]; then REQUEST_FILE=$(git show --format= --name-only "$GITHUB_SHA" -- 'requests/live_snapshot/*.json' | sed '/^$/d' | grep -vE '(__business_decision_source|__formal_completion)' | head -n 1); fi
          echo "TRIGGERING_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          if [ -n "$REQUEST_FILE" ] && [ -f "$REQUEST_FILE" ]; then
            mkdir -p "/tmp/etf-triggering-request/$(dirname "$REQUEST_FILE")"
            cp "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE"
          fi
      - name: Publish core snapshot and CURRENT immediately
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Consistency is persisted by its own workflow; excluding it prevents a
          # concurrent audit write from conflicting with the market-data commit.
          git checkout -- data/state/system_consistency.json
          git reset -- data/state/notification_center.json
                git add -A -- data/market/snapshots data/state
                git reset -- data/state/system_consistency.json
                git reset -- data/state/notification_center.json
          if ! git diff --cached --quiet; then
            mkdir -p /tmp/etf-core-publish
            git diff --cached --name-only -z > /tmp/etf-core-files
            while IFS= read -r -d '' file; do
              mkdir -p "/tmp/etf-core-publish/$(dirname "$file")"
              cp "$file" "/tmp/etf-core-publish/$file"
            done < /tmp/etf-core-files
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              while IFS= read -r -d '' file; do
                mkdir -p "$(dirname "$file")"
                cp "/tmp/etf-core-publish/$file" "$file"
              done < /tmp/etf-core-files
              git add -A -- data/market/snapshots data/state
              git reset -- data/state/system_consistency.json
              git commit -m "data: publish core market snapshot"
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then exit 1; fi
            done
          fi
      - name: Quick retry failed core objects after initial publish
        id: quick_retry
        # A user request gets the first publishable PASS/DEGRADED/FAILED result
        # immediately. Slow repair remains a scheduled, post-publish activity.
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' && github.event_name != 'push' }}
        run: python scripts/cloud_runner_snapshot.py --retry-failed
      - name: Process optional broker/dashboard state sync
        id: state_sync
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.replay_request != '' || github.event.inputs.formal_replay_request != ''))) && github.event.inputs.probe_only != 'true' }}
        shell: bash
        run: |
          # Process queued state-sync runs against execution-time main while
          # preserving only the triggering request payload.
          git fetch origin main
          if [ -n "${FORMAL_CONTEXT_RECOVERY_REQUEST:-}" ]; then
            request_files=""
          elif [ -n "${REPLAY_REQUEST:-}" ]; then
            request_files="$REPLAY_REQUEST"
          elif [ -n "${FORMAL_REPLAY_REQUEST:-}" ]; then
            # Explicit Formal Decision recovery reuses the immutable parent
            # only to locate its already-durable BUSINESS_DECISION_SOURCE.
            # It must not create a fresh market capture or a new decision identity.
            parent_request_id=$(python - "${FORMAL_REPLAY_REQUEST}" <<'PY'
          import json, sys
          from pathlib import Path
          request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(str(request.get("request_id") or "").strip())
          PY
            )
            mapfile -t formal_sources < <(find requests/live_snapshot -maxdepth 1 -type f -name "${parent_request_id}__business_decision_source_*.json" -print | sort)
            if [ "${#formal_sources[@]}" -lt 1 ]; then
              echo "formal replay requires at least one durable BUSINESS_DECISION_SOURCE for parent=${parent_request_id}; found=0" >&2
              exit 1
            fi
            # BDS Actor retries are a supported same-decision recovery pattern.
            # Preserve every durable attempt, but replay only the newest attempt
            # when all attempts prove the same parent + decision identity.
            # Distinct decision identities under one parent remain ambiguous and
            # fail closed instead of being guessed by filename or wall-clock time.
            replay_binding=$(python - "$parent_request_id" "${formal_sources[@]}" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          parent = sys.argv[1]
          paths = [Path(item) for item in sys.argv[2:]]
          rows = []
          decision_ids = set()
          for path in paths:
              source = json.loads(path.read_text(encoding="utf-8"))
              if str(source.get("parent_request_id") or "").strip() != parent:
                  raise SystemExit(f"formal replay BDS parent mismatch: {path}")
              decision_id = str(source.get("decision_id") or "").strip()
              if not decision_id:
                  raise SystemExit(f"formal replay BDS decision_id missing: {path}")
              decision_ids.add(decision_id)
              commit = subprocess.run(
                  ["git", "log", "--diff-filter=A", "--format=%H", "--", str(path)],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
              if len(commit) != 1:
                  raise SystemExit(f"formal replay cannot resolve unique BDS introduction commit: {path}")
              rows.append((path, commit[0]))
          if len(decision_ids) != 1:
              raise SystemExit(
                  "formal replay refuses multiple durable decision identities for one parent: "
