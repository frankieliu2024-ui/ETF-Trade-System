name: ETF market snapshot

on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "manual"
      probe_only:
        description: "Fetch and validate without writing a valid node"
        required: true
        default: "false"
  schedule:
    # UTC. Runs every 10 minutes across the possible A-share trading window.
    # The Python runner performs the Asia/Shanghai session guard and exits cleanly
    # outside 09:30-11:30 / 13:00-15:00. This replaces legacy fixed screenshot nodes.
    - cron: "*/10 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "3"
      HITHINK_TIMEOUT_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install hithink-finance CLI
        run: npm install --global @hithink-tech/hithink-finance-cli
      - name: Run data-only snapshot
        env:
          NODE_LABEL: ${{ github.event.inputs.node || 'scheduled' }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
        run: |
          if [ "$PROBE_ONLY" = "true" ]; then
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL" --probe-only
          else
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL"
          fi
      - name: Build state context and candidates
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_state_context.py
      - name: Build on-demand query context
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_query_context.py
      - name: Build post-market review event when closed
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_post_market_review.py
      - name: Build ChatGPT task read probe
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_chatgpt_task_probe.py
      - name: Commit data artifacts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/snapshots data/state/CURRENT.json data/state/dashboard_update_candidate.json data/state/decision_context.json data/state/query_context.json data/state/chatgpt_task_probe.json post_market_review/post_market_review_event.json data/state/review_context.json events/events.jsonl
          git diff --cached --quiet || git commit -m "data: record market snapshot"
          git push
