name: ETF market snapshot

on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "manual"
  schedule:
    - cron: "25 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "3"
      HITHINK_TIMEOUT_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install hithink-finance CLI
        run: npm install --global @hithink-tech/hithink-finance-cli
      - name: Run data-only snapshot
        env:
          NODE_LABEL: ${{ github.event.inputs.node || 'scheduled' }}
        run: python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL"
      - name: Commit data artifacts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/snapshots data/state/CURRENT.json
          git diff --cached --quiet || git commit -m "data: record market snapshot"
          git push
