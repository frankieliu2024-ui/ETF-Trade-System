name: ETF market snapshot

# Schedule registration marker: this workflow remains on the default branch for GitHub cron dispatch.
on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "scheduled"
      probe_only:
        description: "Fetch and validate without writing a valid node"
        required: true
        default: "false"
      replay_request:
        description: "Existing requests/live_snapshot STATE_SYNC_ONLY or ACCOUNT_FACT_REFRESH request to replay from execution-time main"
        required: false
        default: ""
      formal_replay_request:
        description: "Existing canonical Formal Decision MARKET_QUOTE_REFRESH request with durable BUSINESS_DECISION_SOURCE to replay"
        required: false
        default: ""
      formal_replay_forensic:
        description: "Enable diagnostic forensic fingerprints for an existing Formal Decision replay only"
        required: false
        default: "false"
        type: boolean
      formal_context_recovery_request:
        description: "Existing canonical Formal Decision MARKET_QUOTE_REFRESH parent to rebuild request-bound context before BUSINESS_DECISION_SOURCE"
        required: false
        default: ""
  push:
    paths:
      - "requests/live_snapshot/**"
      - "data/requests/**"
      - "requests/trade_fact_correction/**"
      - "scripts/cloud_runner_snapshot.py"
      - "scripts/query_time_market_refresh.py"
      - "scripts/tencent_quote.py"
      - "config/market/provider_priority.json"
  schedule:
    # Market data pulses.
    # Deterministic Formal Decision ingress: Beijing 09:00.
    - cron: "0 1 * * 1-5"
    - cron: "15,20,25,30,40,50 1 * * 1-5"
    # Keep a pre-10:00 A-share snapshot available for Formal Decision PIT selection.
    - cron: "55 1 * * 1-5"
    - cron: "9,19,29,39,49,59 2-3,5-6 * * 1-5"
    - cron: "9,19 7 * * 1-5"
    # Deterministic Formal Decision ingress: Beijing 10:00, 11:00, 13:30, 14:30.
    # Holiday applicability remains enforced by the canonical market calendar.
    - cron: "0 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

concurrency:
  # Keep the canonical snapshot writer in the shared main-state writer lane.
  group: etf-main-state-writer
  # Formal Decision parents are durable request identities. A later request
  # must never cancel an active run that may still be producing request-bound
  # facts for an unfinished parent. Keep the existing shared producer queue;
  # recovery/deduplication remains owned by the canonical request/recovery path.
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "2"
      HITHINK_TIMEOUT_SECONDS: "25"
      QUERY_TIME_REFRESH: ${{ github.event_name == 'push' && 'true' || 'false' }}
      EVENT_BEFORE: ${{ github.event.before }}
      REPLAY_REQUEST: ${{ github.event.inputs.replay_request || '' }}
      FORMAL_REPLAY_REQUEST: ${{ github.event.inputs.formal_replay_request || '' }}
      ETF_FORMAL_REPLAY_FORENSIC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.formal_replay_request != '' && github.event.inputs.formal_replay_forensic == 'true' && '1' || '0' }}
      FORMAL_CONTEXT_RECOVERY_REQUEST: ${{ github.event.inputs.formal_context_recovery_request || '' }}
      GITHUB_EVENT_INPUTS_NODE: ${{ github.event.inputs.node || '' }}
      SCHEDULED_CRON: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Canonicalize legacy formal request ingress
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          legacy_files="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- 'data/requests/*.json' || true)"
          if [ -z "$legacy_files" ]; then
            exit 0
          fi
          mkdir -p requests/live_snapshot
          while IFS= read -r legacy_file; do
            [ -n "$legacy_file" ] || continue
            python - "$legacy_file" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("task_id") != "ETF正式决策" or payload.get("request_type") != "MARKET_QUOTE_REFRESH":
              raise SystemExit("unsupported legacy request ingress: " + str(path))
          target = Path("requests/live_snapshot") / path.name
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          path.unlink()
          PY
          done <<< "$legacy_files"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests/live_snapshot data/requests
          git commit -m "fix: canonicalize legacy formal request ingress"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
          done
          exit 1
      - name: Apply confirmed trade fact corrections
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          correction_files="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- 'requests/trade_fact_correction/*.json' || true)"
          if [ -z "$correction_files" ]; then
            echo "No confirmed trade fact correction ingress in this push."
            exit 0
          fi
          while IFS= read -r correction_file; do
            [ -z "$correction_file" ] && continue
            echo "Applying canonical trade fact correction: $correction_file"
            python scripts/apply_trade_fact_correction.py "$correction_file"
          done <<< "$correction_files"
          if git diff --quiet; then
            echo "Correction already projected; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/account_fact.json data/state/etf_strategy_equity.json data/state/trade_fact_correction_receipt.json events/trades ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md ETF当前状态_DASHBOARD.md
          git commit -m "chore: apply confirmed trade fact corrections"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort || true
            if [ "$attempt" = "3" ]; then
              echo "bounded main publication retry exhausted" >&2
              exit 1
            fi
            sleep 2
          done

      # Formal Decision consumes current main facts directly. This workflow remains
      # responsible for market-data pulses only; it must not create a second
      # request-bound Formal Decision fact-production chain.
      - name: Reject ambiguous recovery inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          # Use the already-bound job-level environment values. Re-evaluating
          # optional workflow_dispatch inputs in a step env can expose GitHub's
          # escaped empty/default representation (for example "\\") as a
          # non-empty string and falsely trip the mutual-exclusion gate.
          count=0
          [ -n "$REPLAY_REQUEST" ] && count=$((count + 1))
          [ -n "$FORMAL_REPLAY_REQUEST" ] && count=$((count + 1))
          [ -n "$FORMAL_CONTEXT_RECOVERY_REQUEST" ] && count=$((count + 1))
          if [ "$count" -gt 1 ]; then
            echo "replay_request, formal_replay_request and formal_context_recovery_request are mutually exclusive" >&2
            exit 1
          fi
          forensic_input="${{ github.event.inputs.formal_replay_forensic || 'false' }}"
          if [ "$forensic_input" != "true" ] && [ "$forensic_input" != "false" ]; then
            echo "formal_replay_forensic must be true or false" >&2
            exit 1
          fi
          if [ "$forensic_input" = "true" ] && [ -z "$FORMAL_REPLAY_REQUEST" ]; then
            echo "formal_replay_forensic=true requires formal_replay_request" >&2
            exit 1
          fi

      - name: Detect triggering request envelope before any runtime work
        id: triggering_request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          ALL_REQUEST_FILES=$(git show --format= --name-only "$GITHUB_SHA" -- 'requests/live_snapshot/*.json' | sed '/^$/d' || true)
          REQUEST_FILE=$(printf '%s\n' "$ALL_REQUEST_FILES" | grep -vE '(__business_decision_source)' | head -n 1 || true)
          REQUEST_EXPECTED=false
          if [ -n "$REQUEST_FILE" ]; then
            REQUEST_EXPECTED=true
            mkdir -p "/tmp/etf-triggering-request/$(dirname "$REQUEST_FILE")"
            cp "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE"
            # Manual requests may contain a producer/client timestamp that is
            # ahead of the GitHub runner receipt time. Normalize the request before
            # any PIT routing or query-context construction, and use the normalized
            # envelope for the entire run. Preserve the supplied time only as audit
            # metadata; requested_at_beijing is the runner receipt clock.
            python - "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.runtime_session_gate import normalize_manual_request_session

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          request = json.loads(src.read_text(encoding="utf-8"))
          source = str(request.get("source") or "").strip().upper()
          if source in {
              "CHATGPT_MANUAL_FORMAL_ANALYSIS",
              "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS",
          }:
              policy = json.loads(Path("config/runtime_policy.json").read_text(encoding="utf-8"))
              request = normalize_manual_request_session(request, policy)
          serialized = json.dumps(request, ensure_ascii=False, indent=2) + "\n"
          src.write_text(serialized, encoding="utf-8")
          dst.write_text(serialized, encoding="utf-8")
          PY
          fi
          {
            echo "TRIGGERING_REQUEST_FILE=$REQUEST_FILE"
            echo "TRIGGERING_REQUEST_EXPECTED=$REQUEST_EXPECTED"
          } >> "$GITHUB_ENV"
          FORMAL_COMPLETION=false
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if python - "$candidate" <<'PY'
          import json, sys
          from pathlib import Path
          request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          is_formal_decision_completion = (
              str(request.get("source") or "").upper()
              in {"CHATGPT_FORMAL_DECISION_COMPLETION", "CHATGPT_MANUAL_FORMAL_COMPLETION"}
              or (
                  str(request.get("request_type") or "").upper() == "SCHEDULED_REVIEW_COMPLETION"
                  and str(request.get("source") or "").upper() == "CHATGPT_SCHEDULED_REVIEW_ACTOR"
                  and (
                      str(request.get("report_type") or ((request.get("presentation_binding") or {}).get("report_type") or "")).upper()
                      == "ETF_FORMAL_DECISION"
                  )
                  and str(request.get("task_id") or "").strip() == "ETF正式决策"
              )
          )
          raise SystemExit(0 if is_formal_decision_completion else 1)
          PY
            then
              FORMAL_COMPLETION=true
              break
            fi
          done <<< "$ALL_REQUEST_FILES"
          echo "formal_completion=$FORMAL_COMPLETION" >> "$GITHUB_OUTPUT"
          echo "FORMAL_COMPLETION=$FORMAL_COMPLETION" >> "$GITHUB_ENV"
          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          echo "request_expected=$REQUEST_EXPECTED" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUEST_FILE" ] && [ -f "$REQUEST_FILE" ]; then
            request_id=$(python - "$REQUEST_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("request_id")
          print(str(value or "").strip())
          PY
            )
          else
            request_id=""
          fi
          echo "TRIGGERING_REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "triggering request: file=$REQUEST_FILE id=$request_id expected=$REQUEST_EXPECTED formal_completion=$FORMAL_COMPLETION"

      - name: Validate Formal Decision task identity before runtime work
        if: ${{ env.TRIGGERING_REQUEST_EXPECTED == 'true' && env.FORMAL_COMPLETION != 'true' }}
        shell: bash
        run: |
          python - "$TRIGGERING_REQUEST_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          request = json.loads(path.read_text(encoding="utf-8"))
          formal_sources = {
              "CHATGPT_MANUAL_FORMAL_ANALYSIS",
              "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS",
              "CHATGPT_SCHEDULED_FORMAL_ANALYSIS",
          }
          if str(request.get("source") or "").strip() in formal_sources:
              task_id = str(request.get("task_id") or "").strip()
              if task_id != "ETF正式决策":
                  raise SystemExit(
                      "OWNER_REJECTED: Formal Decision task_id must be exactly ETF正式决策; "
                      f"got {task_id or '<missing>'}"
                  )
          PY

      - name: Bind explicit existing Formal Decision replay
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.formal_replay_request != '' }}
        shell: bash
        run: |
          REQUEST_FILE="${FORMAL_REPLAY_REQUEST}"
          python - "$REQUEST_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.is_absolute() or path.parts[:2] != ("requests", "live_snapshot") or ".." in path.parts or path.suffix != ".json":
              raise SystemExit("formal_replay_request must be one existing requests/live_snapshot/*.json path")
          if not path.is_file():
              raise SystemExit("formal_replay_request does not exist in execution-time main")
          request = json.loads(path.read_text(encoding="utf-8"))
          intent = request.get("intent")
          query_intent = (
              intent.get("query_intent") if isinstance(intent, dict) else request.get("query_intent") or intent
          )
          required = (
              str(request.get("request_type") or "").upper() == "MARKET_QUOTE_REFRESH"
              and str(request.get("source") or "").upper() in {"CHATGPT_MANUAL_FORMAL_ANALYSIS", "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS", "CHATGPT_SCHEDULED_FORMAL_ANALYSIS"}
              and str(query_intent or "").upper() == "FORMAL_INTRADAY_ANALYSIS"
              and request.get("force_refresh") is True
              and request.get("require_post_request_snapshot") is True
          )
          if not required:
              raise SystemExit("formal_replay_request is not an existing canonical Formal Decision refresh request")
          PY
          mkdir -p "/tmp/etf-triggering-request/$(dirname "$REQUEST_FILE")"
          cp "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE"
          {
            echo "TRIGGERING_REQUEST_FILE=$REQUEST_FILE"
            echo "TRIGGERING_REQUEST_EXPECTED=true"
          } >> "$GITHUB_ENV"
          echo "formal replay request: file=$REQUEST_FILE expected=true"

      - name: Bind existing Formal Decision context recovery parent
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.formal_context_recovery_request != '' }}
        shell: bash
        run: |
          REQUEST_FILE="${FORMAL_CONTEXT_RECOVERY_REQUEST}"
          python - "$REQUEST_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.is_absolute() or path.parts[:2] != ("requests", "live_snapshot") or ".." in path.parts or path.suffix != ".json" or not path.is_file():
              raise SystemExit("formal_context_recovery_request must be one existing requests/live_snapshot/*.json path")
          request = json.loads(path.read_text(encoding="utf-8"))
          intent = request.get("intent")
          query_intent = (
              intent.get("query_intent") if isinstance(intent, dict) else request.get("query_intent") or intent
          )
          valid = (str(request.get("request_type") or "").upper() == "MARKET_QUOTE_REFRESH" and str(request.get("source") or "").upper() in {"CHATGPT_MANUAL_FORMAL_ANALYSIS", "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS", "CHATGPT_SCHEDULED_FORMAL_ANALYSIS"} and str(query_intent or "").upper() == "FORMAL_INTRADAY_ANALYSIS" and request.get("force_refresh") is True and request.get("require_post_request_snapshot") is True)
          if not valid:
              raise SystemExit("formal_context_recovery_request is not an existing canonical Formal Decision refresh request")
          PY
          mkdir -p "/tmp/etf-triggering-request/$(dirname "$REQUEST_FILE")"
          cp "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE"
          # Normalize the recovery envelope in the workspace and in the preserved
          # copy. The query-context builder consumes REQUEST_FILE from the workspace;
          # normalizing only the temp copy leaves it reading the raw/shared envelope.
          # Keep scheduled identity unchanged; normalize both manual entry forms.
          python - "$REQUEST_FILE" "/tmp/etf-triggering-request/$REQUEST_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.runtime_session_gate import normalize_manual_request_session
          src = Path(sys.argv[1])
          preserved = Path(sys.argv[2])
          request = json.loads(src.read_text(encoding="utf-8"))
          source = str(request.get("source") or request.get("requested_by") or "").strip().upper()
          if source in {
              "CHATGPT_MANUAL_FORMAL_ANALYSIS",
              "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS",
          }:
              policy = json.loads(Path("config/runtime_policy.json").read_text(encoding="utf-8"))
              request = normalize_manual_request_session(request, policy)
          # Every Formal Decision parent is its own canonical parent. Normalize
          # the identity before any request-bound context or derived state is
          # built; an empty parent must never reach the later projection check.
          formal_sources = {
              "CHATGPT_MANUAL_FORMAL_ANALYSIS",
              "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS",
              "CHATGPT_SCHEDULED_FORMAL_ANALYSIS",
          }
          if source in formal_sources:
              request_id = str(request.get("request_id") or "").strip()
              parent_id = str(request.get("parent_request_id") or "").strip() or request_id
              if not request_id or parent_id != request_id:
                  raise SystemExit(                      f"formal parent identity missing or conflicting: "
                      f"request_id={request_id} parent_request_id={parent_id}"
                  )
              request["parent_request_id"] = parent_id
          serialized = json.dumps(request, ensure_ascii=False, indent=2) + "\n"
          src.write_text(serialized, encoding="utf-8")
          preserved.write_text(serialized, encoding="utf-8")
          PY
          echo "TRIGGERING_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          echo "TRIGGERING_REQUEST_EXPECTED=true" >> "$GITHUB_ENV"

      - name: Check exchange calendar and capture window
        id: session_gate
        run: python scripts/runtime_session_gate.py
      - name: Record skipped runtime health
        if: ${{ steps.session_gate.outputs.should_capture != 'true' }}
        env:
          SESSION_MARKET_DATE: ${{ steps.session_gate.outputs.market_date }}
          SESSION_MARKET_PHASE: ${{ steps.session_gate.outputs.market_phase }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SESSION_REASON: ${{ steps.session_gate.outputs.reason }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          now = datetime.now(shanghai).isoformat(timespec='seconds')
          health_path = Path('data/state/runtime_health.json')
          current_path = Path('data/state/CURRENT.json')
          health = json.loads(health_path.read_text(encoding='utf-8')) if health_path.exists() else {}
          current = json.loads(current_path.read_text(encoding='utf-8')) if current_path.exists() else {}
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          health.update({
              'status': 'SKIPPED',
              'quality_status': 'SKIPPED',
              'reason': os.environ.get('SESSION_REASON') or 'outside_a_share_capture_window',
              'failure_stage': 'session_gate',
              'scheduled_for': 'cron:' + os.environ.get('EVENT_SCHEDULE', '') if os.environ.get('EVENT_SCHEDULE') else ('query_time_push' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'workflow_dispatch'),
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'QUERY_TIME_PUSH' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'SCHEDULE_OR_DISPATCH',
              'started_at': now,
              'finished_at': now,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': '',
              'latest_snapshot': current.get('latest_snapshot', health.get('latest_snapshot', '')),
              'market_date': current.get('market_date') or os.environ.get('SESSION_MARKET_DATE', ''),
              'market_phase': os.environ.get('SESSION_MARKET_PHASE', 'OUTSIDE_SESSION'),
          })
          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY' && steps.session_gate.outputs.request_class != 'BUSINESS_DECISION_SOURCE') }}
        with:
          node-version: "22"
      - name: Start optional Hithink fallback CLI bootstrap
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY' && steps.session_gate.outputs.request_class != 'BUSINESS_DECISION_SOURCE') }}
        shell: bash
        run: |
          # Tencent is the primary A-share provider. Start the optional
          # fallback installation in parallel so it cannot delay first core
          # snapshot acquisition; cloud_runner_snapshot.py waits for it only
          # if a fallback path is actually needed.
          npm install --global @hithink-tech/hithink-finance-cli >/tmp/hithink-finance-install.log 2>&1 &
          echo "HITHINK_CLI_INSTALL_PID=$!" >> "$GITHUB_ENV"
      - name: Load unified provider concurrency policy
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY' && steps.session_gate.outputs.request_class != 'BUSINESS_DECISION_SOURCE') }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          policy = json.loads(Path("config/runtime_policy.json").read_text(encoding="utf-8"))
          key = "query_provider_max_workers" if os.environ.get("GITHUB_EVENT_NAME") == "push" else "scheduled_provider_max_workers"
          value = policy.get(key)
          if not isinstance(value, int) or value < 1:
