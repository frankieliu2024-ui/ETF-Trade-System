name: ETF market snapshot

# Schedule registration marker: this workflow remains on the default branch for GitHub cron dispatch.
on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - close
      probe_only:
        description: "Fetch and validate without writing a valid node"
        required: true
        default: "false"
  schedule:
    # Unified ten-minute pulse clock with Beijing coverage 08:00-16:00.
    # The 15:00 node remains the authoritative A-share close fact; other nodes are phase-gated.
    - cron: "0,10,20,30,40,50 0-8 * * 1-5" # Beijing 08:00-16:00 Mon-Fri

permissions:
  contents: write

concurrency:
  # Reserve a dedicated lane for the canonical A-share pulse. Other state
  # writers must not cancel or supersede a scheduled market capture.
  # Publication remains guarded by the existing canonical mutation checks.
  group: etf-market-snapshot-pulse
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "2"
      HITHINK_TIMEOUT_SECONDS: "25"
      GITHUB_EVENT_INPUTS_NODE: ${{ github.event.inputs.node || '' }}
      GITHUB_EVENT_INPUTS_PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
      SCHEDULED_CRON: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check exchange calendar and capture window
        id: session_gate
        run: python scripts/runtime_session_gate.py
      - name: Resolve latest legal close reference
        id: latest_reference
        # Outside the A-share capture window, return the last validated close as a
        # reference result. This path never fabricates a new live/close snapshot
        # and never mutates CURRENT or creates a second market-data producer.
        if: ${{ steps.session_gate.outputs.process_latest_reference == 'true' }}
        env:
          REFERENCE_SNAPSHOT: ${{ steps.session_gate.outputs.latest_reference_snapshot }}
          REFERENCE_MARKET_DATE: ${{ steps.session_gate.outputs.latest_reference_market_date }}
          REFERENCE_REASON: ${{ steps.session_gate.outputs.latest_reference_reason }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path.cwd().resolve()
          relative = os.environ.get("REFERENCE_SNAPSHOT", "").strip()
          if not relative:
              raise SystemExit("latest legal close reference path is empty")
          path = (root / relative).resolve()
          if not path.is_relative_to(root) or not path.is_file():
              raise SystemExit(f"latest legal close reference is invalid: {relative}")
          snapshot = json.loads(path.read_text(encoding="utf-8"))
          if snapshot.get("market_date") != os.environ.get("REFERENCE_MARKET_DATE"):
              raise SystemExit("latest legal close reference market date mismatch")
          if str(snapshot.get("node", "")).lower() != "close":
              raise SystemExit("latest legal close reference is not a close snapshot")
          if str(snapshot.get("quality_status", "")).upper() not in {"PASS", "DEGRADED"}:
              raise SystemExit("latest legal close reference is not usable")
          rows = snapshot.get("rows")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("latest legal close reference has no rows")
          discovery_path = root / "data" / "state" / "formal_discovery_current.json"
          discovery = json.loads(discovery_path.read_text(encoding="utf-8")) if discovery_path.is_file() else {}
          discovery_status = str(discovery.get("status", "")).upper()
          discovery_bound = bool(
              discovery
              and discovery.get("market_date") == snapshot.get("market_date")
              and str(discovery.get("latest_valid_node", "")).lower() == "close"
              and discovery.get("latest_snapshot") == relative
              and discovery_status in {"READY", "PASS", "DEGRADED"}
          )
          result = {
              "mode": "LATEST_LEGAL_CLOSE_REFERENCE",
              "market_date": snapshot.get("market_date"),
              "snapshot": relative,
              "quality_status": str(snapshot.get("quality_status", "")).upper(),
              "row_count": len(rows),
              "reason": os.environ.get("REFERENCE_REASON", ""),
              "current_mutated": False,
              "new_snapshot_written": False,
              "discovery": {
                  "status": discovery_status if discovery_bound else "NOT_AVAILABLE",
                  "bound_to_same_snapshot": discovery_bound,
                  "candidate_count": discovery.get("candidate_count") if discovery_bound else None,
                  "generated_at_beijing": discovery.get("generated_at_beijing", "") if discovery_bound else "",
                  "source": "existing_same_node_formal_discovery" if discovery_bound else "",
              },
          }
          print(json.dumps(result, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## ETF market snapshot result\n\n")
              summary.write("本次未执行新的行情采集，已返回最近一次合格收盘行情作为引用；Discovery仅复用同节点合法结果，不生成第二份。\n\n")
              summary.write("```json\n" + json.dumps(result, ensure_ascii=False, indent=2) + "\n```\n")
          PY
      - name: Record skipped runtime health
        if: ${{ steps.session_gate.outputs.should_capture != 'true' && steps.session_gate.outputs.process_latest_reference != 'true' }}
        env:
          SESSION_MARKET_DATE: ${{ steps.session_gate.outputs.market_date }}
          SESSION_MARKET_PHASE: ${{ steps.session_gate.outputs.market_phase }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SESSION_REASON: ${{ steps.session_gate.outputs.reason }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
          ETF_HEALTH_PATH: ${{ 'data/state/runtime_health.json' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          now = datetime.now(shanghai).isoformat(timespec='seconds')
          health_path = Path(os.environ.get('ETF_HEALTH_PATH', 'data/state/runtime_health.json'))
          current_path = Path('data/state/CURRENT.json')
          health = json.loads(health_path.read_text(encoding='utf-8')) if health_path.exists() else {}
          current = json.loads(current_path.read_text(encoding='utf-8')) if current_path.exists() else {}
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          health.update({
              'status': 'SKIPPED',
              'quality_status': 'SKIPPED',
              'reason': os.environ.get('SESSION_REASON') or 'outside_a_share_capture_window',
              'failure_stage': 'session_gate',
              'scheduled_for': 'cron:' + os.environ.get('EVENT_SCHEDULE', '') if os.environ.get('EVENT_SCHEDULE') else ('workflow_dispatch'),
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'SCHEDULE_OR_DISPATCH',
              'started_at': now,
              'finished_at': now,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': '',
              'latest_snapshot': current.get('latest_snapshot', health.get('latest_snapshot', '')),
              'market_date': current.get('market_date') or os.environ.get('SESSION_MARKET_DATE', ''),
              'market_phase': os.environ.get('SESSION_MARKET_PHASE', 'OUTSIDE_SESSION'),
          })
          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/setup-node@v7
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        with:
          node-version: "22"
      - name: Start optional Hithink fallback CLI bootstrap
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        shell: bash
        run: |
          # Tencent is the primary A-share provider. Start the optional
          # fallback installation in parallel so it cannot delay first core
          # snapshot acquisition; cloud_runner_snapshot.py waits for it only
          # if a fallback path is actually needed.
          npm install --global @hithink-tech/hithink-finance-cli >/tmp/hithink-finance-install.log 2>&1 &
          echo "HITHINK_CLI_INSTALL_PID=$!" >> "$GITHUB_ENV"
      - name: Load unified provider concurrency policy
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          policy = json.loads(Path("config/runtime_policy.json").read_text(encoding="utf-8"))
          key = "scheduled_provider_max_workers"
          value = policy.get(key)
          if not isinstance(value, int) or value < 1:
              raise SystemExit(f"invalid {key}={value!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"HITHINK_MAX_WORKERS={value}\n")
          print(f"provider concurrency: {key}={value}")
          PY

      - name: Run data-only snapshot
        id: capture
        # Scheduled pulses and user requests share the same phase-aware producer.
        # `scheduled` is resolved by cloud_runner_snapshot.py into auction/live/close
        # from the actual A-share market phase, avoiding generic live labels after close.
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        env:
          NODE_LABEL: ${{ github.event.inputs.node || 'scheduled' }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
          SCHEDULED_CLOSE_INTENT: ${{ steps.session_gate.outputs.close_intent }}
          REQUEST_TIME_CLOSE_RECOVERY: ${{ steps.session_gate.outputs.request_time_close_recovery }}
          WAIT_FOR_CLOSE_BOUNDARY_SECONDS: ${{ steps.session_gate.outputs.wait_for_close_boundary_seconds }}
          # Query-time refresh has its own health projection and must not overwrite canonical snapshot health.
          ETF_HEALTH_PATH: data/state/runtime_health.json
        run: |
          if [ "${WAIT_FOR_CLOSE_BOUNDARY_SECONDS:-0}" -gt 0 ]; then
            echo "scheduled close intent received; waiting ${WAIT_FOR_CLOSE_BOUNDARY_SECONDS}s for 15:00 boundary"
            sleep "$WAIT_FOR_CLOSE_BOUNDARY_SECONDS"
          fi
          if [ "$PROBE_ONLY" = "true" ]; then
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL" --probe-only
          else
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL"
          fi
      - name: Normalize runtime health observability
        if: ${{ steps.capture.outcome == 'success' && steps.session_gate.outputs.should_capture == 'true' }}
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
          ETF_HEALTH_PATH: data/state/runtime_health.json
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          path = Path(os.environ.get('ETF_HEALTH_PATH', 'data/state/runtime_health.json'))
          data = json.loads(path.read_text(encoding='utf-8'))
          snapshot_path = Path(data.get('latest_snapshot', ''))
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8')) if snapshot_path.exists() else {}
          provider_times = [row.get('as_of_beijing') for row in (snapshot.get('rows') or []) if row.get('as_of_beijing')]
          planned = snapshot.get('planned_time', '')
          market_date = snapshot.get('market_date', data.get('market_date', ''))
          data.update({
              'scheduled_for': f'{market_date} {planned}' if planned else f'{market_date} {snapshot.get("node", "")}',
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),
              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'SCHEDULE_OR_DISPATCH',
              'started_at': data.get('run_started_at', ''),
              'finished_at': data.get('captured_at_beijing', datetime.now(shanghai).isoformat(timespec='seconds')),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': max(provider_times) if provider_times else '',
              'failure_stage': '',
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify a new valid snapshot was written
        id: snapshot_result
        if: ${{ steps.capture.outcome == 'success' }}
        env:
          ETF_HEALTH_PATH: data/state/runtime_health.json
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ.get('ETF_HEALTH_PATH', 'data/state/runtime_health.json'))
          written = False
          reason = 'runtime_health_missing'
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              status = data.get('status', '')
              same_run = str(data.get('workflow_run_id', '')) == str(os.environ.get('GITHUB_RUN_ID', ''))
              written = status in {'PASS', 'DEGRADED'} and same_run and bool(data.get('latest_snapshot'))
              reason = status or 'missing_status'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"snapshot_written={'true' if written else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"latest_snapshot={data.get('latest_snapshot', '')}\n")
          print(json.dumps({'snapshot_written': written, 'reason': reason}, ensure_ascii=False))
          PY
      - name: Refresh fixed-ratio metrics from this snapshot
        id: fixed_ratio_refresh
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Only update the canonical fixed-ratio state here. Dashboard is
          # rendered once later by build_state_context after all projections exist.
          python scripts/refresh_fixed_ratio_from_market_snapshot.py

      - name: Refresh held-stock market projection from this snapshot run
        id: held_stock_market
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event_name != 'push' && github.event.inputs.probe_only != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The market snapshot is the only existing A-share pulse owner.
          # Refresh the already-existing held-stock projection in the same run
          # so CURRENT and account-stock market facts share one capture cycle.
          python scripts/build_stock_context.py
          python scripts/build_account_stock_market.py
      - name: Stage verified core snapshot and CURRENT
        if: ${{ (steps.snapshot_result.outputs.snapshot_written == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.probe_only != 'true') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep verified A-share facts staged in this workspace. The core
          # snapshot, same-batch Discovery, and A-share derived projections are
          # published together below, so main never exposes a new CURRENT with
          # an older Discovery projection between producer commits.
          git add -- data/market/snapshots data/state/CURRENT.json data/state/runtime_health.json

      - name: Generate node-local ETF Discovery from verified A-share pulse
        id: current_discovery
        # The canonical Discovery producer is invoked once after a verified A-share pulse.
        if: ${{ (steps.snapshot_result.outputs.snapshot_written == 'true' && github.event_name != 'push' && github.event.inputs.probe_only != 'true') }}
        env:
          DISCOVERY_SNAPSHOT_PATH: ${{ steps.snapshot_result.outputs.latest_snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          discovery_result="$(python scripts/build_weekly_discovery.py)"
          echo "$discovery_result"
          python - "$discovery_result" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          result = json.loads(sys.argv[1])
          if str(result.get("status") or "").upper() not in {"READY", "PASS", "DEGRADED"}: raise SystemExit("Discovery producer did not publish a usable node result")
          current = json.loads(Path("data/state/CURRENT.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path(str(current.get("latest_snapshot") or "")).read_text(encoding="utf-8"))
          identity = hashlib.sha256(json.dumps(snapshot, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()
          artifact = json.loads(Path("data/state/formal_discovery_current.json").read_text(encoding="utf-8"))
          if artifact.get("source_snapshot_identity") != identity: raise SystemExit("Discovery is not bound to the verified A-share snapshot")
          if artifact.get("market_date") != current.get("market_date"): raise SystemExit("Discovery market_date does not match the A-share snapshot")
          if str(artifact.get("latest_valid_node") or "").lower() != str(current.get("latest_valid_node") or "").lower(): raise SystemExit("Discovery node does not match the A-share snapshot")
          PY
      - name: Rebuild derived decision context and E2E status from same Discovery
        id: derived_projection
        # This is the existing canonical derived-state owner. It runs only after
        # the verified snapshot and node-local Discovery exist, so downstream
        # projections consume the same market-date/node/snapshot batch.
        if: ${{ steps.current_discovery.outcome == 'success' && github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          # The market pulse consumes the account-owned strategy state.
          # Full FIFO replay belongs to account-fact maintenance. Refresh only
          # today's valuation against the new valid snapshot; do not replay
          # history or rebuild E2E synchronously in the pulse.
          python scripts/rebuild_etf_strategy_equity.py --output data/state/etf_strategy_equity.json --current-only || true
          python scripts/build_state_context.py --decision-ready-only
          python - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path("data/state/CURRENT.json").read_text(encoding="utf-8"))
          discovery = json.loads(Path("data/state/formal_discovery_current.json").read_text(encoding="utf-8"))
          decision = json.loads(Path("data/state/decision_context.json").read_text(encoding="utf-8"))
          batch = decision.get("discovery_opportunity_batch_consistency") or {}
          expected = {
              "market_date": current.get("market_date"),
              "latest_valid_node": current.get("latest_valid_node"),
              "latest_snapshot": current.get("latest_snapshot"),
          }
          for key, value in expected.items():
              if key == "latest_valid_node":
                  if str(discovery.get(key) or "").lower() != str(value or "").lower():
                      raise SystemExit(f"derived Discovery node mismatch: {discovery.get(key)!r} != {value!r}")
              elif discovery.get(key) != value:
                  raise SystemExit(f"derived Discovery {key} mismatch: {discovery.get(key)!r} != {value!r}")
          if str(batch.get("status") or "").upper() != "ALIGNED":
              raise SystemExit(f"decision_context batch consistency is not ALIGNED: {batch}")
          e2e = json.loads(Path("data/state/e2e_status.json").read_text(encoding="utf-8"))
          if not e2e:
              raise SystemExit("e2e_status.json is empty after derived projection rebuild")
          PY
      - name: Publish complete A-share snapshot batch
        if: ${{ steps.derived_projection.outcome == 'success' && github.event_name != 'push' && steps.snapshot_result.outputs.snapshot_written == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.probe_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A single commit closes the A-share publication unit. Consistency
          # must never observe a new CURRENT without its same-batch Discovery
          # and derived projections. Unrelated domain state remains excluded.
          git add -- \
            data/market/snapshots \
            data/state/CURRENT.json \
            data/state/runtime_health.json \
            data/state/fixed_ratio_position_metrics.json \
            data/state/formal_discovery_current.json \
            data/state/formal_opportunity_current.json \
            data/state/discovery_pulse_latest.json \
            data/state/discovery_pulse_index.json \
            data/state/decision_context.json \
            data/state/dashboard_update_candidate.json \
            data/state/e2e_status.json \
            data/state/stock_context.json \
            data/state/stock_market_context.json \
            data/state/etf_strategy_equity.json \
            ETF当前状态_DASHBOARD.md
          if git diff --cached --quiet; then echo "No complete A-share snapshot batch change."; exit 0; fi
          mkdir -p /tmp/etf-a-share-batch-publish
          git diff --cached --name-only -z > /tmp/etf-a-share-batch-files
          while IFS= read -r -d '' file; do
            mkdir -p "/tmp/etf-a-share-batch-publish/$(dirname "$file")"
            cp "$file" "/tmp/etf-a-share-batch-publish/$file"
          done < /tmp/etf-a-share-batch-files
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            while IFS= read -r -d '' file; do
              mkdir -p "$(dirname "$file")"
              cp "/tmp/etf-a-share-batch-publish/$file" "$file"
            done < /tmp/etf-a-share-batch-files
            git add -- \
              data/market/snapshots \
              data/state/CURRENT.json \
              data/state/runtime_health.json \
              data/state/fixed_ratio_position_metrics.json \
              data/state/formal_discovery_current.json \
              data/state/formal_opportunity_current.json \
              data/state/discovery_pulse_latest.json \
              data/state/discovery_pulse_index.json \
              data/state/decision_context.json \
              data/state/dashboard_update_candidate.json \
              data/state/e2e_status.json \
              ETF当前状态_DASHBOARD.md
            if git diff --cached --quiet; then
              echo "A-share snapshot batch already current after rebase."
              exit 0
            fi
            git commit -m "data: publish complete A-share snapshot batch"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
          done
