          context_path = Path("data/state/query_context.json")
          context = json.loads(context_path.read_text(encoding="utf-8")) if context_path.exists() and context_path.stat().st_size else {}
          pack = context.get("decision_fact_pack") or {}
          trigger = pack.get("trigger") or {}
          expected = str(request.get("request_id") or "").strip()
          actual = str(trigger.get("request_id") or "").strip()
          if not expected or actual != expected:
              raise SystemExit(f"request-bound query context missing or mismatched: expected={expected} actual={actual}")
          PY
          fi

      - name: Build E2E usability state
        # Decision usability is request/state-sync qualification, not a scheduled
        # market-fact producer responsibility. Scheduled pulses may refresh
        # reusable Discovery evidence without rebuilding request-bound E2E state.
        if: ${{ always() && steps.state_sync.outputs.formal_completion != 'true' && steps.triggering_request.outputs.formal_completion != 'true' && (github.event_name == 'push' || steps.state_sync.outputs.processed == 'true') && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_e2e_status.py

      - name: Build state context and candidates
        # Full decision preparation is request/state-sync bound. Scheduled
        # snapshots keep canonical market facts and reusable Discovery current;
        # formal requests/recovery rebuild the canonical decision context.
        if: ${{ always() && steps.state_sync.outputs.formal_completion != 'true' && steps.triggering_request.outputs.formal_completion != 'true' && (github.event_name == 'push' || steps.state_sync.outputs.processed == 'true') && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_state_context.py --decision-ready-only
      - name: Build post-market review context
        # Review is a close/state-sync consumer, not a generic intraday pulse
        # responsibility. Explicit/manual close remains a legal recovery path.
        if: ${{ always() && steps.state_sync.outputs.formal_completion != 'true' && steps.triggering_request.outputs.formal_completion != 'true' && (steps.state_sync.outputs.processed == 'true' || (steps.snapshot_result.outputs.snapshot_written == 'true' && (steps.session_gate.outputs.close_intent == 'true' || github.event.inputs.node == 'close'))) && github.event.inputs.probe_only != 'true' }}
        continue-on-error: true
        run: python scripts/build_post_market_review.py
      - name: Commit downstream runtime/data artifacts
        if: ${{ always() && (steps.session_gate.outcome == 'success' || steps.capture.outcome == 'success' || steps.state_sync.outputs.processed == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Finalize runtime health from the post-retry snapshot, not the initial capture result.
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          health_path = Path('data/state/runtime_health.json')
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              raise SystemExit(0)
          if health_path.exists():
              health = json.loads(health_path.read_text(encoding='utf-8'))
              snapshot_path = Path(str(health.get('latest_snapshot') or ''))
              if snapshot_path.is_file():
                  snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
                  if str(snapshot.get('workflow_run_id', '')) == str(__import__('os').environ.get('GITHUB_RUN_ID', '')):
                      quality = str(snapshot.get('quality_status') or '')
                      if quality in {'PASS', 'DEGRADED'}:
                          provider_times = [row.get('as_of_beijing') for row in (snapshot.get('rows') or []) if row.get('as_of_beijing')]
                          health['status'] = quality
                          health['quality_status'] = quality
                          health['market_date'] = snapshot.get('market_date', health.get('market_date', ''))
                          health['node'] = snapshot.get('node', health.get('node', 'live'))
                          health['market_phase'] = snapshot.get('market_phase', health.get('market_phase', ''))
                          health['captured_at'] = snapshot.get('captured_at', health.get('captured_at', ''))
                          health['captured_at_beijing'] = snapshot.get('captured_at_beijing', health.get('captured_at_beijing', ''))
                          health['provider_as_of'] = max(provider_times) if provider_times else health.get('provider_as_of', '')
                          health['count'] = snapshot.get('count', health.get('count', 0))
                          health['latest_snapshot'] = str(snapshot_path).replace('\\\\', '/')
                          health['failure_stage'] = '' if quality == 'PASS' else health.get('failure_stage', '')
                          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          # system_consistency is owned by the dedicated audit workflow and may
          # change concurrently; keep it out of this data commit.
          git checkout -- data/state/system_consistency.json
          git reset -- data/state/notification_center.json
              git add -A -- data/market/snapshots data/market/discovery_history data/state post_market_review events config/market/etf_monitor_universe.json ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
              git reset -- data/state/system_consistency.json
              git reset -- data/state/notification_center.json
          if git diff --cached --quiet; then
            exit 0
          fi
          mkdir -p /tmp/etf-downstream-publish
          git diff --cached --name-only -z > /tmp/etf-downstream-files
          while IFS= read -r -d '' file; do
            mkdir -p "/tmp/etf-downstream-publish/$(dirname "$file")"
            cp "$file" "/tmp/etf-downstream-publish/$file"
          done < /tmp/etf-downstream-files
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            while IFS= read -r -d '' file; do
              mkdir -p "$(dirname "$file")"
              cp "/tmp/etf-downstream-publish/$file" "$file"
            done < /tmp/etf-downstream-files
            # CURRENT may have advanced after the derived state was built (for
            # example a core snapshot or account/trade mirror publish). Rebuild
            # the canonical Phase4-derived trigger/ranking from execution-time
            # latest-main CURRENT after the final reset so a stale staged
            # decision_trigger cannot overwrite a newer trade/account fact.
            if grep -zqxF 'data/state/decision_trigger.json' /tmp/etf-downstream-files || \
               grep -zqxF 'data/state/capital_efficiency_ranking.json' /tmp/etf-downstream-files; then
              python scripts/build_state_context.py --decision-ready-only
            fi
            git add -A -- data/market/snapshots data/market/discovery_history data/state post_market_review events config/market/etf_monitor_universe.json ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
            git reset -- data/state/system_consistency.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: record downstream market contexts and state sync [producer-run:${GITHUB_RUN_ID}]"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
          done
