name: ETF market snapshot

# Schedule registration marker: this workflow remains on the default branch for GitHub cron dispatch.
on:
  workflow_dispatch:
    inputs:
      node:
        description: "Data-only node label"
        required: true
        default: "scheduled"
      probe_only:
        description: "Fetch and validate without writing a valid node"
        required: true
        default: "false"
      replay_request:
        description: "Existing requests/live_snapshot STATE_SYNC_ONLY request to replay from execution-time main"
        required: false
        default: ""
  push:
    paths:
      - "requests/live_snapshot/**.json"
      - "scripts/cloud_runner_snapshot.py"
      - "scripts/query_time_market_refresh.py"
      - "scripts/tencent_quote.py"
      - "config/market/provider_priority.json"
  schedule:
    # Explicit opening-auction pulses, followed by ten-minute pulses in active A-share windows.
    - cron: "15,20,25,30,40,50 1 * * 1-5"
    - cron: "9,19,29,39,49,59 2-3,5-6 * * 1-5"
    - cron: "9,19 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-market-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_RETRY_LIMIT: "2"
      HITHINK_TIMEOUT_SECONDS: "25"
      QUERY_TIME_REFRESH: ${{ github.event_name == 'push' && 'true' || 'false' }}
      EVENT_BEFORE: ${{ github.event.before }}
      REPLAY_REQUEST: ${{ github.event.inputs.replay_request || '' }}
      SCHEDULED_CRON: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check exchange calendar and capture window
        id: session_gate
        run: python scripts/runtime_session_gate.py
      - name: Record skipped runtime health
        if: ${{ steps.session_gate.outputs.should_capture != 'true' && github.event_name != 'push' }}
        env:
          SESSION_MARKET_DATE: ${{ steps.session_gate.outputs.market_date }}
          SESSION_MARKET_PHASE: ${{ steps.session_gate.outputs.market_phase }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SESSION_REASON: ${{ steps.session_gate.outputs.reason }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          now = datetime.now(shanghai).isoformat(timespec='seconds')
          health_path = Path('data/state/runtime_health.json')
          current_path = Path('data/state/CURRENT.json')
          health = json.loads(health_path.read_text(encoding='utf-8')) if health_path.exists() else {}
          current = json.loads(current_path.read_text(encoding='utf-8')) if current_path.exists() else {}
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          health.update({
              'status': 'SKIPPED',
              'quality_status': 'SKIPPED',
              'reason': os.environ.get('SESSION_REASON') or 'outside_a_share_capture_window',
              'failure_stage': 'session_gate',
              'scheduled_for': 'cron:' + os.environ.get('EVENT_SCHEDULE', '') if os.environ.get('EVENT_SCHEDULE') else ('query_time_push' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'workflow_dispatch'),
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),
              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'QUERY_TIME_PUSH' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'SCHEDULE_OR_DISPATCH',
              'started_at': now,
              'finished_at': now,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': '',
              'latest_snapshot': current.get('latest_snapshot', health.get('latest_snapshot', '')),
              'market_date': os.environ.get('SESSION_MARKET_DATE', current.get('market_date', '')),
              'market_phase': os.environ.get('SESSION_MARKET_PHASE', 'OUTSIDE_SESSION'),
          })
          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY') }}
        with:
          node-version: "22"
      - name: Start optional Hithink fallback CLI bootstrap
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY') }}
        shell: bash
        run: |
          # Tencent is the primary A-share provider. Start the optional
          # fallback installation in parallel so it cannot delay first core
          # snapshot acquisition; cloud_runner_snapshot.py waits for it only
          # if a fallback path is actually needed.
          npm install --global @hithink-tech/hithink-finance-cli >/tmp/hithink-finance-install.log 2>&1 &
          echo "HITHINK_CLI_INSTALL_PID=$!" >> "$GITHUB_ENV"
      - name: Load unified provider concurrency policy
        if: ${{ steps.session_gate.outputs.should_capture == 'true' || (github.event_name == 'push' && steps.session_gate.outputs.request_class != 'STATE_SYNC_ONLY') }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          policy = json.loads(Path("config/runtime_policy.json").read_text(encoding="utf-8"))
          key = "query_provider_max_workers" if os.environ.get("GITHUB_EVENT_NAME") == "push" else "scheduled_provider_max_workers"
          value = policy.get(key)
          if not isinstance(value, int) or value < 1:
              raise SystemExit(f"invalid {key}={value!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"HITHINK_MAX_WORKERS={value}\n")
          print(f"provider concurrency: {key}={value}")
      - name: Run data-only snapshot
        id: capture
        # Scheduled pulses and user requests share the same phase-aware producer.
        # `scheduled` is resolved by cloud_runner_snapshot.py into auction/live/close
        # from the actual A-share market phase, avoiding generic live labels after close.
        if: ${{ steps.session_gate.outputs.should_capture == 'true' }}
        env:
          NODE_LABEL: ${{ github.event_name == 'push' && 'scheduled' || (github.event.inputs.node || 'scheduled') }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
          SCHEDULED_CLOSE_INTENT: ${{ steps.session_gate.outputs.close_intent }}
          WAIT_FOR_CLOSE_BOUNDARY_SECONDS: ${{ steps.session_gate.outputs.wait_for_close_boundary_seconds }}
        run: |
          if [ "${WAIT_FOR_CLOSE_BOUNDARY_SECONDS:-0}" -gt 0 ]; then
            echo "scheduled close intent received; waiting ${WAIT_FOR_CLOSE_BOUNDARY_SECONDS}s for 15:00 boundary"
            sleep "$WAIT_FOR_CLOSE_BOUNDARY_SECONDS"
          fi
          if [ "$PROBE_ONLY" = "true" ]; then
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL" --probe-only
          else
            python scripts/cloud_runner_snapshot.py --node "$NODE_LABEL"
          fi
      - name: Normalize runtime health observability
        if: ${{ steps.capture.outcome == 'success' && steps.session_gate.outputs.should_capture == 'true' }}
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          SCHEDULED_SLOT_AT: ${{ steps.session_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.session_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.session_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.session_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.session_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.session_gate.outputs.natural_pulse_eligible }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          shanghai = timezone(timedelta(hours=8), name='Asia/Shanghai')
          delay_text = os.environ.get('SCHEDULE_DELAY_SECONDS', '')
          try:
              delay_seconds = int(delay_text) if delay_text else None
          except ValueError:
              delay_seconds = None
          path = Path('data/state/runtime_health.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          snapshot_path = Path(data.get('latest_snapshot', ''))
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8')) if snapshot_path.exists() else {}
          provider_times = [row.get('as_of_beijing') for row in (snapshot.get('rows') or []) if row.get('as_of_beijing')]
          planned = snapshot.get('planned_time', '')
          market_date = snapshot.get('market_date', data.get('market_date', ''))
          data.update({
              'scheduled_for': 'query_time_push' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else (f'{market_date} {planned}' if planned else f'{market_date} {snapshot.get("node", "")}'),
              'scheduled_cron': os.environ.get('EVENT_SCHEDULE', ''),
              'scheduled_slot_at': os.environ.get('SCHEDULED_SLOT_AT') or None,
              'schedule_delay_seconds': delay_seconds,
              'schedule_delay_class': os.environ.get('SCHEDULE_DELAY_CLASS', ''),
              'natural_pulse_identity': os.environ.get('NATURAL_PULSE_IDENTITY') or None,
              'natural_pulse_identity_status': os.environ.get('NATURAL_PULSE_IDENTITY_STATUS', ''),
              'natural_pulse_eligible': os.environ.get('NATURAL_PULSE_ELIGIBLE', '') == 'true',
              'trigger_mode': 'QUERY_TIME_PUSH' if os.environ.get('GITHUB_EVENT_NAME') == 'push' else 'SCHEDULE_OR_DISPATCH',
              'started_at': data.get('run_started_at', ''),
              'finished_at': data.get('captured_at_beijing', datetime.now(shanghai).isoformat(timespec='seconds')),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'input_commit': os.environ.get('GITHUB_SHA', ''),
              'data_commit': '',
              'provider_as_of': max(provider_times) if provider_times else '',
              'failure_stage': '',
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify a new valid snapshot was written
        id: snapshot_result
        if: ${{ steps.capture.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/state/runtime_health.json')
          written = False
          reason = 'runtime_health_missing'
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              status = data.get('status', '')
              same_run = str(data.get('workflow_run_id', '')) == str(os.environ.get('GITHUB_RUN_ID', ''))
              written = status in {'PASS', 'DEGRADED'} and same_run and bool(data.get('latest_snapshot'))
              reason = status or 'missing_status'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"snapshot_written={'true' if written else 'false'}\n")
              f.write(f"reason={reason}\n")
          print(json.dumps({'snapshot_written': written, 'reason': reason}, ensure_ascii=False))
          PY
      - name: Publish core snapshot and CURRENT immediately
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Consistency is persisted by its own workflow; excluding it prevents a
          # concurrent audit write from conflicting with the market-data commit.
          git checkout -- data/state/system_consistency.json
          git reset -- data/state/notification_center.json
                git add -A -- data/market/snapshots data/state
                git reset -- data/state/system_consistency.json
                git reset -- data/state/notification_center.json
          if ! git diff --cached --quiet; then
            mkdir -p /tmp/etf-core-publish
            git diff --cached --name-only -z > /tmp/etf-core-files
            while IFS= read -r -d '' file; do
              mkdir -p "/tmp/etf-core-publish/$(dirname "$file")"
              cp "$file" "/tmp/etf-core-publish/$file"
            done < /tmp/etf-core-files
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              while IFS= read -r -d '' file; do
                mkdir -p "$(dirname "$file")"
                cp "/tmp/etf-core-publish/$file" "$file"
              done < /tmp/etf-core-files
              git add -A -- data/market/snapshots data/state
              git reset -- data/state/system_consistency.json
              git commit -m "data: publish core market snapshot"
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then exit 1; fi
            done
          fi
      - name: Quick retry failed core objects after initial publish
        id: quick_retry
        # A user request gets the first publishable PASS/DEGRADED/FAILED result
        # immediately. Slow repair remains a scheduled, post-publish activity.
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' && github.event_name != 'push' }}
        run: python scripts/cloud_runner_snapshot.py --retry-failed
      - name: Process optional broker/dashboard state sync
        id: state_sync
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.replay_request != '')) && github.event.inputs.probe_only != 'true' }}
        shell: bash
        run: |
          # Process queued state-sync runs against execution-time main while
          # preserving only the triggering request payload.
          git fetch origin main
          if [ -n "${REPLAY_REQUEST:-}" ]; then
            request_files="$REPLAY_REQUEST"
          else
            request_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/live_snapshot/*.json')
          fi
          triggering_request_file=$(printf '%s\n' $request_files | head -n 1)
          echo "triggering_request_file=$triggering_request_file" >> "$GITHUB_OUTPUT"
          echo "TRIGGERING_REQUEST_FILE=$triggering_request_file" >> "$GITHUB_ENV"
          mkdir -p /tmp/etf-state-sync-requests
          for f in $request_files; do
            mkdir -p "/tmp/etf-state-sync-requests/$(dirname "$f")"
            cp "$f" "/tmp/etf-state-sync-requests/$f"
          done
          git reset --hard origin/main
          for f in $request_files; do
            mkdir -p "$(dirname "$f")"
            cp "/tmp/etf-state-sync-requests/$f" "$f"
          done
          processed=false
          if [ -n "${REPLAY_REQUEST:-}" ]; then
            python - "$request_files" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.is_absolute() or path.parts[:2] != ("requests", "live_snapshot") or ".." in path.parts or path.suffix != ".json":
              raise SystemExit("replay_request must be one existing requests/live_snapshot/*.json path")
          if not path.exists():
              raise SystemExit("replay_request does not exist in execution-time main")
          obj = json.loads(path.read_text(encoding="utf-8"))
          trade = obj.get("trade_event")
          if str(obj.get("request_type") or "").upper() != "STATE_SYNC_ONLY":
              raise SystemExit("replay_request must be STATE_SYNC_ONLY")
          if not isinstance(trade, dict):
              raise SystemExit("replay_request must contain a trade_event")
          # Historical durable requests may predate embedded execution_status.
          # Admission still requires the same canonical EXECUTED event that the
          # state-sync owner will consume; the request itself is never rewritten.
          embedded_status = trade.get("execution_status")
          if embedded_status is not None and str(embedded_status).upper() != "EXECUTED":
              raise SystemExit("replay_request embedded trade_event is not EXECUTED")
          event_id = str(trade.get("event_id") or "").strip()
          if not event_id or any(part in event_id for part in ("/", "\\\\", "..")):
              raise SystemExit("replay_request trade_event.event_id is invalid")
          canonical_path = Path("events/trades") / f"{event_id}.json"
          if canonical_path.parent != Path("events/trades") or not canonical_path.is_file():
              raise SystemExit("canonical trade event is missing")
          canonical = json.loads(canonical_path.read_text(encoding="utf-8"))
          if str(canonical.get("execution_status") or "").upper() != "EXECUTED":
              raise SystemExit("canonical trade event is not EXECUTED")
          def text_value(data, key):
              value = data.get(key)
              return None if value in (None, "") else str(value).strip().upper()
          def number_value(data, key):
              value = data.get(key)
              return None if value in (None, "") else f"{float(value):.10f}"
          def time_value(data):
              for key in ("executed_at_beijing", "executed_at", "execution_time", "trade_time", "confirmed_at_beijing"):
                  value = data.get(key)
                  if value not in (None, ""):
                      return key, str(value).strip()
              return None, None
          # Canonical identity is event_id plus trade mechanics and execution time
          # when both records expose the same semantic time field. Request-only
          # asset_type/name/source/lifecycle are enrichment; asset classification
          # remains owned by the canonical ETF universe/account projection.
          for key in ("event_id", "idempotency_key", "code", "side"):
              if trade.get(key) not in (None, "") and trade.get(key) != canonical.get(key):
                  raise SystemExit(f"canonical trade event mismatch: {key}")
          for key in ("quantity", "price"):
              if number_value(trade, key) != number_value(canonical, key):
                  raise SystemExit(f"canonical trade event mismatch: {key}")
          request_time_key, request_time = time_value(trade)
          canonical_time_key, canonical_time = time_value(canonical)
          if request_time is None:
              raise SystemExit("replay_request trade_event is missing execution time")
          if request_time_key == canonical_time_key and request_time != canonical_time:
              raise SystemExit("canonical trade event mismatch: time")
          if canonical_time is None:
              raise SystemExit("canonical trade event is missing execution time")
          PY
            python scripts/refresh_gate.py --guard-request "$request_files"
            python scripts/process_state_sync_request.py "$request_files"
            processed=true
          elif [ -n "${EVENT_BEFORE:-}" ] && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "${EVENT_BEFORE}" "$GITHUB_SHA" -- 'requests/live_snapshot/*.json')
          else
            files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/live_snapshot/*.json')
          fi
          for f in $files; do
            if python - "$f" <<'PY'
          import json, sys
          from scripts.runtime_session_gate import classify_live_snapshot_request
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          raise SystemExit(0 if classify_live_snapshot_request(data) in {'STATE_SYNC_ONLY', 'HYBRID'} else 1)
          PY
            then
              python scripts/refresh_gate.py --guard-request "$f"
              python scripts/process_state_sync_request.py "$f"
              processed=true
            fi
          done
          echo "processed=$processed" >> "$GITHUB_OUTPUT"
      - name: Build objective intraday market delta
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_market_delta.py
      - name: Refresh overseas and Asia index context
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_overseas_context.py
      - name: Build dynamic stock context from current account
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_stock_context.py
      - name: Collect current account-stock market facts
        if: ${{ steps.snapshot_result.outputs.snapshot_written == 'true' && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_account_stock_market.py
      - name: Build E2E usability state
        if: ${{ (steps.snapshot_result.outputs.snapshot_written == 'true' || steps.state_sync.outputs.processed == 'true') && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_e2e_status.py

      - name: Build state context and candidates
        if: ${{ (steps.snapshot_result.outputs.snapshot_written == 'true' || steps.state_sync.outputs.processed == 'true') && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_state_context.py
      - name: Build on-demand query context
        if: ${{ (github.event_name == 'push' || steps.snapshot_result.outputs.snapshot_written == 'true' || steps.state_sync.outputs.processed == 'true') && github.event.inputs.probe_only != 'true' }}
        run: |
          REQUEST_FILE="${TRIGGERING_REQUEST_FILE:-}"
          if [ -z "$REQUEST_FILE" ] && [ -n "${REPLAY_REQUEST:-}" ]; then REQUEST_FILE="$REPLAY_REQUEST"; fi
          if [ -z "$REQUEST_FILE" ]; then REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/live_snapshot/*.json' | head -n 1); fi
          REQUEST_ARGS=()
          if [ -n "$REQUEST_FILE" ]; then REQUEST_ARGS+=(--request-file "$REQUEST_FILE"); fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${{ steps.snapshot_result.outputs.snapshot_written }}" != "true" ] && [ "${{ steps.session_gate.outputs.request_class }}" != "STATE_SYNC_ONLY" ]; then
            REQUEST_SYMBOLS=$(python - <<'PY'
          import json, os, subprocess
          files = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", os.environ["GITHUB_SHA"], "--", "requests/live_snapshot/"],
              text=True,
          ).splitlines()
          symbols = []
          for name in files:
              try:
                  obj = json.loads(open(name, encoding="utf-8").read())
              except (OSError, json.JSONDecodeError):
                  continue
              for value in obj.get("symbols") or []:
                  value = str(value).strip()
                  if value and value not in symbols:
                      symbols.append(value)
          print(",".join(symbols))
          PY
            )
            if [ -n "$REQUEST_SYMBOLS" ]; then
              python scripts/build_query_context.py --force-refresh --symbols "$REQUEST_SYMBOLS" "${REQUEST_ARGS[@]}"
            else
              python scripts/build_query_context.py --force-refresh "${REQUEST_ARGS[@]}"
            fi
          else
            python scripts/build_query_context.py "${REQUEST_ARGS[@]}"
          fi
          python scripts/refresh_gate.py --annotate-contexts
      - name: Build post-market review context
        if: ${{ (steps.snapshot_result.outputs.snapshot_written == 'true' || steps.state_sync.outputs.processed == 'true') && github.event.inputs.probe_only != 'true' }}
        run: python scripts/build_post_market_review.py
      - name: Commit downstream runtime/data artifacts
        if: ${{ always() && (steps.session_gate.outcome == 'success' || steps.capture.outcome == 'success' || steps.state_sync.outputs.processed == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Finalize runtime health from the post-retry snapshot, not the initial capture result.
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          health_path = Path('data/state/runtime_health.json')
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              raise SystemExit(0)
          if health_path.exists():
              health = json.loads(health_path.read_text(encoding='utf-8'))
              snapshot_path = Path(str(health.get('latest_snapshot') or ''))
              if snapshot_path.is_file():
                  snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
                  if str(snapshot.get('workflow_run_id', '')) == str(__import__('os').environ.get('GITHUB_RUN_ID', '')):
                      quality = str(snapshot.get('quality_status') or '')
                      if quality in {'PASS', 'DEGRADED'}:
                          provider_times = [row.get('as_of_beijing') for row in (snapshot.get('rows') or []) if row.get('as_of_beijing')]
                          health['status'] = quality
                          health['quality_status'] = quality
                          health['market_date'] = snapshot.get('market_date', health.get('market_date', ''))
                          health['node'] = snapshot.get('node', health.get('node', 'live'))
                          health['market_phase'] = snapshot.get('market_phase', health.get('market_phase', ''))
                          health['captured_at'] = snapshot.get('captured_at', health.get('captured_at', ''))
                          health['captured_at_beijing'] = snapshot.get('captured_at_beijing', health.get('captured_at_beijing', ''))
                          health['provider_as_of'] = max(provider_times) if provider_times else health.get('provider_as_of', '')
                          health['count'] = snapshot.get('count', health.get('count', 0))
                          health['latest_snapshot'] = str(snapshot_path).replace('\\\\', '/')
                          health['failure_stage'] = '' if quality == 'PASS' else health.get('failure_stage', '')
                          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          # system_consistency is owned by the dedicated audit workflow and may
          # change concurrently; keep it out of this data commit.
          git checkout -- data/state/system_consistency.json
          git reset -- data/state/notification_center.json
              git add -A -- data/market/snapshots data/state post_market_review events ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
              git reset -- data/state/system_consistency.json
              git reset -- data/state/notification_center.json
          if git diff --cached --quiet; then
            exit 0
          fi
          mkdir -p /tmp/etf-downstream-publish
          git diff --cached --name-only -z > /tmp/etf-downstream-files
          while IFS= read -r -d '' file; do
            mkdir -p "/tmp/etf-downstream-publish/$(dirname "$file")"
            cp "$file" "/tmp/etf-downstream-publish/$file"
          done < /tmp/etf-downstream-files
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            while IFS= read -r -d '' file; do
              mkdir -p "$(dirname "$file")"
              cp "/tmp/etf-downstream-publish/$file" "$file"
            done < /tmp/etf-downstream-files
            git add -A -- data/market/snapshots data/state post_market_review events ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
            git reset -- data/state/system_consistency.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: record downstream market contexts and state sync"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
          done


