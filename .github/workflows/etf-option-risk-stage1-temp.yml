name: ETF option risk Stage1 temp

on:
  push:
    paths:
      - ".github/workflows/etf-option-risk-stage1-temp.yml"

permissions:
  contents: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependency
        run: pip install requests
      - name: Run ETF option risk Stage1
        run: python scripts/run_etf_option_risk_stage1.py
      - name: Enforce research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/state/etf_option_risk_research_status.json').read_text(encoding='utf-8'))
          assert s['decision_eligible'] is False
          assert s['trade_signal'] is None
          assert s['master_override'] is False
          assert s['production_integration'] is False
          assert s['history_sufficient_for_alpha_test'] is False
          PY
      - name: Persist Stage1 result only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtests/etf_option_risk_stage1_validation.json data/state/etf_option_risk_research_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: record corrected ETF option risk Stage1"
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
