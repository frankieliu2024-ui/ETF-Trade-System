name: Section6 Evidence Revalidation Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/backtests/analyze_ashare_ancestral_intraday_sina15_robustness.py'
      - 'research/backtests/analyze_ashare_ancestral_intraday_sina15.py'
      - 'research/backtests/analyze_ashare_ancestral_intraday_history.py'
      - '.github/workflows/section6-revalidation-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section6-baseline:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/ashare-ancestral-intraday-now-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run final A-share ancestral-rule 15m robustness
        run: python research/backtests/analyze_ashare_ancestral_intraday_sina15_robustness.py
      - name: Show robustness report
        run: cat research/reports/generated/section6_revalidation/ashare_ancestral_intraday_sina15_robustness.md
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: section6-ancestral-intraday-robustness
          path: research/reports/generated/section6_revalidation/ashare_ancestral_intraday_sina15_robustness.*
          if-no-files-found: error

# Research-only workflow. It has read-only repository permission, does not commit,
# does not write main, and does not create trading permissions or runtime state.
