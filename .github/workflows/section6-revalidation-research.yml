name: Section6 Evidence Revalidation Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/backtests/revalidate_section6_baselines.py'
      - 'research/backtests/analyze_section6_baseline_stability.py'
      - 'research/backtests/analyze_section6_component_ablation.py'
      - 'research/backtests/analyze_section6_conditional_increment.py'
      - 'research/backtests/analyze_section6_tech_object_concentration.py'
      - 'research/backtests/analyze_section6_consecutive_risk_discriminator.py'
      - 'research/backtests/analyze_section6_new_evidence_stage_c.py'
      - 'research/backtests/analyze_section6_stage_e_validation.py'
      - 'research/backtests/build_quantmind_qlib_wfa_dataset.py'
      - 'research/backtests/run_quantmind_qlib_wfa_stage1.py'
      - 'config/research/quantmind_qlib_wfa_stage1.json'
      - 'research/reports/**'
      - '.github/workflows/section6-revalidation-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section6-baseline:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/section6-evidence-revalidation-20260829'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run frozen 6.2 baseline revalidation
        run: python research/backtests/revalidate_section6_baselines.py
      - name: Run T+5 stability and incremental screen
        run: python research/backtests/analyze_section6_baseline_stability.py
      - name: Run component ablation and regime screen
        run: python research/backtests/analyze_section6_component_ablation.py
      - name: Run conditional increment screen
        run: python research/backtests/analyze_section6_conditional_increment.py
      - name: Run tech object concentration check
        run: python research/backtests/analyze_section6_tech_object_concentration.py
      - name: Run consecutive-rise T+1 discriminator
        run: python research/backtests/analyze_section6_consecutive_risk_discriminator.py
      - name: Run stage C cloud-era new evidence screen
        run: python research/backtests/analyze_section6_new_evidence_stage_c.py
      - name: Run stage E stability and dedup validation
        run: python research/backtests/analyze_section6_stage_e_validation.py
      - name: Show generated reports
        run: |
          cat research/reports/generated/section6_revalidation/section6_baseline_revalidation.md
          printf '\n\n'
          cat research/reports/generated/section6_revalidation/section6_baseline_stability.md
          printf '\n\n'
          cat research/reports/generated/section6_revalidation/section6_component_ablation.md
          printf '\n\n'
          cat research/reports/generated/section6_revalidation/section6_conditional_increment.md
          printf '\n\n'
          cat research/reports/generated/section6_revalidation/section6_tech_object_concentration.md
          printf '\n\n'
          cat research/reports/generated/section6_revalidation/section6_consecutive_risk_discriminator.md
          printf '\n\n'
          cat research/reports/generated/section6_revalidation/section6_stage_c_new_evidence.md
          printf '\n\n'
          cat research/reports/generated/section6_revalidation/section6_stage_e_validation.md
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: section6-baseline-revalidation
          path: research/reports/generated/section6_revalidation/
          if-no-files-found: error

  quantmind-wfa-stage1:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/quantmind-qlib-wfa-stage1-20260830'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests lightgbm
      - name: Build PIT-safe official ETF research matrix
        run: python research/backtests/build_quantmind_qlib_wfa_dataset.py --output /tmp/quantmind_qlib_wfa_stage1.csv
      - name: Run Ridge and bounded LightGBM walk-forward validation
        run: python research/backtests/run_quantmind_qlib_wfa_stage1.py --dataset /tmp/quantmind_qlib_wfa_stage1.csv --output /tmp/quantmind_qlib_wfa_stage1_result.json
      - name: Show Stage1 result
        run: cat /tmp/quantmind_qlib_wfa_stage1_result.json
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantmind-qlib-wfa-stage1
          path: |
            /tmp/quantmind_qlib_wfa_stage1_result.json
          if-no-files-found: error

# Research-only workflow. It has read-only repository permission, does not commit,
# does not write main, and does not create trading permissions or runtime state.
