name: Unified notification semantics regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etf-notification-semantics-regression
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile notification modules
        run: |
          python -m py_compile \
            scripts/notification_semantics.py \
            scripts/market_notification_common.py \
            scripts/send_market_shock_notification.py \
            scripts/send_regional_session_summary.py \
            scripts/send_us_session_summary.py
      - name: Validate unified object-role semantics
        shell: bash
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from notification_semantics import object_role, shock_implication

          checks = [
              (shock_implication('515880', '通信ETF', 'ETF', 'A_SHARE')[0], '正式动作/生命周期对象'),
              (shock_implication('561980', '半导体设备ETF', 'ETF', 'A_SHARE')[0], '当前持仓ETF'),
              (shock_implication('300750', '宁德时代', 'ACCOUNT_STOCK', 'A_SHARE')[0], '账户个股'),
              (shock_implication('000688', '科创50指数', 'A_SHARE_INDEX', 'A_SHARE')[0], 'A股本地风险偏好'),
              (shock_implication('HSTECH', '恒生科技指数', 'INDEX', 'OVERSEAS')[0], '恒生科技ETF（513180）'),
              (shock_implication('NDX', '纳斯达克100指数', 'INDEX', 'OVERSEAS')[0], '纳指ETF（159941）'),
          ]
          failed = [(text, needle) for text, needle in checks if needle not in text]
          role, detail = object_role('515880', 'ETF')
          if role == 'ACTIVE_FORMAL_OBJECT' and 'EXECUTED' in detail:
              failed.append((detail, 'must not expose EXECUTED'))
          if failed:
              raise SystemExit(f'unified semantic checks failed: {failed}')
          print('unified notification semantics regression passed')
          PY
