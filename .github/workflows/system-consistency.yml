name: ETF system consistency
# Remote latest-main consistency validation trigger; active US and formal overseas contexts are refreshed before audit without relaxing freshness limits.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/system-consistency.yml"
      - "scripts/check_system_consistency.py"
      - "scripts/run_production_acceptance.py"
      - "scripts/acceptance_scope.py"
      - "scripts/check_system_consistency_core.py"
      - "scripts/check_research_integration.py"
      - "scripts/check_market_state_consistency.py"
      - "scripts/check_production_mutation_protocol.py"
      - "scripts/semantic_latest_main.py"
      - "scripts/runtime_self_heal.py"
      - "scripts/lifecycle_state.py"
      - "tests/test_opening_current_self_healing.py"
      - "tests/test_semantic_latest_main.py"
      - "tests/test_lifecycle_state.py"
      - "scripts/formal_document_structure.py"
      - "scripts/maintenance_guard.py"
      - "scripts/build_e2e_status.py"
      - "scripts/process_state_sync_request.py"
      - "scripts/apply_trade_fact_correction.py"
      - "scripts/confirmed_trade_facts.py"
      - "scripts/review_prerequisite_lifecycle.py"
      - "scripts/historical_market_fact_recovery.py"
      - "tests/test_review_prerequisite_lifecycle.py"
      - "tests/test_historical_market_fact_recovery.py"
      - "scripts/sync_formal_files.py"
      - "scripts/formal_file_mutation_gateway.py"
      - "scripts/research_artifact_contract.py"
      - "scripts/state_manager.py"
      - "tests/test_state_layer.py"
      - "tests/test_market*.py"
      - "tests/test_query_time_market_refresh.py"
      - "tests/test_research_artifact_contract.py"
      - "tests/test_executed_trade_case_lifecycle.py"
      - "tests/test_settlement_obligations.py"
      - "tests/test_formal_file_mutation_gateway.py"
      - "tests/test_post_close_review_canonical.py"
      - "tests/test_production_reliability.py"
      - "tests/test_dashboard_risk_projection.py"
      - "tests/test_trade_fact_correction_contract.py"
      - "scripts/market_notification_common.py"
      - "scripts/merge_notification_state.py"
      - ".github/workflows/decision-notification.yml"
      - ".github/workflows/manual-llm-research-critique.yml"
      - "config/research/llm_research_adapter.json"
      - "scripts/llm_research_adapter.py"
      - "scripts/run_review_research_critique.py"
      - "config/maintenance/production_mutation_protocol.json"
      - "ETF规则_MASTER.md"
      - "ETF_SYSTEM_INDEX.md"
      - "ETF当前状态_DASHBOARD.md"
      - "ETF市场行情档案_2026.md"
      - "ETF交易复盘与经验库_2026.md"
      - "ETF与市场监测数据接口使用规范.md"
      - "docs/**"
      - "events/**"
      - "requests/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "ETF规则_MASTER.md"
      - "ETF当前状态_DASHBOARD.md"
      - "ETF交易复盘与经验库_2026.md"
      - "ETF市场行情档案_2026.md"
      - "ETF与市场监测数据接口使用规范.md"
      - "ETF_SYSTEM_INDEX.md"
      - "config/market/**"
      - "config/research/llm_research_adapter.json"
      - "config/runtime_policy.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requests/research_backfill/*.json"
      - "requests/trade_fact_correction/*.json"
      - "data/state/account_fact.json"
      - "data/state/research_master_candidates.json"
      - "data/state/historical_backfill_status.json"
      - "data/state/historical_position_research.json"
      - "data/state/etf_strategy_equity.json"
      - "events/research/daily_features/**"
      - "data/market/audit/research_backfill/**"
      - "research/reports/**"
      - "post_market_review/**"
      - "docs/**"
      - "events/**"
      - "requests/**"
  schedule:
    - cron: "50 23 * * 0-4"
    - cron: "20,50 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('etf-system-consistency-pr-{0}', github.event.pull_request.number) || 'etf-system-consistency' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run bounded LLM adapter contract tests
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from scripts.llm_research_adapter import build_review_input, critique_review
          with tempfile.TemporaryDirectory() as td:
              cfg = Path(td) / "adapter.json"
              cfg.write_text(json.dumps({"enabled": False,"daily_call_limit": 20,"daily_budget_usd": 0.50,"secret_env": "CI_LLM_KEY"}), encoding="utf-8")
              result = critique_review({"market_date": "2026-09-11"}, config_path=cfg)
              assert result["status"] == "SKIPPED"
              assert result["uncertainties"] == ["adapter_disabled"]
              safe = build_review_input({"market_date": "2026-09-11","daily_market_summary": {"latest_valid_node": "1500"},"account_fact": {"cash": 1},"trade_action": "BUY"})
              assert "account_fact" not in safe
              assert "trade_action" not in safe
          print("bounded LLM adapter contract: PASS")
          PY
      - name: Validate semantic latest-main freshness
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin main
          python scripts/semantic_latest_main.py --base "${PR_BASE_SHA}" --head "$(git rev-parse origin/main)"
      - name: Validate OpenSSL SM4 runtime dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl
          command -v openssl
          openssl version -a
          openssl enc -list | grep -E '(^|[[:space:]])-sm4-ecb([[:space:]]|$)'
      - name: PR candidate post-replay acceptance
        id: candidate_acceptance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/etf-candidate-${{ github.event.pull_request.number }}"
          rm -rf "$candidate"
          cp -a . "$candidate"
          cd "$candidate"
          export ETF_SYSTEM_ROOT="$candidate"
          export PYTHONPATH="$candidate/scripts:$candidate"
          python scripts/sync_formal_files.py
          python -m unittest tests.test_dashboard_risk_projection tests.test_formal_file_mutation_gateway
          git config user.name "candidate-replay"
          git config user.email "candidate-replay@localhost"
          git add -A
          git commit -m "candidate: ephemeral dashboard risk projection replay"
          test -z "$(git status --porcelain --untracked-files=all)"
          unset GITHUB_SHA
          python scripts/check_system_consistency.py
          python scripts/maintenance_guard.py
          python scripts/build_e2e_status.py
      - name: Validate formal files, data standard, monitoring layers and runtime wiring
        id: consistency
        continue-on-error: true
        shell: bash
        run: |
          set +e
          validation_root="$PWD"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pr_number="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["number"])')"
            candidate_root="$RUNNER_TEMP/etf-candidate-${pr_number}"
            if [ -d "$candidate_root" ]; then validation_root="$candidate_root"; fi
          fi
          (cd "$validation_root" && export ETF_SYSTEM_ROOT="$validation_root" && export PYTHONPATH="$validation_root/scripts:$validation_root" && export ETF_CONSISTENCY_REPORT_PATH="$RUNNER_TEMP/system_consistency.json" && python scripts/check_system_consistency.py --no-persist --report-path "$RUNNER_TEMP/system_consistency.json"); rc1=$?
          (cd "$validation_root" && export ETF_SYSTEM_ROOT="$validation_root" && export PYTHONPATH="$validation_root/scripts:$validation_root" && export ETF_CONSISTENCY_REPORT_PATH="$RUNNER_TEMP/system_consistency.json" && python scripts/check_research_integration.py); rc2=$?
          (cd "$validation_root" && export ETF_SYSTEM_ROOT="$validation_root" && export PYTHONPATH="$validation_root/scripts:$validation_root" && python scripts/check_market_state_consistency.py); rc3=$?
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ] || [ "$rc3" -ne 0 ]; then exit 1; fi
      - name: Enforce hard consistency result
        if: ${{ steps.consistency.outcome == 'failure' && github.event_name != 'pull_request' }}
        run: exit 1
      - name: Enforce PR candidate acceptance result
        if: ${{ github.event_name == 'pull_request' && steps.candidate_acceptance.outcome == 'failure' }}
        run: exit 1
      - name: Upload pure consistency report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-consistency-${{ github.run_id }}
          path: ${{ runner.temp }}/system_consistency.json
          if-no-files-found: ignore

  production_acceptance:
    if: ${{ needs.consistency.result == 'success' && github.event_name != 'pull_request' }}
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Persist accepted canonical ETF equity replay and refresh existing formal projection
        shell: bash
        run: |
          set -euo pipefail
          replay="$RUNNER_TEMP/etf-strategy-equity-replay.json"
          python scripts/rebuild_etf_strategy_equity.py --output "$replay"
          python - "$replay" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding="utf-8"))
          s = p.get("summary") or {}
          required = ["current_gross_strategy_equity", "current_strategy_return_pct_gross", "trade_fact_count", "price_date_count"]
          if any(k not in s for k in required) or s.get("coverage_status") != "COMPLETE": raise SystemExit("accepted ETF equity replay is incomplete")
          if not s.get("pending_fees_do_not_block_gross", False): raise SystemExit("fee boundary missing from gross replay")
          print(json.dumps({"cutoff": p.get("replay_cutoff"), "trade_facts": s.get("trade_fact_count"), "price_dates": s.get("price_date_count"), "gross_equity": s.get("current_gross_strategy_equity"), "gross_return": s.get("current_strategy_return_pct_gross")}, ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          cp "$replay" data/state/etf_strategy_equity.json
          python scripts/sync_formal_files.py
          git add data/state/etf_strategy_equity.json ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md data/state/CURRENT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: persist accepted ETF equity and formal projection"
          git push origin HEAD:main
      - name: Consume pending trade-fact corrections
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          correction_requests=(requests/trade_fact_correction/*.json)
          if [ "${#correction_requests[@]}" -eq 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git reset --hard origin/main
          for request in "${correction_requests[@]}"; do python scripts/apply_trade_fact_correction.py "$request"; done
          git add events/trades data/state/etf_strategy_equity.json data/state/trade_fact_correction_receipt.json ETF交易复盘与经验库_2026.md ETF市场行情档案_2026.md ETF当前状态_DASHBOARD.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: consume trade fact corrections"
          git push origin HEAD:main
      - name: Bind acceptance to post-correction main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git reset --hard origin/main
          echo "ETF_ACCEPTANCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Classify mutation for combination acceptance
        id: acceptance_scope
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -m -r "$ETF_ACCEPTANCE_SHA" | python scripts/acceptance_scope.py --stdin | tee "$RUNNER_TEMP/acceptance_scope.json"
          python - "$RUNNER_TEMP/acceptance_scope.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          scope = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"required={'true' if scope['required'] else 'false'}")
          print(f"classes={','.join(scope['classes'])}")
          PY
      - name: Run canonical post-write acceptance
        id: acceptance
        if: steps.acceptance_scope.outputs.required == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python scripts/run_production_acceptance.py --mutation-sha "$ETF_ACCEPTANCE_SHA"
      - name: Persist acceptance result
        if: ${{ always() && steps.acceptance_scope.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          owned="$RUNNER_TEMP/etf-acceptance-state"
          mkdir -p "$owned/data/state"
          for f in data/state/system_consistency.json data/state/maintenance_health.json data/state/maintenance_diagnostic.json data/state/last_known_good.json data/state/e2e_status.json data/state/execution_quality.json; do if [ -f "$f" ]; then cp "$f" "$owned/$f"; fi; done
          git fetch --no-tags origin main
          git reset --hard origin/main
          for f in data/state/system_consistency.json data/state/maintenance_health.json data/state/maintenance_diagnostic.json data/state/last_known_good.json data/state/e2e_status.json data/state/execution_quality.json; do if [ -f "$owned/$f" ]; then cp "$owned/$f" "$f"; git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: persist production acceptance"
          git push origin HEAD:main
      - name: Enforce production acceptance
        if: ${{ always() && steps.acceptance_scope.outputs.required == 'true' && steps.acceptance.outcome == 'failure' }}
        run: exit 1
