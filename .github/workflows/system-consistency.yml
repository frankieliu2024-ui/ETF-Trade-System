name: ETF system consistency
# Remote latest-main consistency validation trigger; active US and formal overseas contexts are refreshed before audit without relaxing freshness limits.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ETF规则_MASTER.md"
      - "ETF当前状态_DASHBOARD.md"
      - "ETF交易复盘与经验库_2026.md"
      - "ETF市场行情档案_2026.md"
      - "ETF与市场监测数据接口使用规范.md"
      - "ETF_SYSTEM_INDEX.md"
      - "config/market/**"
      - "config/runtime_policy.json"
      - "scripts/**"
      - ".github/workflows/**"
      - "requests/research_backfill/*.json"
      - "requests/trade_fact_correction/*.json"
      - "data/state/CURRENT.json"
      - "data/state/runtime_health.json"
      - "data/state/overseas_runtime_health.json"
      - "data/state/stock_context.json"
      - "data/state/stock_market_context.json"
      - "data/state/query_context.json"
      - "data/state/decision_context.json"
      - "data/state/market_delta.json"
      - "data/state/research_context.json"
      - "data/state/relative_strength.json"
      - "data/state/research_master_candidates.json"
      - "data/state/historical_backfill_status.json"
      - "data/state/historical_position_research.json"
      - "data/state/etf_strategy_equity.json"
      - "events/research/daily_features/**"
      - "data/market/audit/research_backfill/**"
      - "research/reports/**"
      - "post_market_review/**"
  schedule:
    # Pre-market readiness fallback. The dedicated overseas pulse remains the
    # primary collector; these runs prevent a missed/delayed GitHub schedule
    # from leaving formal overseas_context on the previous Beijing date.
    - cron: "50 23 * * 0-4"   # Beijing 07:50 Mon-Fri
    - cron: "20,50 0 * * 1-5" # Beijing 08:20 / 08:50 Mon-Fri

permissions:
  contents: write

concurrency:
  group: etf-system-consistency
  cancel-in-progress: false

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh formal overseas and Asia index context for pre-market readiness
        shell: bash
        run: |
          python scripts/build_overseas_context.py
      - name: Refresh US extended-hours context for point-in-time audit
        shell: bash
        run: |
          python scripts/build_us_extended_hours_context.py
      - name: Detect research backfill request
        id: backfill_request
        shell: bash
        run: |
          files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/research_backfill/*.json' || true)
          if [ -n "$files" ]; then
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$files" > /tmp/research_backfill_requests.txt
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect trade fact correction request
        id: trade_fact_correction_request
        shell: bash
        run: |
          files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/trade_fact_correction/*.json' || true)
          if [ -n "$files" ]; then
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$files" > /tmp/trade_fact_correction_requests.txt
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run requested research historical backfill
        id: backfill
        if: ${{ steps.backfill_request.outputs.has_request == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pandas
          rc=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            python scripts/backfill_research_daily_history.py "$f" || rc=$?
            [ "$rc" -ne 0 ] && break
          done < /tmp/research_backfill_requests.txt
          exit "$rc"
      - name: Apply confirmed trade fact correction
        id: trade_fact_correction
        if: ${{ steps.trade_fact_correction_request.outputs.has_request == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          rc=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            python scripts/apply_trade_fact_correction.py "$f" || rc=$?
            [ "$rc" -ne 0 ] && break
          done < /tmp/trade_fact_correction_requests.txt
          exit "$rc"
      - name: Refresh decision and query context
        id: refresh_context
        shell: bash
        run: |
          python scripts/build_state_context.py
          python scripts/build_query_context.py
      - name: Validate formal files, data standard, monitoring layers and runtime wiring
        id: consistency
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/check_system_consistency.py
          rc1=$?
          python scripts/check_research_integration.py
          rc2=$?
          python scripts/check_market_state_consistency.py
          rc3=$?
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ] || [ "$rc3" -ne 0 ]; then
            exit 1
          fi
      - name: Reconcile ETF ledger and prepare maintenance diagnostics
        id: maintenance_guard
        continue-on-error: true
        shell: bash
        run: |
          python scripts/maintenance_guard.py
      - name: Build top-level end-to-end readiness
        id: e2e_status
        if: ${{ always() }}
        shell: bash
        run: |
          python scripts/build_e2e_status.py
      - name: Persist consistency and maintenance state
        if: ${{ always() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve only files owned by this validation run, then rebase the
          # worktree to latest main before committing. This avoids conflicts
          # when another state-only workflow advances main concurrently.
          mkdir -p /tmp/etf-owned-state/data/state
          for f in data/state/system_consistency.json data/state/maintenance_health.json data/state/maintenance_diagnostic.json data/state/last_known_good.json data/state/e2e_status.json data/state/us_extended_hours_context.json data/state/overseas_context.json; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/etf-owned-state/$(dirname "$f")"
              cp "$f" "/tmp/etf-owned-state/$f"
            fi
          done
          if [ "${{ steps.backfill_request.outputs.has_request }}" = "true" ]; then
            mkdir -p /tmp/etf-owned-state/backfill
            cp -r data/state/historical_backfill_status.json data/state/historical_position_research.json research/reports events/research/daily_features /tmp/etf-owned-state/backfill/ 2>/dev/null || true
          fi
          if [ "${{ steps.trade_fact_correction_request.outputs.has_request }}" = "true" ] && [ "${{ steps.trade_fact_correction.outcome }}" != "failure" ]; then
            mkdir -p /tmp/etf-owned-state/trade-correction/events/trades /tmp/etf-owned-state/trade-correction/data/state
            cp ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md /tmp/etf-owned-state/trade-correction/
            cp data/state/etf_strategy_equity.json data/state/trade_fact_correction_receipt.json /tmp/etf-owned-state/trade-correction/data/state/ 2>/dev/null || true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              event_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8")).get("trade_event_id",""))' "$f")
              [ -z "$event_id" ] || cp "events/trades/$event_id.json" /tmp/etf-owned-state/trade-correction/events/trades/
            done < /tmp/trade_fact_correction_requests.txt
          fi

          git fetch origin main
          git reset --hard origin/main
          for f in data/state/system_consistency.json data/state/maintenance_health.json data/state/maintenance_diagnostic.json data/state/last_known_good.json data/state/e2e_status.json data/state/us_extended_hours_context.json data/state/overseas_context.json; do
            if [ -f "/tmp/etf-owned-state/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "/tmp/etf-owned-state/$f" "$f"
              git add "$f"
            fi
          done

          if [ "${{ steps.backfill_request.outputs.has_request }}" = "true" ]; then
            # Historical backfill remains owned by this workflow; existing
            # backfill persistence behavior is intentionally unchanged.
            git add data/state/historical_backfill_status.json data/state/historical_position_research.json research/reports events/research/daily_features 2>/dev/null || true
            git add -f -- data/market/audit/research_backfill 2>/dev/null || true
          fi
          if [ "${{ steps.trade_fact_correction_request.outputs.has_request }}" = "true" ] && [ "${{ steps.trade_fact_correction.outcome }}" != "failure" ]; then
            cp /tmp/etf-owned-state/trade-correction/ETF当前状态_DASHBOARD.md .
            cp /tmp/etf-owned-state/trade-correction/ETF市场行情档案_2026.md .
            cp /tmp/etf-owned-state/trade-correction/ETF交易复盘与经验库_2026.md .
            cp /tmp/etf-owned-state/trade-correction/data/state/etf_strategy_equity.json data/state/
            cp /tmp/etf-owned-state/trade-correction/data/state/trade_fact_correction_receipt.json data/state/ 2>/dev/null || true
            cp /tmp/etf-owned-state/trade-correction/events/trades/*.json events/trades/ 2>/dev/null || true
            git add ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md data/state/etf_strategy_equity.json data/state/trade_fact_correction_receipt.json events/trades 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "${{ steps.trade_fact_correction_request.outputs.has_request }}" = "true" ] && [ "${{ steps.trade_fact_correction.outcome }}" != "failure" ]; then
            msg="state: backfill confirmed trade fee facts"
          elif [ "${{ steps.backfill_request.outputs.has_request }}" = "true" ]; then
            msg="research: backfill ETF daily evidence"
          else
            msg="state: refresh consistency maintenance and e2e readiness"
          fi
          git commit -m "$msg"
          git push origin HEAD:main
      - name: Enforce research backfill result
        if: ${{ steps.backfill_request.outputs.has_request == 'true' && steps.backfill.outcome == 'failure' }}
        run: exit 1
      - name: Enforce trade fact correction result
        if: ${{ steps.trade_fact_correction_request.outputs.has_request == 'true' && steps.trade_fact_correction.outcome == 'failure' }}
        run: exit 1
      - name: Enforce hard consistency result
        if: ${{ steps.consistency.outcome == 'failure' }}
        run: exit 1
      - name: Enforce maintenance reconciliation result
        if: ${{ steps.maintenance_guard.outcome == 'failure' }}
        run: exit 1
