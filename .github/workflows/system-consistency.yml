name: ETF system consistency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ETF规则_MASTER.md"
      - "ETF当前状态_DASHBOARD.md"
      - "ETF交易复盘与经验库_2026.md"
      - "ETF市场行情档案_2026.md"
      - "ETF与市场监测数据接口使用规范.md"
      - "ETF_SYSTEM_INDEX.md"
      - "config/market/**"
      - "config/runtime_policy.json"
      - "scripts/**"
      - ".github/workflows/**"
      - "data/state/CURRENT.json"
      - "data/state/runtime_health.json"
      - "data/state/overseas_runtime_health.json"
      - "data/state/us_extended_hours_context.json"
      - "data/state/stock_context.json"
      - "data/state/stock_market_context.json"
      - "data/state/query_context.json"
      - "data/state/decision_context.json"
      - "data/state/market_delta.json"
      - "post_market_review/**"

permissions:
  contents: write

concurrency:
  group: etf-system-consistency
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate formal files, data standard, monitoring layers and runtime wiring
        id: consistency
        continue-on-error: true
        run: python scripts/check_system_consistency.py
      - name: Persist consistency state
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/system_consistency.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "state: refresh system consistency"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce hard consistency result
        if: ${{ steps.consistency.outcome == 'failure' }}
        run: exit 1
