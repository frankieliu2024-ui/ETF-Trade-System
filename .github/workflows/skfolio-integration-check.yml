name: Temporary skfolio integration check

on:
  push:
    branches: [main]
    paths:
      - "requests/research_backfill/skfolio_integration_trigger.txt"

permissions:
  contents: write

concurrency:
  group: skfolio-integration-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wire skfolio evidence into shared decision-context builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/state_manager.py')
          text=p.read_text(encoding='utf-8')
          if 'skfolio_risk = read_json(root / "data" / "state" / "skfolio_risk_evidence.json"' not in text:
              old='    delta = read_json(root / "data" / "state" / "research_evidence_delta.json", {"items": [], "read_only": True})\n'
              new=old+'    skfolio_risk = read_json(root / "data" / "state" / "skfolio_risk_evidence.json", {"status": "MISSING", "decision_eligible": False, "trade_signal": None, "read_only": True})\n'
              if old not in text:
                  raise SystemExit('shared decision-context patch anchor 1 missing')
              text=text.replace(old,new,1)
          marker='"prior_research_as_of_beijing": delta.get("prior_as_of_beijing", ""), "etf_evidence": items,'
          if '"skfolio_risk_evidence": skfolio_risk,' not in text:
              if marker not in text:
                  raise SystemExit('shared decision-context patch anchor 2 missing')
              text=text.replace(marker, marker+'\n        "skfolio_risk_evidence": skfolio_risk,',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Build integrated research context
        run: |
          python scripts/build_state_context.py
          python scripts/build_query_context.py
      - name: Enforce skfolio research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/state/skfolio_risk_evidence.json').read_text(encoding='utf-8'))
          d=json.loads(Path('data/state/decision_context.json').read_text(encoding='utf-8'))
          q=json.loads(Path('data/state/query_context.json').read_text(encoding='utf-8'))
          assert r.get('decision_eligible') is False
          assert r.get('trade_signal') is None
          assert r.get('portfolio_target') is None
          assert r.get('trial_confirm') is None
          assert r.get('master_override') is False
          embedded=(d.get('research_evidence') or {}).get('skfolio_risk_evidence') or {}
          qembedded=((q.get('decision_context') or {}).get('research_evidence') or {}).get('skfolio_risk_evidence') or {}
          assert embedded.get('mode') == 'SKFOLIO_VALIDATED_RISK_EVIDENCE'
          assert embedded.get('decision_eligible') is False
          assert qembedded.get('mode') == 'SKFOLIO_VALIDATED_RISK_EVIDENCE'
          assert qembedded.get('decision_eligible') is False
          assert d.get('skfolio_risk_evidence_file') == 'data/state/skfolio_risk_evidence.json'
          print(json.dumps({'risk_status':r.get('status'),'use_in_current_decision':r.get('use_in_current_decision'),'risk_data_end':r.get('risk_data_end'),'account_fact_status':r.get('account_fact_status'),'query_context_embedded':True}, ensure_ascii=False))
          PY
      - name: Commit integration state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- scripts/state_manager.py data/state events/research
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: activate minimal skfolio evidence integration"
          git pull --rebase origin main
          git push origin HEAD:main
