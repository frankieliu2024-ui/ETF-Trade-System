name: ETF account fact maintenance

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Canonical account-sync request path under requests/account_sync/"
        required: true
        type: string
  push:
    paths:
      - "requests/account_sync/**"

permissions:
  contents: write

concurrency:
  # Account facts have an independent canonical write set; the final push
  # still rebases against latest-main before publishing.
  group: etf-main-state-writer
  cancel-in-progress: false

jobs:
  account-fact-maintenance:
    runs-on: ubuntu-latest
    # Fast account-derived lane; historical replay, discovery and research
    # remain asynchronous in their existing owners.
    timeout-minutes: 15
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Account maintenance only needs the pushed commit and its parent.
          # Avoid fetching the repository's full branch graph on every run.
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Select one canonical account-sync request
        id: request
        shell: bash
        env:
          REQUEST_INPUT: ${{ github.event.inputs.request_path || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUEST_INPUT" ]; then
            request_path="$REQUEST_INPUT"
          else
            request_path="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/account_sync/*.json' | head -n 1 || true)"
          fi
          case "$request_path" in
            requests/account_sync/*.json) ;;
            *) echo "exactly one canonical account-sync request is required" >&2; exit 1 ;;
          esac
          test -s "$request_path"
          python - "$request_path" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          obj = json.loads(path.read_text(encoding="utf-8"))
          if str(obj.get("request_type") or "").upper() not in {"STATE_SYNC_ONLY", "ACCOUNT_FACT_REFRESH"}:
              raise SystemExit("unsupported account-sync request_type")
          if not isinstance(obj.get("account_fact"), dict):
              raise SystemExit("account_fact is required")
          positions = obj["account_fact"].get("positions")
          if not isinstance(positions, list) or not positions:
              raise SystemExit("account_fact.positions is required")
          codes = []
          for item in positions:
              if not isinstance(item, dict) or not str(item.get("code") or "").isdigit():
                  raise SystemExit("every position must be keyed by a security code")
              codes.append(str(item["code"]))
          if len(codes) != len(set(codes)):
              raise SystemExit("duplicate security code in positions")
          print("validated request:", path)
          PY
          echo "request_path=$request_path" >> "$GITHUB_OUTPUT"
      - name: Apply canonical account fact
        id: sync
        shell: bash
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          set -euo pipefail
          python scripts/process_state_sync_request.py "$REQUEST_PATH"
      - name: Rebuild execution quality projection
        id: execution_quality
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the read-only execution-quality projection from the
          # canonical trade events written by the account-sync owner.
          python scripts/build_execution_quality.py

      - name: Rebuild held-stock market projection
        id: stock_market
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Refresh the held-stock market facts in the same account-maintenance
          # owner before strategy risk reconstruction and downstream projection.
          python scripts/build_stock_context.py
          python scripts/build_account_stock_market.py

      - name: Rebuild required account projection
        id: projection
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # process_state_sync_request.py already delegates the canonical
          # account mirror and formal-file projection to sync_formal_files.
          # Keep that owner registered here without invoking it a second time.
          # Keep only the projection that
          # is not part of that owner, then run the single final health guard
          # after readback.
          python scripts/rebuild_etf_strategy_equity.py --output data/state/etf_strategy_equity.json

      - name: Refresh Dashboard after strategy risk rebuild
        id: dashboard_refresh
        shell: bash
        run: |
          set -euo pipefail
          # Strategy equity/risk is rebuilt immediately before this step.
          # Re-render the factual Dashboard from that same canonical state so
          # the human projection cannot retain the pre-rebuild risk value.
          python scripts/sync_formal_files.py

      - name: Verify account fact by code
        shell: bash
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          set -euo pipefail
          python - "$REQUEST_PATH" <<'PY'
          import json, sys
          from pathlib import Path
          request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          account = json.loads(Path("data/state/account_fact.json").read_text(encoding="utf-8"))
          by_code = {str(item.get("code")): item for item in account.get("positions", [])}
          for item in request["account_fact"]["positions"]:
              code = str(item["code"])
              actual = by_code.get(code)
              if actual is None:
                  raise SystemExit(f"missing account position: {code}")
              for key in ("quantity", "available_quantity"):
                  if key in item and actual.get(key) != item[key]:
                      raise SystemExit(f"position mismatch for {code}: {key}")
          print("account fact readback passed with code-keyed identity")
          PY
      - name: Run fast account consistency acceptance
        id: fast_consistency
        shell: bash
        env:
          ETF_CONSISTENCY_REPORT_PATH: ${{ runner.temp }}/account-fast-consistency.json
        run: |
          set -euo pipefail
          python scripts/check_system_consistency.py \
            --scope account-fast \
            --report-path "$ETF_CONSISTENCY_REPORT_PATH"
          test -s "$ETF_CONSISTENCY_REPORT_PATH"

      - name: Record account sync readback
        shell: bash
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          RUN_ID: ${{ github.run_id }}
          OWNER_OUTCOME: ${{ (steps.sync.outcome == 'success' && steps.execution_quality.outcome == 'success' && steps.projection.outcome == 'success' && steps.fast_consistency.outcome == 'success') && 'success' || 'failure' }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          EXECUTION_QUALITY_OUTCOME: ${{ steps.execution_quality.outcome }}
          STOCK_MARKET_OUTCOME: ${{ steps.stock_market.outcome }}
        run: |
          set -euo pipefail
          request_id="$(python - "$REQUEST_PATH" <<'PY'
          import json, sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("request_id", ""))
          PY
          )"
          test -n "$request_id"
          python scripts/record_account_sync_maintenance.py \
            --request-id "$request_id" \
            --request-path "$REQUEST_PATH" \
            --owner-outcome "$OWNER_OUTCOME" \
            --projection-outcome "$PROJECTION_OUTCOME" \
            --execution-quality-outcome "$EXECUTION_QUALITY_OUTCOME" \
            --run-id "$RUN_ID"
      - name: Finalize maintenance health after account readback
        id: maintenance_guard
        continue-on-error: true
        shell: bash
        env:
          ETF_CONSISTENCY_REPORT_PATH: ${{ runner.temp }}/account-fast-consistency.json
        run: |
          set -euo pipefail
          # Record account sync readback may mark projections stale before the
          # final verification. Re-run the guard on the same rebuilt state so
          # the published health file reflects the final closed-loop result.
          python scripts/maintenance_guard.py --scope account-fast

      - name: Commit account fact maintenance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No account fact changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish the canonical fact and every deterministic projection produced from this same fact.
          git add data/state/account_fact.json data/state/CURRENT.json data/state/fixed_ratio_position_metrics.json data/state/etf_strategy_equity.json data/state/stock_context.json data/state/stock_market_context.json data/state/execution_quality.json data/state/maintenance_health.json events/trades events/reviews requests/account_sync requests/report_delivery config/market/etf_monitor_universe.json ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish account facts through direct maintenance lane"
          # The owner may generate derived files while applying the canonical fact.
          # Keep them out of the rebase workspace so latest-main retry is clean.
          git stash push --include-untracked -m "account-fact-maintenance-derived" >/dev/null || true
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              # maintenance_health.json is a deterministic projection produced
              # from this same account fact. If another maintenance lane updated
              # only this derived file while we were running, keep this run's
              # freshly rebuilt health projection and continue the publish.
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicted" = "data/state/maintenance_health.json" ] || [ "$conflicted" = "ETF当前状态_DASHBOARD.md" ]; then
                git checkout --theirs -- $conflicted
                git add $conflicted
                GIT_EDITOR=true git -c core.editor=true rebase --continue
                if git push origin HEAD:main; then
                  exit 0
                fi
              fi
            fi
            git rebase --abort || true
          done
          exit 1

      - name: Fail maintenance when required projection or global guard failed
        if: steps.projection.outcome != 'success' || steps.fast_consistency.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "account fact was published, but a required account projection or fast account consistency acceptance failed; global maintenance warnings remain recorded in maintenance_health.json" >&2
          exit 1

