name: ETF account fact maintenanceon:  workflow_dispatch:    inputs:      request_path:        description: "Canonical account-sync request path under requests/account_sync/"        required: true        type: string  push:    paths:      - "requests/account_sync/**"permissions:  contents: writeconcurrency:  # Account facts have an independent canonical write set; the final push  # still rebases against latest-main before publishing.  group: etf-main-state-writer  cancel-in-progress: falsejobs:  account-fact-maintenance:    runs-on: ubuntu-latest    # Fast account-derived lane; historical replay, discovery and research    # remain asynchronous in their existing owners.    timeout-minutes: 15    env:      ETF_SYSTEM_ROOT: ${{ github.workspace }}    steps:      - uses: actions/checkout@v5        with:          # Account maintenance only needs the pushed commit and its parent.          # Avoid fetching the repository's full branch graph on every run.          fetch-depth: 2
