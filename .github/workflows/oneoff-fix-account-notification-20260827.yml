name: One-off fix account notification 20260827
on:
  push:
    paths:
      - ".github/workflows/oneoff-fix-account-notification-20260827.yml"
permissions:
  contents: write
concurrency:
  group: production-main-writer
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Remove duplicate generic account notification path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/notification_center.py')
          s=p.read_text(encoding='utf-8')
          old='''    account = read_json(STATE / "account_fact.json", {})\n    event_type, applicable = str(trigger.get("trigger_type") or ""), str(trigger.get("applicable_object") or "")\n    if event_type == "TRADE_CONFIRMED":\n'''
          new='''    account = read_json(STATE / "account_fact.json", {})\n    event_type, applicable = str(trigger.get("trigger_type") or ""), str(trigger.get("applicable_object") or "")\n    # Account changes have one canonical notification path only.  The dedicated\n    # account_confirmation_event() applies freshness, materiality and exact-delta\n    # checks; routing the same change through decision_event() creates duplicate,\n    # generic alerts such as mark-to-market total_asset moves.\n    if event_type == "ACCOUNT_STRUCTURE_CHANGED":\n        return None\n    if event_type == "TRADE_CONFIRMED":\n'''
          if old not in s:
              raise RuntimeError('decision_event insertion anchor not found')
          s=s.replace(old,new,1)
          obsolete='''    elif event_type == "ACCOUNT_STRUCTURE_CHANGED":\n        target = display_from_code(applicable, account); title = "账户状态发生重要变化"; content = f"{target}相关的持仓、现金或资产结构出现已确认变化。\\n\\n建议：现在重新检查当前持仓和可用资金，确认是否需要调整原交易判断。"\n'''
          if obsolete not in s:
              raise RuntimeError('obsolete generic account branch not found')
          s=s.replace(obsolete,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate notification routing
        run: |
          python -m py_compile scripts/notification_center.py
          PYTHONPATH=scripts python - <<'PY'
          import notification_center as n
          original=n.read_json
          try:
              def account_trigger(path, default=None):
                  name=getattr(path,'name','')
                  if name=='decision_trigger.json':
                      return {
                          'requires_formal_reassessment': True,
                          'status': 'TRIGGERED',
                          'idempotency_key': 'test-account',
                          'trigger_type': 'ACCOUNT_STRUCTURE_CHANGED',
                          'applicable_object': 'total_asset',
                      }
                  if name=='account_fact.json':
                      return {}
                  return default if default is not None else {}
              n.read_json=account_trigger
              assert n.decision_event() is None, 'generic account change must not use decision_event'

              def risk_trigger(path, default=None):
                  name=getattr(path,'name','')
                  if name=='decision_trigger.json':
                      return {
                          'requires_formal_reassessment': True,
                          'status': 'TRIGGERED',
                          'idempotency_key': 'test-risk',
                          'trigger_type': 'RISK_BOUNDARY_CROSSED',
                      }
                  if name=='account_fact.json':
                      return {}
                  return default if default is not None else {}
              n.read_json=risk_trigger
              event=n.decision_event()
              assert event and event['title']=='ETF策略风险状态发生变化', event
              print('notification routing PASS')
          finally:
              n.read_json=original
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/notification_center.py
          git commit -m "fix: route account notifications through one actionable path"
          git push origin HEAD:main
