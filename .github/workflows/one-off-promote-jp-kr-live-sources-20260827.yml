name: One-off promote JP KR live sources 2026-08-27
on:
  push:
    paths:
      - ".github/workflows/one-off-promote-jp-kr-live-sources-20260827.yml"
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply validated provider priorities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('scripts/build_overseas_context.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('            if object_id != "HSTECH":\n')
          end=s.index('            else:\n                attempts: list[dict] = []\n                candidates: list[tuple[dict, dict]] = []\n', start)
          new='''            if object_id != "HSTECH":\n                attempts: list[dict] = []\n                record: dict | None = None\n                selected_provider_id = ""\n\n                # N225/KOSPI priorities were promoted after three parallel live rounds on\n                # 2026-08-27. Yahoo remained ~15m/~20m delayed respectively, while the\n                # selected live paths stayed within seconds of capture. Other objects keep\n                # the existing Yahoo-first policy.\n                if object_id in {"N225", "KOSPI"}:\n                    secid = EASTMONEY_DIRECT_FALLBACKS.get(object_id)\n                    if object_id == "N225":\n                        direct_chain = [\n                            (f"eastmoney_push2delay:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2delay.eastmoney.com")),\n                            (f"eastmoney_push2:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")),\n                            ("yahoo_chart_api", lambda: fetch_yahoo(object_id, spec, generated_utc)),\n                        ]\n                        configured_primary = f"eastmoney_push2delay:{secid}"\n                    else:\n                        direct_chain = [\n                            ("naver_finance:KOSPI", lambda: fetch_naver_kospi(generated_utc)),\n                            (f"eastmoney_push2delay:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2delay.eastmoney.com")),\n                            (f"eastmoney_push2:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")),\n                            ("yahoo_chart_api", lambda: fetch_yahoo(object_id, spec, generated_utc)),\n                        ]\n                        configured_primary = "naver_finance:KOSPI"\n\n                    last_candidate: dict | None = None\n                    for provider_id, loader in direct_chain:\n                        try:\n                            candidate = loader()\n                            summary = provider_attempt(candidate, provider_id, generated_utc)\n                            attempts.append(summary)\n                            last_candidate = candidate\n                            if candidate.get("quality_status") == "PASS" and summary.get("stable_for_10m_pulse") is True:\n                                record = candidate\n                                selected_provider_id = provider_id\n                                record["selected_provider_id"] = provider_id\n                                record["selection_basis"] = "validated_live_priority_first_usable_direct_source"\n                                break\n                        except Exception as provider_exc:\n                            attempts.append(failed_attempt(provider_id, str(provider_exc)[-500:], generated_utc, timezone_name=spec["timezone"]))\n                    if record is None and last_candidate is not None:\n                        record = last_candidate\n                    if record is None:\n                        raise RuntimeError("no usable direct source in validated JP/KR chain")\n                    record["provider_attempts"] = attempts\n                    record["direct_source_chain"] = [provider_id for provider_id, _ in direct_chain]\n                    record["configured_primary"] = configured_primary\n                else:\n                    primary_error = ""\n                    try:\n                        primary = fetch_yahoo(object_id, spec, generated_utc)\n                        primary_summary = provider_attempt(primary, "yahoo_chart_api", generated_utc)\n                        attempts.append(primary_summary)\n                        primary_freshness = primary_summary.get("freshness_status")\n                        primary_open_stale = primary.get("market_phase_at_generation") == "OPEN" and primary_freshness in {"DELAYED", "STALE"}\n                        if primary.get("quality_status") == "PASS" and not primary_open_stale:\n                            record = primary\n                            record["selection_basis"] = "configured_primary_yahoo_valid_for_current_market_phase"\n                        else:\n                            record = primary\n                            primary_error = f"primary quality={primary.get('quality_status')} freshness={primary_freshness}"\n                    except Exception as primary_exc:\n                        primary_error = str(primary_exc)[-500:]\n                        attempts.append(failed_attempt("yahoo_chart_api", primary_error, generated_utc, timezone_name=spec["timezone"]))\n\n                    secid = EASTMONEY_DIRECT_FALLBACKS.get(object_id)\n                    if secid and (record is None or primary_error):\n                        provider_id = f"eastmoney_push2:{secid}"\n                        try:\n                            fallback = fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")\n                            fallback_summary = provider_attempt(fallback, provider_id, generated_utc)\n                            attempts.append(fallback_summary)\n                            if fallback.get("quality_status") == "PASS" and fallback_summary.get("stable_for_10m_pulse") is True:\n                                record = fallback\n                                record["selected_provider_id"] = provider_id\n                                record["selection_basis"] = "yahoo_primary_delayed_then_verified_eastmoney_direct_fallback"\n                            elif record is None:\n                                record = fallback\n                        except Exception as fallback_exc:\n                            attempts.append(failed_attempt(provider_id, str(fallback_exc)[-500:], generated_utc, timezone_name=spec["timezone"]))\n\n                    if record is None:\n                        raise RuntimeError(primary_error or "no usable direct source")\n                    if secid:\n                        record["provider_attempts"] = attempts\n                        record["direct_source_chain"] = ["yahoo_chart_api", f"eastmoney_push2:{secid}"]\n                        record["configured_primary"] = "yahoo_chart_api"\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')

          cfgp=Path('config/market/provider_priority.json')
          cfg=json.loads(cfgp.read_text(encoding='utf-8'))
          cfg['version']='V1.9'
          cfg['providers']['yahoo_chart_api']['role']='primary_for_formal_overseas_indices_except_HSTECH_N225_KOSPI_and_us_extended_hours; delayed_crosscheck_for_N225_KOSPI'
          cfg['providers']['naver_finance']['role']='primary_for_KOSPI_after_live_parallel_validation_20260827'
          cfg['providers']['eastmoney_push2delay']['kind']='东方财富push2备用host；对日经225指数（N225）经2026-08-27三轮开盘并行验证后作为该对象首选生产endpoint；对韩国综合指数（KOSPI）作为Naver后的直接备源；仍属于东方财富同一provider家族，不计作独立第二数据源'
          cfg['providers']['eastmoney_push2delay']['role']='preferred_endpoint_for_N225_and_verified_direct_fallback_for_KOSPI'
          cfg['objects']['N225']=['eastmoney_push2delay:100.N225','eastmoney_push2:100.N225','yahoo_chart_api','ETF_PROXY_513520']
          cfg['objects']['KOSPI']=['naver_finance:KOSPI','eastmoney_push2delay:100.KS11','eastmoney_push2:100.KS11','yahoo_chart_api']
          cfg['object_fallback_policy']['N225']={
              'primary':'eastmoney_push2delay:100.N225',
              'fallback':['eastmoney_push2:100.N225','yahoo_chart_api','ETF_PROXY_513520'],
              'direct_only':False
          }
          cfg['object_fallback_policy']['KOSPI']={
              'primary':'naver_finance:KOSPI',
              'fallback':['eastmoney_push2delay:100.KS11','eastmoney_push2:100.KS11','yahoo_chart_api'],
              'direct_only':True
          }
          cfgp.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          dp=Path('ETF与市场监测数据接口使用规范.md')
          d=dp.read_text(encoding='utf-8')
          d=d.replace('> 版本：V1.8  ','> 版本：V1.9  ',1)
          marker='机器JSON内部可以保留 `PASS`、`DEGRADED`、`FAILED`、`FRESH`、`DELAYED`、`STALE` 等枚举供程序判断；正式用户输出统一转换为中文业务语言，不得把内部状态码本身作为结论。\n'
          addition=marker+'\n日韩指数开盘行情源优先级以真实provider时点为准。2026-08-27开盘并行验证后，韩国综合指数（KOSPI）以Naver Finance实时直连为主源、东方财富实时endpoint为直接备源、Yahoo仅作延迟型交叉参考；日经225指数（N225）以已验证低延迟的东方财富endpoint为首选，东方财富同家族另一host仅作网络重试，Yahoo保留为延迟型交叉参考。后续若真实时点或稳定性发生变化，仍按质量门禁动态切换，不因名义主源强制采用旧值。\n'
          if marker in d and '2026-08-27开盘并行验证后' not in d:
              d=d.replace(marker,addition,1)
          dp.write_text(d,encoding='utf-8')
          PY
          python -m py_compile scripts/build_overseas_context.py
          python scripts/build_overseas_context.py
          python - <<'PY'
          import json
          d=json.load(open('data/state/overseas_context.json',encoding='utf-8'))
          n=d['objects']['N225']; k=d['objects']['KOSPI']
          assert n.get('configured_primary')=='eastmoney_push2delay:100.N225', n
          assert n.get('selected_provider_id')=='eastmoney_push2delay:100.N225', n
          assert n.get('freshness_status')=='FRESH', n
          assert k.get('configured_primary')=='naver_finance:KOSPI', k
          assert k.get('selected_provider_id')=='naver_finance:KOSPI', k
          assert k.get('freshness_status')=='FRESH', k
          print('PROMOTION_VALIDATED', n['latest']['as_of_beijing'], k['latest']['as_of_beijing'])
          PY
      - name: Commit production adjustment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/jpkr-promote/scripts /tmp/jpkr-promote/config/market /tmp/jpkr-promote/data/state
          cp scripts/build_overseas_context.py /tmp/jpkr-promote/scripts/
          cp config/market/provider_priority.json /tmp/jpkr-promote/config/market/
          cp ETF与市场监测数据接口使用规范.md /tmp/jpkr-promote/
          cp data/state/overseas_context.json /tmp/jpkr-promote/data/state/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/jpkr-promote/scripts/build_overseas_context.py scripts/
          cp /tmp/jpkr-promote/config/market/provider_priority.json config/market/
          cp /tmp/jpkr-promote/ETF与市场监测数据接口使用规范.md ./
          cp /tmp/jpkr-promote/data/state/overseas_context.json data/state/
          git add scripts/build_overseas_context.py config/market/provider_priority.json ETF与市场监测数据接口使用规范.md data/state/overseas_context.json
          git commit -m "fix: promote validated live sources for N225 and KOSPI"
          git push origin HEAD:main
