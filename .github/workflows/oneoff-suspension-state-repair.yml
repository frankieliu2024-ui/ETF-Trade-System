name: One-off suspension semantics documentation sync

on:
  push:
    paths:
      - '.github/workflows/oneoff-suspension-state-repair.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Sync general suspension semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ETF与市场监测数据接口使用规范.md')
          text = p.read_text(encoding='utf-8')
          marker = '### 1.1 用户可见状态语言\n\n机器状态码只服务程序判断，正式对用户输出统一使用中文业务语言：`PASS`→“数据可用”，`DEGRADED`→“数据受限”，`FAILED`→“当前不可用”；`FRESH`→“时点正常”，`DELAYED`→“存在延迟”，`STALE`→“时点过旧”，`SESSION_REFERENCE`→“已结束交易时段参考”，`PREVIOUS_SESSION_REFERENCE`→“上一交易时段参考”。必要时可在技术审计中括号附机器码，但交易分析、盘前、盘中、盘后正式输出不得只给英文内部枚举。\n'
          insert = marker + '\n### 1.2 停牌／暂停交易与行情失败的分离\n\n证券被provider明确标记为停牌或暂停交易时，属于有效的市场状态事实，不得误记为行情provider失败。系统应保留真实provider时点、最后有效参考价／昨收及明确的`trading_status`、`tradable=false`；不存在实际成交时不得伪造开高低、成交量或可成交价格。该对象可以在“市场状态数据可用”的前提下明确标注当前不可交易，并继续参加持仓事实、风险暴露和后续复牌监测；只有provider本身无法取得或无法确认对象状态时，才按数据受限／当前不可用处理。正常连续竞价对象仍须遵守完整行情字段和时点质量门禁，不因本条降低标准。\n'
          if '### 1.2 停牌／暂停交易与行情失败的分离' not in text:
              if marker not in text:
                  raise SystemExit('documentation insertion marker not found')
              text = text.replace(marker, insert, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit documentation sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ETF与市场监测数据接口使用规范.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: distinguish suspension from provider failure'
          git pull --rebase origin main
          git push origin HEAD:main
