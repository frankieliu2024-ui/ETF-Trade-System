name: One-off scope Eastmoney delay-host retry 2026-08-27
on:
  push:
    paths:
      - ".github/workflows/one-off-scope-eastmoney-delayhost-20260827.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scope retry and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_overseas_context.py')
          s=p.read_text(encoding='utf-8')
          old='''                    for host in ("push2.eastmoney.com", "push2delay.eastmoney.com"):\n                        provider_family = "eastmoney_push2" if host.startswith("push2.") else "eastmoney_push2delay"\n'''
          new='''                    eastmoney_hosts = ("push2.eastmoney.com", "push2delay.eastmoney.com") if object_id in {"N225", "KOSPI"} else ("push2.eastmoney.com",)\n                    for host in eastmoney_hosts:\n                        provider_family = "eastmoney_push2" if host.startswith("push2.") else "eastmoney_push2delay"\n'''
          if old not in s:
              raise SystemExit('scope target missing')
          s=s.replace(old,new,1)
          old2='''                    record["direct_source_chain"] = ["yahoo_chart_api", f"eastmoney_push2:{secid}", f"eastmoney_push2delay:{secid}"] + (["naver_finance:KOSPI"] if object_id == "KOSPI" else [])\n'''
          new2='''                    record["direct_source_chain"] = ["yahoo_chart_api", f"eastmoney_push2:{secid}"] + ([f"eastmoney_push2delay:{secid}"] if object_id in {"N225", "KOSPI"} else []) + (["naver_finance:KOSPI"] if object_id == "KOSPI" else [])\n'''
          if old2 not in s:
              raise SystemExit('chain target missing')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
          python -m py_compile scripts/build_overseas_context.py
          python scripts/build_overseas_context.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/build_overseas_context.py /tmp/build_overseas_context.py
          cp data/state/overseas_context.json /tmp/overseas_context.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/build_overseas_context.py scripts/build_overseas_context.py
          cp /tmp/overseas_context.json data/state/overseas_context.json
          git add scripts/build_overseas_context.py data/state/overseas_context.json
          git commit -m "fix: scope Eastmoney delay-host retry to N225 and KOSPI"
          git push origin HEAD:main
