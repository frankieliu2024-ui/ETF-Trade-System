name: IPO base stock signal research temp

on:
  push:
    branches:
      - research/ipo-base-stock-signals-20260827
    paths:
      - scripts/research_ipo_base_stock_signals_temp.py
      - scripts/run_ipo_base_stock_signal_research_temp.py
      - scripts/robustness_ipo_base_stock_signals_temp.py
      - .github/workflows/ipo-base-stock-signal-research-temp.yml

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ipo-base-stock-signals-20260827
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run PIT stock-specific signal validation
        run: python scripts/run_ipo_base_stock_signal_research_temp.py
      - name: Run yearly robustness validation
        run: python scripts/robustness_ipo_base_stock_signals_temp.py
      - name: Validate result boundaries
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/backtests/ipo_base_stock_signal_validation.json',encoding='utf-8'))
          r=json.load(open('research/backtests/ipo_base_stock_signal_robustness.json',encoding='utf-8'))
          assert x['point_in_time'] is True and r['point_in_time'] is True
          assert x['automatic_trade'] is False and r['automatic_trade'] is False
          assert x['trade_signal'] is None and r['trade_signal'] is None
          assert {s['code'] for s in x['stocks']} == {'300750','601138'}
          print(json.dumps({'primary_count':x['execution_eligible_signal_count'],'robust_count':r['robust_signal_count'],'robust_signals':r['robust_signals']},ensure_ascii=False))
          PY
      - name: Commit research results to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtests/ipo_base_stock_signal_validation.json research/backtests/ipo_base_stock_signal_robustness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record IPO-base stock signal robustness"
          git push origin HEAD:research/ipo-base-stock-signals-20260827
