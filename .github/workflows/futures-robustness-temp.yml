name: Futures robustness research temp

on:
  push:
    branches: [research/leading-indicators-20260827]
    paths: ["research/requests/index_futures_robustness.json"]

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/leading-indicators-20260827, fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q akshare pandas numpy scipy
      - name: Run stricter roll and time-split robustness
        shell: bash
        run: |
          python - <<'PY'
          import json, warnings, urllib.parse, urllib.request
          from pathlib import Path
          import numpy as np, pandas as pd
          from scipy.stats import spearmanr
          import akshare as ak
          warnings.filterwarnings('ignore')
          OUT=Path('research/backtests/index_futures_lead_robustness_validation.json')
          TARGETS={'561980':'561980','588000':'588000','159781':'159781','159992':'159992','515880':'515880','159326':'159326'}
          FUTS={'IF':('IF0','sh000300'),'IC':('IC0','sh000905'),'IM':('IM0','sh000852')}
          CANDIDATES=['IF_basis_change_5d','IC_basis_change_5d','IC_oi_change_1d','IM_basis_change_5d']
          def idx(sym):
            d=ak.stock_zh_index_daily(symbol=sym); d['date']=pd.to_datetime(d['date']); d['close']=pd.to_numeric(d['close'],errors='coerce'); return d[['date','close']].dropna().sort_values('date')
          def fut(sym):
            d=ak.futures_zh_daily_sina(symbol=sym); d['date']=pd.to_datetime(d['date']); d['close']=pd.to_numeric(d['close'],errors='coerce'); d['hold']=pd.to_numeric(d['hold'],errors='coerce'); return d[['date','close','hold']].dropna().sort_values('date')
          def etf(code):
            last=None
            for _ in range(3):
              try:
                d=ak.fund_etf_hist_em(symbol=code,period='daily',start_date='20220101',end_date='20260826',adjust=''); d=d.rename(columns={'日期':'date','收盘':'close'}); d['date']=pd.to_datetime(d['date']); d['close']=pd.to_numeric(d['close'],errors='coerce'); return d[['date','close']].dropna().sort_values('date')
              except Exception as e: last=e
            raise last
          def margins():
            url='https://datacenter-web.eastmoney.com/api/data/v1/get'; p={'reportName':'RPTA_WEB_MARGIN_DAILYTRADE','columns':'STATISTICS_DATE,FIN_BALANCE','pageNumber':'1','pageSize':'1000','sortColumns':'STATISTICS_DATE','sortTypes':'-1'}
            req=urllib.request.Request(url+'?'+urllib.parse.urlencode(p),headers={'User-Agent':'Mozilla/5.0 research'}); rows=((json.loads(urllib.request.urlopen(req,timeout=20).read().decode()).get('result') or {}).get('data') or [])
            d=pd.DataFrame(rows); d['date']=pd.to_datetime(d['STATISTICS_DATE'].astype(str).str[:10]); d['balance']=pd.to_numeric(d['FIN_BALANCE'],errors='coerce'); d=d[['date','balance']].dropna().sort_values('date'); d['margin5']=d['balance'].pct_change(5)*100; return d[['date','margin5']]
          res={'schema_version':'1.0','mode':'RESEARCH_ONLY_INDEX_FUTURES_ROBUSTNESS','decision_eligible':False,'trade_signal':None,'master_override':False,'pit':'T facts lagged to next ETF trading day','continuous_contract_limitation':'Still continuous-contract based; this stage sharply excludes roll-sensitive windows and demands time-split persistence. Passing does not by itself authorize production.','data_quality':{},'signals':{},'research_interpretation':'UNSET'}
          fac=None
          for k,(fs,isym) in FUTS.items():
            f=fut(fs).merge(idx(isym),on='date',suffixes=('_f','_s')).sort_values('date'); f['basis']=(f.close_f/f.close_s-1)*100; f['basis1']=f.basis.diff(); f['basis5']=f.basis.diff(5); f['oi1']=f['hold'].pct_change()*100
            # Very strict roll contamination mask: any >25% OI jump, >1.5pp basis jump, or >8% futures return invalidates ±5 trading observations.
            raw=(f.oi1.abs()>25)|(f.basis1.abs()>1.5)|(f.close_f.pct_change().abs()>0.08)
            bad=raw.copy()
            for j in range(1,6): bad=bad|raw.shift(j,fill_value=False)|raw.shift(-j,fill_value=False)
            f[f'{k}_clean']=~bad
            z=f[['date','basis5','oi1',f'{k}_clean']].rename(columns={'basis5':f'{k}_basis_change_5d','oi1':f'{k}_oi_change_1d'})
            fac=z if fac is None else fac.merge(z,on='date',how='outer')
            res['data_quality'][k]={'rows':len(f),'strict_clean_rows':int((~bad).sum()),'excluded_pct':round(float(bad.mean()*100),2)}
          try: fac=fac.merge(margins(),on='date',how='left')
          except Exception as e: res['data_quality']['margin_error']=f'{type(e).__name__}: {e}'
          rows_by={s:[] for s in CANDIDATES}
          for code in TARGETS:
            try: d=etf(code).merge(fac,on='date',how='left').sort_values('date')
            except Exception as e: res['data_quality'][code]={'error':f'{type(e).__name__}: {e}'}; continue
            for c in CANDIDATES+(['margin5'] if 'margin5' in d else []): d[c]=d[c].shift(1)
            d['mom5']=d.close.pct_change(5).shift(1)*100; d['mom20']=d.close.pct_change(20).shift(1)*100
            for h in [1,3,5]: d[f'fwd{h}']=(d.close.shift(-h)/d.close-1)*100
            for sig in CANDIDATES:
              clean=f"{sig.split('_')[0]}_clean"
              if clean in d: d[clean]=d[clean].shift(1)
              base=d[[sig,'mom5','mom20']+(['margin5'] if 'margin5' in d else [])+[clean,'date']+[f'fwd{h}' for h in [1,3,5]]].replace([np.inf,-np.inf],np.nan)
              for h in [1,3,5]:
                z=base[[sig,'mom5','mom20']+(['margin5'] if 'margin5' in base else [])+[clean,'date',f'fwd{h}']].dropna(); z=z[z[clean].astype(bool)]
                if len(z)<160: continue
                split=z.date.iloc[len(z)//2]
                for part,zz in [('early',z[z.date<=split]),('late',z[z.date>split])]:
                  if len(zz)<70: continue
                  ctr=['mom5','mom20']+(['margin5'] if 'margin5' in zz else []); X=np.column_stack([np.ones(len(zz))]+[zz[c].to_numpy(float) for c in ctr]); bx=np.linalg.lstsq(X,zz[sig].to_numpy(float),rcond=None)[0]; by=np.linalg.lstsq(X,zz[f'fwd{h}'].to_numpy(float),rcond=None)[0]; ic=float(spearmanr(zz[sig].to_numpy(float)-X@bx,zz[f'fwd{h}'].to_numpy(float)-X@by).statistic); rows_by[sig].append({'code':code,'horizon':h,'part':part,'n':len(zz),'partial_rank_ic':round(ic,4)})
          passing=[]
          for sig,rs in rows_by.items():
            vals=[r['partial_rank_ic'] for r in rs]; early=[r['partial_rank_ic'] for r in rs if r['part']=='early']; late=[r['partial_rank_ic'] for r in rs if r['part']=='late']
            if not vals: res['signals'][sig]={'tests':0,'passed':False}; continue
            me=float(np.median(early)); ml=float(np.median(late)); allm=float(np.median(vals)); cons=max(sum(x>0 for x in vals),sum(x<0 for x in vals))/len(vals)
            passed=np.sign(me)==np.sign(ml) and abs(me)>=0.03 and abs(ml)>=0.03 and abs(allm)>=0.045 and cons>=0.70
            res['signals'][sig]={'tests':len(vals),'early_median_ic':round(me,4),'late_median_ic':round(ml,4),'overall_median_ic':round(allm,4),'sign_consistency':round(cons,4),'passed':bool(passed)}
            if passed: passing.append(sig)
          res['passing_signals']=passing
          res['research_interpretation']='ROBUST_CONTINUOUS_CONTRACT_INCREMENT' if passing else 'STAGE1_NOT_ROBUST_TO_ROLL_AND_TIME_SPLIT'
          res['production_boundary']='Even passing signals remain research-only until contract-level expiry-aware history validates basis semantics; OI signal may advance independently if its source semantics are direct and PIT-safe.'
          OUT.write_text(json.dumps(res,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'interpretation':res['research_interpretation'],'passing':passing,'signals':res['signals']},ensure_ascii=False))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtests/index_futures_lead_robustness_validation.json
          git commit -m "research: record futures lead robustness result" || exit 0
          git push origin HEAD:research/leading-indicators-20260827
