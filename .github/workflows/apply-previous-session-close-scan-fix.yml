name: Apply previous-session close scan fix

on:
  push:
    branches:
      - research/formal-conversion-low-cost-alpha-20260828
    paths:
      - "scripts/apply_previous_session_close_scan_fix.py"
      - ".github/workflows/apply-previous-session-close-scan-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply exact prior-session scan
        run: python scripts/apply_previous_session_close_scan_fix.py
      - name: Validate
        run: |
          python -m py_compile scripts/build_overseas_context.py scripts/build_low_cost_alpha_evidence.py
          python -m unittest tests.test_low_cost_alpha_evidence
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_overseas_context.py
          git commit -m "fix: derive prior session close from intraday payload"
          git pull --rebase origin research/formal-conversion-low-cost-alpha-20260828
          git push origin HEAD:research/formal-conversion-low-cost-alpha-20260828
