name: US extended-hours pulse

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma-separated US symbols for immediate query-time refresh"
        required: false
        default: ""
  schedule:
    # US pre-market during US daylight time: Beijing roughly 16:00-21:30.
    - cron: "0 8-13 * * 1-5"
    - cron: "20,30 13 * * 1-5"
    # Standard-time/open-boundary coverage: Beijing roughly 22:00-22:30.
    - cron: "0,20,30 14 * * 1-5"
    # US regular session continuous monitoring after the pre-market boundary.
    # Beijing roughly 22:30-04:00 during US daylight time.
    - cron: "0,30 15-20 * * 1-5"
    # Final regular-session / post-market reference refresh
    - cron: "0 21-23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-us-extended-hours-pulse
  cancel-in-progress: false

jobs:
  us_extended:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      US_EXTENDED_SYMBOLS: ${{ inputs.symbols || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh US extended-hours context
        run: python scripts/build_us_extended_hours_context.py
      - name: Run system consistency live audit
        continue-on-error: true
        run: |
          python scripts/check_system_consistency.py
          git checkout -- data/state/system_consistency.json || true
      - name: Commit US extended-hours context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add data/state/us_extended_hours_context.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh US extended-hours context"
          git push origin HEAD:main
