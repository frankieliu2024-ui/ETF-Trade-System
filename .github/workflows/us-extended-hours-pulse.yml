name: US extended-hours pulse

on:
  # Only global/US-targeted request files need the US context workflow.
  # A-share broker/account refreshes remain owned by market-snapshot and
  # must not start an unrelated US runner.
  push:
    paths:
      - "requests/live_snapshot/**global*.json"
      - "requests/live_snapshot/**us*.json"
      - "requests/live_snapshot/**ndx*.json"
      - "requests/live_snapshot/**hstech*.json"
      - "requests/live_snapshot/**kospi*.json"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma-separated US symbols for immediate query-time refresh"
        required: false
        default: ""
  schedule:
    # US pre-market, regular session and post-market at ten-minute target.
    - cron: "*/10 8-23 * * 1-5"
    # Standard-time tail crosses UTC midnight on Tue-Sat.
    - cron: "*/10 0-1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: etf-us-extended-hours-pulse
  cancel-in-progress: false

jobs:
  us_extended:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      US_EXTENDED_SYMBOLS: ${{ inputs.symbols || '' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase pulse workspace before refresh
        run: |
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Preserve previous US pulse for sudden-move comparison
        run: |
          [ -f data/state/us_extended_hours_context.json ] && cp data/state/us_extended_hours_context.json /tmp/us_extended_hours_context_prev.json || true
      - name: Refresh US extended-hours context
        run: python scripts/build_us_extended_hours_context.py
      - name: Send US regular-session open/close summary when due
        id: us_summary_notify
        continue-on-error: true
        run: python scripts/run_guarded_notification.py us
      - name: Send US monitored-object value event when due
        id: us_shock_notify
        continue-on-error: true
        env:
          PREVIOUS_CONTEXT_PATH: /tmp/us_extended_hours_context_prev.json
        run: python scripts/run_guarded_notification.py shock --market us
      - name: Record dedicated US pulse heartbeat
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          ctx_path = Path('data/state/us_extended_hours_context.json')
          ctx = json.loads(ctx_path.read_text(encoding='utf-8')) if ctx_path.exists() else {}
          now = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          event_name = os.environ.get('GITHUB_EVENT_NAME','')
          event_schedule = os.environ.get('EVENT_SCHEDULE','')
          payload = {
              'status': 'PASS' if ctx.get('quality_status') in {'PASS','DEGRADED'} else 'FAILED',
              'pulse_success': ctx.get('quality_status') in {'PASS','DEGRADED'},
              'trigger': event_name,
              'scheduled_for': f'cron:{event_schedule}' if event_schedule else event_name,
              'finished_at': now,
              'run_id': os.environ.get('GITHUB_RUN_ID',''),
              'context_generated_at': ctx.get('generated_at',''),
              'context_generated_at_beijing': ctx.get('generated_at_beijing',''),
              'context_quality_status': ctx.get('quality_status','UNKNOWN'),
          }
          Path('data/state/us_pulse_runtime_health.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False))
          PY
      - name: Commit US extended-hours context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/us_extended_hours_context.json data/state/us_pulse_runtime_health.json data/state/notification_center.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh US extended-hours context"
          git stash push --include-untracked -m "preserve non-US generated state" || true
          git pull --rebase origin main
          git stash drop || true
          git push origin HEAD:main
      - name: Surface US notification delivery failure without blocking market data
        if: ${{ steps.us_summary_notify.outcome == 'failure' || steps.us_shock_notify.outcome == 'failure' }}
        run: |
          echo "US market notification failed; US market-data refresh remains valid."
          exit 1
