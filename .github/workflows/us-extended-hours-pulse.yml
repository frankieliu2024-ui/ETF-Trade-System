name: US extended-hours pulse

on:
  # Only global/US-targeted request files need the US context workflow.
  # A-share broker/account refreshes remain owned by market-snapshot and
  # must not start an unrelated US runner.
  push:
    paths:
      - "requests/live_snapshot/**global*.json"
      - "requests/live_snapshot/**us*.json"
      - "requests/live_snapshot/**ndx*.json"
      - "requests/live_snapshot/**hstech*.json"
      - "requests/live_snapshot/**kospi*.json"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma-separated US symbols for immediate query-time refresh"
        required: false
        default: ""
  schedule:
    # US pre-market, regular session and post-market at ten-minute target.
    - cron: "*/10 8-23 * * 1-5"
    # Standard-time tail crosses UTC midnight on Tue-Sat.
    - cron: "*/10 0-1 * * 2-6"
    # Staggered reliability backstop for GitHub schedule delay/missed wakes.
    # Same workflow, same producer/state/notification chain; 20-minute cadence
    # limits extra load while avoiding the primary cron minute boundary.
    - cron: "2,22,42 8-23 * * 1-5"
    - cron: "2,22,42 0-1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: etf-us-extended-hours-pulse
  cancel-in-progress: false

jobs:
  us_extended:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      US_EXTENDED_SYMBOLS: ${{ inputs.symbols || '' }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      SCHEDULED_CRON: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase pulse workspace before refresh
        run: |
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve scheduled pulse slot
        id: pulse_gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from scripts.scheduled_pulse_slot import resolve_scheduled_pulse
          from datetime import datetime, timezone
          pulse = resolve_scheduled_pulse(os.environ.get("SCHEDULED_CRON", ""), datetime.now(timezone.utc))
          eligible = pulse["eligible"] if os.environ.get("GITHUB_EVENT_NAME") == "schedule" else True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"eligible={'true' if eligible else 'false'}\n")
              handle.write(f"scheduled_slot_at={pulse.get('scheduled_slot_at') or ''}\n")
              handle.write(f"schedule_delay_seconds={pulse.get('schedule_delay_seconds') if pulse.get('schedule_delay_seconds') is not None else ''}\n")
              handle.write(f"schedule_delay_class={pulse.get('schedule_delay_class') or ''}\n")
              handle.write(f"natural_pulse_identity={pulse.get('natural_pulse_identity') or ''}\n")
              handle.write(f"natural_pulse_identity_status={pulse.get('natural_pulse_identity_status') or ''}\n")
              handle.write(f"natural_pulse_eligible={str(pulse.get('natural_pulse_eligible')).lower()}\n")
          print({**pulse, "workflow_eligible": eligible})
          PY
      - name: Preserve previous US pulse for sudden-move comparison
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: |
          [ -f data/state/us_extended_hours_context.json ] && cp data/state/us_extended_hours_context.json data/state/us_extended_hours_context_previous.json || true
      - name: Refresh US extended-hours context
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: python scripts/build_us_extended_hours_context.py
      - name: Record dedicated US pulse heartbeat
        if: always()
        env:
          PULSE_ELIGIBLE: ${{ steps.pulse_gate.outputs.eligible }}
          PULSE_SLOT_AT: ${{ steps.pulse_gate.outputs.scheduled_slot_at }}
          PULSE_DELAY_SECONDS: ${{ steps.pulse_gate.outputs.schedule_delay_seconds }}
          PULSE_DELAY_CLASS: ${{ steps.pulse_gate.outputs.schedule_delay_class }}
          PULSE_IDENTITY: ${{ steps.pulse_gate.outputs.natural_pulse_identity }}
          PULSE_IDENTITY_STATUS: ${{ steps.pulse_gate.outputs.natural_pulse_identity_status }}
          PULSE_NATURAL_ELIGIBLE: ${{ steps.pulse_gate.outputs.natural_pulse_eligible }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          ctx_path = Path('data/state/us_extended_hours_context.json')
          ctx = json.loads(ctx_path.read_text(encoding='utf-8')) if ctx_path.exists() else {}
          now = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          event_name = os.environ.get('GITHUB_EVENT_NAME','')
          event_schedule = os.environ.get('EVENT_SCHEDULE','')
          pulse_eligible = os.environ.get('PULSE_ELIGIBLE','true') == 'true'
          natural_pulse_eligible = os.environ.get('PULSE_NATURAL_ELIGIBLE','false') == 'true'
          schedule_blocked = event_name == 'schedule' and not pulse_eligible
          payload = {
              'status': 'SKIPPED' if schedule_blocked else ('PASS' if ctx.get('quality_status') in {'PASS','DEGRADED'} else 'FAILED'),
              'pulse_success': False if schedule_blocked else ctx.get('quality_status') in {'PASS','DEGRADED'},
              'trigger': event_name,
              'scheduled_for': f'cron:{event_schedule}' if event_schedule else event_name,
              'scheduled_cron': event_schedule,
              'scheduled_slot_at': os.environ.get('PULSE_SLOT_AT',''),
              'schedule_delay_seconds': os.environ.get('PULSE_DELAY_SECONDS',''),
              'schedule_delay_class': os.environ.get('PULSE_DELAY_CLASS','NOT_SCHEDULED'),
              'natural_pulse_identity': os.environ.get('PULSE_IDENTITY',''),
              'natural_pulse_eligible': natural_pulse_eligible,
              'natural_pulse_identity_status': os.environ.get('PULSE_IDENTITY_STATUS','UNKNOWN'),
              'schedule_blocked_as_stale': schedule_blocked,
              'finished_at': now,
              'run_id': os.environ.get('GITHUB_RUN_ID',''),
              'context_generated_at': ctx.get('generated_at',''),
              'context_generated_at_beijing': ctx.get('generated_at_beijing',''),
              'context_quality_status': ctx.get('quality_status','UNKNOWN'),
          }
          Path('data/state/us_pulse_runtime_health.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False))
          PY
      - name: Commit US extended-hours context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/us_extended_hours_context.json data/state/us_pulse_runtime_health.json
          [ -f data/state/us_extended_hours_context_previous.json ] && git add data/state/us_extended_hours_context_previous.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh US extended-hours context"
          git stash push --include-untracked -m "preserve non-US generated state" || true
          git pull --rebase origin main
          git stash drop || true
          git push origin HEAD:main
