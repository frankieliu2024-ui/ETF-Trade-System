name: AkShare capability PoC

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/akshare_capability_poc.py"
      - ".github/workflows/akshare-capability-poc.yml"

permissions:
  contents: write

concurrency:
  group: etf-akshare-capability-poc
  cancel-in-progress: true

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase before PoC
        run: |
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AkShare
        run: python -m pip install --upgrade pip akshare
      - name: Compile PoC
        run: python -m py_compile scripts/akshare_capability_poc.py
      - name: Run AkShare ETF minute-path PoC
        run: python scripts/akshare_capability_poc.py
      - name: Commit PoC result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/akshare_poc.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: record AkShare ETF minute-path PoC"
          git pull --rebase origin main
          git push origin HEAD:main
