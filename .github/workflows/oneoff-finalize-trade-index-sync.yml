name: One-off finalize trade index sync
on:
  push:
    paths:
      - ".github/workflows/oneoff-finalize-trade-index-sync.yml"
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply final synchronization repair
        run: python scripts/oneoff_finalize_trade_sync.py
      - name: Validate repaired files
        run: |
          python -m py_compile scripts/process_state_sync_request.py
          python scripts/check_trade_event_formal_sync.py
      - name: Commit production repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF交易复盘与经验库_2026.md scripts/process_state_sync_request.py
          git commit -m "fix: keep human trade index synchronized with fills"
          git push origin HEAD:main
