name: One-off market consistency repair

on:
  push:
    paths:
      - '.github/workflows/oneoff-market-consistency-repair.yml'

permissions:
  contents: write

concurrency:
  group: etf-market-consistency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse and validate explicit suspended market state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Tencent uses a special row shape for suspended securities: status S,
          # a fresh provider timestamp, last=previous close and no live OHLC/book.
          p = Path('scripts/tencent_quote.py')
          text = p.read_text(encoding='utf-8')
          old = '''        timestamp_ms = _timestamp_ms(fields[30])\n        price, prev_close = _number(fields[3]), _number(fields[4])\n        if price is None or prev_close is None or price < 0 or prev_close < 0:\n            raise RuntimeError(f"Tencent quote missing price fields for {thscode}")\n        result[str(thscode).upper()] = {\n            "name": fields[1].strip(),\n            "provider_symbol": provider_symbol,\n            "open_price": _number(fields[5]),\n            "high_price": _number(fields[33]),\n            "low_price": _number(fields[34]),\n            "last_price": price,\n            "prev_price": prev_close,\n'''
          new = '''        suspended = (\n            len(fields) > 42\n            and fields[42].strip().upper() == "S"\n            and len(fields) > 32\n            and bool(re.fullmatch(r"[0-9]{14}", fields[32] or ""))\n        )\n        timestamp_field = fields[32] if suspended else fields[30]\n        timestamp_ms = _timestamp_ms(timestamp_field)\n        price, prev_close = _number(fields[3]), _number(fields[4])\n        if price is None or prev_close is None or price < 0 or prev_close < 0:\n            raise RuntimeError(f"Tencent quote missing price fields for {thscode}")\n        result[str(thscode).upper()] = {\n            "name": fields[1].strip(),\n            "provider_symbol": provider_symbol,\n            "open_price": None if suspended else _number(fields[5]),\n            "high_price": None if suspended else _number(fields[33]),\n            "low_price": None if suspended else _number(fields[34]),\n            "last_price": price,\n            "prev_price": prev_close,\n'''
          if old not in text:
              raise SystemExit('Tencent parse pattern not found')
          text = text.replace(old, new, 1)
          old = '''            "volume": (_number(fields[6]) * 100) if _number(fields[6]) is not None else None,\n            "turnover": (_number(fields[37]) * 10000) if _number(fields[37]) is not None else None,\n            "provider_timestamp_ms": timestamp_ms,\n'''
          new = '''            "volume": 0.0 if suspended else ((_number(fields[6]) * 100) if _number(fields[6]) is not None else None),\n            "turnover": 0.0 if suspended else ((_number(fields[37]) * 10000) if _number(fields[37]) is not None else None),\n            "provider_timestamp_ms": timestamp_ms,\n            "provider_status_code": "S" if suspended else "",\n            "trading_status": "SUSPENDED" if suspended else "TRADING",\n            "tradable": not suspended,\n'''
          if old not in text:
              raise SystemExit('Tencent volume/status pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Preserve explicit non-trading state as a valid market fact instead of
          # forcing nonexistent OHLC into a false provider failure.
          p = Path('scripts/cloud_runner_snapshot.py')
          text = p.read_text(encoding='utf-8')
          old = '''    no_trade_partial = (\n        market_phase in {"CONTINUOUS_MORNING", "CONTINUOUS_AFTERNOON", "CLOSING_CALL_AUCTION"}\n        and bool(missing)\n        and set(missing).issubset({"open_price", "high_price", "low_price", "volume", "turnover"})\n        and item.get("last_price") is not None\n        and item.get("prev_price") is not None\n        and provider_ts not in (None, "")\n    )\n    if missing and not (auction_partial or no_trade_partial):\n'''
          new = '''    no_trade_partial = (\n        market_phase in {"CONTINUOUS_MORNING", "CONTINUOUS_AFTERNOON", "CLOSING_CALL_AUCTION"}\n        and bool(missing)\n        and set(missing).issubset({"open_price", "high_price", "low_price", "volume", "turnover"})\n        and item.get("last_price") is not None\n        and item.get("prev_price") is not None\n        and provider_ts not in (None, "")\n    )\n    explicit_halt = (\n        str(item.get("trading_status") or "").upper() in {"SUSPENDED", "HALTED"}\n        and item.get("last_price") is not None\n        and item.get("prev_price") is not None\n        and provider_ts not in (None, "")\n    )\n    if missing and not (auction_partial or no_trade_partial or explicit_halt):\n'''
          if old not in text:
              raise SystemExit('cloud row partial pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace('''    if not (auction_partial or no_trade_partial) and (\n''','''    if not (auction_partial or no_trade_partial or explicit_halt) and (\n''',1)
          old = '''    quality_status = "DEGRADED" if (auction_partial or no_trade_partial) else "PASS"\n    semantic_note = (\n        "OPENING_CALL_AUCTION阶段provider尚未形成完整日内OHLC；保留最新价、昨收、成交量、成交额和provider时点，禁止用旧OHLC补齐。"\n        if auction_partial\n        else ("交易中provider仅返回最新价和昨收，未产生可用新成交量/OHLC；保留事实并标记为延迟/无新成交，不用旧OHLC补齐。" if no_trade_partial else ("OPENING_CALL_AUCTION阶段仅按集合竞价时点快照解释，不与连续竞价最新成交语义混用。" if market_phase == "OPENING_CALL_AUCTION" else ""))\n    )\n'''
          new = '''    quality_status = "PASS" if explicit_halt else ("DEGRADED" if (auction_partial or no_trade_partial) else "PASS")\n    semantic_note = (\n        "provider明确证券当前停牌/暂停交易；最新价仅为最后有效参考价，保留真实provider时点，不伪造OHLC，不按可成交价格解释。"\n        if explicit_halt\n        else ("OPENING_CALL_AUCTION阶段provider尚未形成完整日内OHLC；保留最新价、昨收、成交量、成交额和provider时点，禁止用旧OHLC补齐。"\n        if auction_partial\n        else ("交易中provider仅返回最新价和昨收，未产生可用新成交量/OHLC；保留事实并标记为延迟/无新成交，不用旧OHLC补齐。" if no_trade_partial else ("OPENING_CALL_AUCTION阶段仅按集合竞价时点快照解释，不与连续竞价最新成交语义混用。" if market_phase == "OPENING_CALL_AUCTION" else "")))\n    )\n'''
          if old not in text:
              raise SystemExit('cloud quality pattern not found')
          text = text.replace(old, new, 1)
          old = '''        "quality_status": quality_status,\n        "semantic_note": semantic_note,\n    }\n'''
          new = '''        "quality_status": quality_status,\n        "semantic_note": semantic_note,\n        "trading_status": item.get("trading_status", "TRADING"),\n        "tradable": item.get("tradable", True),\n        "provider_status_code": item.get("provider_status_code", ""),\n    }\n'''
          if old not in text:
              raise SystemExit('cloud row return pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Shared quality guard explicitly accepts provider-confirmed suspension
          # while keeping normal continuous-trading OHLC requirements unchanged.
          p = Path('scripts/market_data_guard.py')
          text = p.read_text(encoding='utf-8')
          old = '''    auction_partial = (\n        allow_auction_partial\n        and phase == "OPENING_CALL_AUCTION"\n        and set(missing_fields).issubset({"open", "high", "low"})\n        and row.get("close") not in (None, "", "-")\n        and row.get("prev_close") not in (None, "", "-")\n    )\n    if missing_fields and not auction_partial:\n'''
          new = '''    auction_partial = (\n        allow_auction_partial\n        and phase == "OPENING_CALL_AUCTION"\n        and set(missing_fields).issubset({"open", "high", "low"})\n        and row.get("close") not in (None, "", "-")\n        and row.get("prev_close") not in (None, "", "-")\n    )\n    explicit_halt = (\n        str(row.get("trading_status") or "").upper() in {"SUSPENDED", "HALTED"}\n        and row.get("tradable") is False\n        and row.get("close") not in (None, "", "-")\n        and row.get("prev_close") not in (None, "", "-")\n    )\n    if missing_fields and not (auction_partial or explicit_halt):\n'''
          if old not in text:
              raise SystemExit('guard partial pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace('''    if not auction_partial:\n        values = [_as_float(row.get(key)) for key in ("open", "high", "low")]\n''','''    if not (auction_partial or explicit_halt):\n        values = [_as_float(row.get(key)) for key in ("open", "high", "low")]\n''',1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/tencent_quote.py scripts/cloud_runner_snapshot.py scripts/market_data_guard.py scripts/check_market_state_consistency.py
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check
      - name: Commit suspended-state repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tencent_quote.py scripts/cloud_runner_snapshot.py scripts/market_data_guard.py
          git commit -m 'fix: model explicit ETF suspension as market state'
          git pull --rebase origin main
          git push origin HEAD:main
