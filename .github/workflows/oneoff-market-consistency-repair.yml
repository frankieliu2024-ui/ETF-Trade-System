name: One-off market consistency repair

on:
  push:
    paths:
      - '.github/workflows/oneoff-market-consistency-repair.yml'

permissions:
  contents: write

concurrency:
  group: etf-market-consistency-repair
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe 159941 direct quote providers
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          out = {'captured_at_beijing': datetime.now(timezone(timedelta(hours=8))).isoformat(timespec='seconds'), 'object': '159941.SZ', 'probes': {}}

          def get_text(name, url, encoding='utf-8', headers=None):
              try:
                  req = urllib.request.Request(url, headers=headers or {'User-Agent':'ETF-Trade-System/2.2.16'})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      raw = r.read()
                      out['probes'][name] = {'http_status': r.status, 'text': raw.decode(encoding, 'replace')[:4000]}
              except Exception as e:
                  out['probes'][name] = {'error': repr(e)}

          get_text('tencent_sz159941', 'https://qt.gtimg.cn/q=sz159941', 'gbk', {'User-Agent':'ETF-Trade-System/2.2.16','Referer':'https://gu.qq.com/'})
          get_text('tencent_simple_sz159941', 'https://qt.gtimg.cn/q=s_sz159941', 'gbk', {'User-Agent':'ETF-Trade-System/2.2.16','Referer':'https://gu.qq.com/'})

          fields='f43,f44,f45,f46,f47,f48,f57,f58,f60,f86,f124'
          qs=urllib.parse.urlencode({'secid':'0.159941','fltt':'2','invt':'2','fields':fields})
          get_text('eastmoney_standard', 'https://push2.eastmoney.com/api/qt/stock/get?'+qs)
          get_text('eastmoney_delay', 'https://push2delay.eastmoney.com/api/qt/stock/get?'+qs)

          get_text('sina_sz159941', 'https://hq.sinajs.cn/list=sz159941', 'gbk', {'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})

          path=Path('data/market/audit/159941_provider_probe_20260827.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False))
          PY
      - name: Commit probe audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/market/audit/159941_provider_probe_20260827.json
          git commit -m 'test: record 159941 provider probe'
          git pull --rebase origin main
          git push origin HEAD:main
