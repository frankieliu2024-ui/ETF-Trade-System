name: One-off market consistency repair

on:
  push:
    paths:
      - '.github/workflows/oneoff-market-consistency-repair.yml'

permissions:
  contents: write

concurrency:
  group: etf-market-consistency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply minimal market consistency repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/cloud_runner_snapshot.py')
          text = p.read_text(encoding='utf-8')

          old = """        and set(missing).issubset({\"open_price\", \"high_price\", \"low_price\"})\n        and item.get(\"last_price\") is not None\n"""
          new = """        and set(missing).issubset({\"open_price\", \"high_price\", \"low_price\", \"volume\", \"turnover\"})\n        and item.get(\"last_price\") is not None\n"""
          if old not in text:
              raise SystemExit('auction partial-field pattern not found')
          text = text.replace(old, new, 1)

          old = """    node = resolve_scheduled_node(run_started_dt) if args.node == \"scheduled\" else args.node\n    planned_time = PLANNED_TIMES.get(node, \"\")\n"""
          new = """    node = resolve_scheduled_node(run_started_dt) if args.node == \"scheduled\" else args.node\n    # Query-time/manual callers use a generic live label. During 09:15-09:29,\n    # normalize that label to the formal opening-auction node so CURRENT.node,\n    # snapshot.node and market_phase cannot disagree semantically.\n    if market_phase == \"OPENING_CALL_AUCTION\" and node in {\"live\", \"manual\"}:\n        node = \"auction\"\n    planned_time = PLANNED_TIMES.get(node, \"\")\n"""
          if old not in text:
              raise SystemExit('node normalization pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          cat > scripts/check_market_state_consistency.py <<'PY'
          from __future__ import annotations

          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def load(path: str) -> dict:
              return json.loads((ROOT / path).read_text(encoding='utf-8'))

          def fail(msg: str) -> None:
              print(f'FAIL: {msg}')
              raise SystemExit(1)

          def warn(msg: str) -> None:
              print(f'WARNING: {msg}')

          current = load('data/state/CURRENT.json')
          runtime = load('data/state/runtime_health.json')
          snapshot_rel = str(current.get('latest_snapshot') or '')
          if not snapshot_rel:
              fail('CURRENT.latest_snapshot missing')
          snapshot_path = ROOT / snapshot_rel
          if not snapshot_path.exists():
              fail(f'CURRENT.latest_snapshot not found: {snapshot_rel}')
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))

          # Canonical identity/time contract.
          for field in ('market_date', 'captured_at'):
              if str(current.get(field) or '') != str(snapshot.get(field) or ''):
                  fail(f'CURRENT.{field} != snapshot.{field}: {current.get(field)!r} vs {snapshot.get(field)!r}')
          if str((current.get('data_freshness') or {}).get('market_phase') or '') != str(snapshot.get('market_phase') or ''):
              fail('CURRENT market_phase != snapshot market_phase')
          if str(runtime.get('latest_snapshot') or '') != snapshot_rel:
              fail('runtime_health.latest_snapshot != CURRENT.latest_snapshot')
          if str(runtime.get('market_date') or '') != str(current.get('market_date') or ''):
              fail('runtime_health.market_date != CURRENT.market_date')
          if str(runtime.get('market_phase') or '') != str(snapshot.get('market_phase') or ''):
              fail('runtime_health.market_phase != snapshot.market_phase')

          # Node/phase semantics.
          phase = str(snapshot.get('market_phase') or '')
          node = str(snapshot.get('node') or '')
          current_node = str(current.get('latest_valid_node') or '')
          if node != current_node:
              fail(f'CURRENT.latest_valid_node != snapshot.node: {current_node} vs {node}')
          if phase == 'OPENING_CALL_AUCTION' and node not in {'auction', '0925'}:
              fail(f'opening-auction snapshot has non-auction node={node}')
          if phase.startswith('CONTINUOUS_') and node in {'auction', '0925', 'close'}:
              fail(f'continuous snapshot has incompatible node={node}')

          # Object coverage and provider-time contract.
          rows = snapshot.get('rows') or []
          expected_count = int(snapshot.get('count') or 0)
          if len(rows) != expected_count:
              fail(f'snapshot row count mismatch: rows={len(rows)} count={expected_count}')
          symbols = [str(r.get('symbol') or '') for r in rows]
          if len(symbols) != len(set(symbols)):
              fail('duplicate symbols in latest snapshot')
          required_indices = {'000001', '000688', '399006'}
          if not required_indices.issubset(set(symbols)):
              fail(f'missing formal A-share indices: {sorted(required_indices-set(symbols))}')

          snap_time = datetime.fromisoformat(str(snapshot.get('captured_at')))
          failed = []
          for row in rows:
              status = str(row.get('quality_status') or '')
              if status in {'FAILED', 'FAIL'}:
                  failed.append(str(row.get('symbol') or ''))
                  continue
              asof = str(row.get('as_of_beijing') or '')
              if not asof:
                  fail(f"usable row missing provider time: {row.get('symbol')}")
              dt = datetime.fromisoformat(asof)
              # Provider time can lead capture by a few seconds due clock skew, not minutes.
              if (dt - snap_time).total_seconds() > 90:
                  fail(f"provider time implausibly later than snapshot: {row.get('symbol')} {asof}")
              if str(row.get('market_phase') or '') != phase:
                  fail(f"row market_phase mismatch: {row.get('symbol')} {row.get('market_phase')} vs {phase}")

          coverage = ((snapshot.get('runtime') or {}).get('analysis_coverage') or {})
          if int(coverage.get('failed_count') or 0) != len(failed):
              fail(f'analysis_coverage.failed_count mismatch: {coverage.get("failed_count")} vs {len(failed)}')
          if sorted(coverage.get('failed_objects') or []) != sorted(failed):
              fail(f'analysis_coverage.failed_objects mismatch: {coverage.get("failed_objects")} vs {failed}')

          if failed:
              warn(f'latest snapshot has failed objects: {failed}')
          print(json.dumps({
              'status': 'PASS' if not failed else 'WARNING',
              'market_date': current.get('market_date'),
              'node': node,
              'market_phase': phase,
              'snapshot': snapshot_rel,
              'rows': len(rows),
              'failed_objects': failed,
          }, ensure_ascii=False))
          PY

          python -m py_compile scripts/cloud_runner_snapshot.py scripts/check_market_state_consistency.py
          python scripts/check_market_state_consistency.py || true

      - name: Wire market-state consistency into formal audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/system-consistency.yml')
          text = p.read_text(encoding='utf-8')
          old = """          python scripts/check_system_consistency.py\n          rc1=$?\n          python scripts/check_research_integration.py\n          rc2=$?\n          if [ \"$rc1\" -ne 0 ] || [ \"$rc2\" -ne 0 ]; then\n            exit 1\n          fi\n"""
          new = """          python scripts/check_system_consistency.py\n          rc1=$?\n          python scripts/check_research_integration.py\n          rc2=$?\n          python scripts/check_market_state_consistency.py\n          rc3=$?\n          if [ \"$rc1\" -ne 0 ] || [ \"$rc2\" -ne 0 ] || [ \"$rc3\" -ne 0 ]; then\n            exit 1\n          fi\n"""
          if old not in text:
              raise SystemExit('system consistency wiring pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repair to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/cloud_runner_snapshot.py scripts/check_market_state_consistency.py .github/workflows/system-consistency.yml
          git diff --cached --check
          git commit -m 'fix: enforce A-share market state consistency'
          git pull --rebase origin main
          git push origin HEAD:main
