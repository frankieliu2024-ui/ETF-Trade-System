name: One-off market consistency repair

on:
  push:
    paths:
      - '.github/workflows/oneoff-market-consistency-repair.yml'

permissions:
  contents: write

concurrency:
  group: etf-market-consistency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire verified Hithink market endpoint before Eastmoney
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/cloud_runner_snapshot.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def fetch_etf_with_fallback(')
          end = text.index('\ndef fetch_etf(', start)
          replacement = '''def fetch_etf_with_fallback(cli: str, run_dir: Path, code: str, thscode: str) -> dict:\n    tencent_error = None\n    try:\n        return fetch_tencent_a_share("ETF", code, thscode, a_share_market_phase(now_shanghai()))\n    except Exception as error:\n        tencent_error = error\n\n    hithink_fund_error = RuntimeError("hithink-finance fund endpoint not attempted")\n    if not PRIMARY_RUN_BYPASS.is_set():\n        try:\n            return fetch_etf(cli, run_dir, code, thscode)\n        except Exception as error:\n            hithink_fund_error = error\n    else:\n        hithink_fund_error = RuntimeError("hithink-finance fund endpoint bypassed after a transient failure earlier in this run")\n\n    # The market snapshot endpoint is an independently validated direct endpoint\n    # within the same Hithink provider family. A fund-endpoint coverage failure\n    # must not prevent this object-level direct fallback from being attempted.\n    hithink_market_error = RuntimeError("hithink-finance market endpoint not attempted")\n    try:\n        return fetch_etf_market_snapshot(\n            cli, run_dir, code, thscode, a_share_market_phase(now_shanghai())\n        )\n    except Exception as error:\n        hithink_market_error = error\n\n    if code in EASTMONEY_FALLBACK_ETFS:\n        try:\n            return fetch_eastmoney_etf(code, thscode, a_share_market_phase(now_shanghai()))\n        except Exception as fallback_error:\n            raise RuntimeError(\n                f"Tencent primary failed: {tencent_error}; "\n                f"Hithink fund fallback failed: {hithink_fund_error}; "\n                f"Hithink market fallback failed: {hithink_market_error}; "\n                f"Eastmoney fallback failed: {fallback_error}"\n            ) from fallback_error\n\n    raise RuntimeError(\n        f"Tencent primary failed: {tencent_error}; "\n        f"Hithink fund fallback failed: {hithink_fund_error}; "\n        f"Hithink market fallback failed: {hithink_market_error}"\n    )\n'''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python -m py_compile scripts/cloud_runner_snapshot.py scripts/check_market_state_consistency.py
          git diff --check
      - name: Commit code repair to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/cloud_runner_snapshot.py
          git commit -m 'fix: complete ETF direct fallback chain'
          git pull --rebase origin main
          git push origin HEAD:main
