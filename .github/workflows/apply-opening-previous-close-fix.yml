name: Apply opening previous-close fix

on:
  push:
    branches:
      - research/formal-conversion-low-cost-alpha-20260828
    paths:
      - "scripts/apply_opening_previous_close_fix.py"
      - ".github/workflows/apply-opening-previous-close-fix.yml"

permissions:
  contents: write

concurrency:
  group: etf-opening-previous-close-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply fix
        run: python scripts/apply_opening_previous_close_fix.py
      - name: Run focused tests
        run: |
          python -m py_compile scripts/build_overseas_context.py scripts/build_low_cost_alpha_evidence.py
          python -m unittest tests.test_low_cost_alpha_evidence
      - name: Commit semantic fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_overseas_context.py tests/test_low_cost_alpha_evidence.py
          git commit -m "fix: use Yahoo prior session close for opening residual"
          git pull --rebase origin research/formal-conversion-low-cost-alpha-20260828
          git push origin HEAD:research/formal-conversion-low-cost-alpha-20260828
