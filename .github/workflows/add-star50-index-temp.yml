name: Add STAR50 index temp

on:
  push:
    paths:
      - ".github/workflows/add-star50-index-temp.yml"

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Tencent STAR50 direct mapping
        run: |
          python - <<'PY'
          from scripts.tencent_quote import fetch_tencent_quotes
          q=fetch_tencent_quotes(['000688.SH'])['000688.SH']
          assert q['provider_symbol']=='sh000688'
          assert q['name'] and q['last_price'] is not None and q['provider_timestamp_ms']
          print({'name':q['name'],'provider_symbol':q['provider_symbol'],'last_price':q['last_price'],'provider_timestamp_ms':q['provider_timestamp_ms']})
          PY
      - name: Patch formal STAR50 monitoring consistently
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1), encoding='utf-8')

          replace_once('ETF_SYSTEM_INDEX.md',
              '正式固定复核上证指数、创业板指、NDX、SOX、N225、KOSPI、TWII、HSTECH；',
              '正式固定复核上证指数、创业板指、科创50指数、NDX、SOX、N225、KOSPI、TWII、HSTECH；')

          p=Path('config/market/market_monitor_config.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          for keys in [('formal_index_layer','required_objects'),('monitoring_layers','index_monitor','required_objects')]:
              obj=cfg
              for key in keys[:-1]: obj=obj[key]
              arr=obj[keys[-1]]
              if '000688.SH' not in arr: arr.insert(arr.index('399006.SZ')+1,'000688.SH')
          objs=cfg['classes']['A']['objects']
          if not any(x.get('id')=='000688.SH' for x in objs):
              pos=next(i for i,x in enumerate(objs) if x.get('id')=='399006.SZ')+1
              objs.insert(pos,{"id":"000688.SH","name":"科创50指数","preferred_source":"tencent_qq","fallback_source":"hithink_finance","status":"ACTIVE_WITH_FALLBACK"})
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('config/market/provider_priority.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          arr=cfg['formal_index_objects']
          if '000688.SH' not in arr: arr.insert(arr.index('399006.SZ')+1,'000688.SH')
          cfg['objects']['000688.SH']=['tencent_qq','hithink_finance']
          cfg['object_fallback_policy']['000688.SH']={"primary":"tencent_qq","fallback":["hithink_finance"],"direct_only":True}
          cfg.setdefault('notes',{})['a_share_index_000688']='科创50指数（000688）正式纳入指数层；腾讯sh000688已完成直接映射验证，为生产主源；同花顺000688.SH作为A股指数直接备源。东方财富映射未完成对象级验证前不加入fallback。'
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          replace_once('ETF与市场监测数据接口使用规范.md',
              '正式固定监测：上证指数（000001.SH）、创业板指（399006.SZ）、纳斯达克100指数（NDX）',
              '正式固定监测：上证指数（000001.SH）、创业板指（399006.SZ）、科创50指数（000688.SH）、纳斯达克100指数（NDX）')
          replace_once('ETF与市场监测数据接口使用规范.md',
              '已验证覆盖上证指数（000001）、创业板指（399006）、全部当前ETF监测对象',
              '已验证覆盖上证指数（000001）、创业板指（399006）、科创50指数（000688）、全部当前ETF监测对象')
          replace_once('ETF与市场监测数据接口使用规范.md',
              '当前A股对象级生产链以 `config/market/provider_priority.json` 为唯一机器权威：上证指数（000001）为 `腾讯 → 同花顺`；创业板指（399006）、当前11只ETF',
              '当前A股对象级生产链以 `config/market/provider_priority.json` 为唯一机器权威：上证指数（000001）为 `腾讯 → 同花顺`；科创50指数（000688）为 `腾讯 → 同花顺`；创业板指（399006）、当前11只ETF')

          replace_once('scripts/cloud_runner_snapshot.py',
              'INDEX = [("000001", "000001.SH"), ("399006", "399006.SZ")]',
              'INDEX = [("000001", "000001.SH"), ("399006", "399006.SZ"), ("000688", "000688.SH")]')
          replace_once('scripts/check_system_consistency.py',
              'EXPECTED_INDICES = {"000001.SH", "399006.SZ", "NDX", "SOX", "N225", "KOSPI", "TWII", "HSTECH"}',
              'EXPECTED_INDICES = {"000001.SH", "399006.SZ", "000688.SH", "NDX", "SOX", "N225", "KOSPI", "TWII", "HSTECH"}')
          replace_once('scripts/check_system_consistency.py',
              'snapshot.get("count") == len(rows) == len(objects) + 2',
              'snapshot.get("count") == len(rows) == len(objects) + 3')
          replace_once('scripts/check_system_consistency.py',
              'f"snapshot_count={snapshot.get(\'count\')} rows={len(rows)} expected={len(objects)+2}"',
              'f"snapshot_count={snapshot.get(\'count\')} rows={len(rows)} expected={len(objects)+3}"')
          replace_once('scripts/check_system_consistency.py',
              '{str(row.get(\'thscode\', \'\')) for row in index_rows} == {"000001.SH", "399006.SZ"}',
              '{str(row.get(\'thscode\', \'\')) for row in index_rows} == {"000001.SH", "399006.SZ", "000688.SH"}')

          replace_once('scripts/build_research_features.py',
              'index_rows = {c: rows.get(c) for c in ("000001", "399006")}',
              'index_rows = {c: rows.get(c) for c in ("000001", "399006", "000688")}')
          replace_once('scripts/build_research_features.py',
              '            "vs_chinext_pct_points": (x.get("relative_to_indices_pct_points") or {}).get("399006"),\n',
              '            "vs_chinext_pct_points": (x.get("relative_to_indices_pct_points") or {}).get("399006"),\n            "vs_star50_pct_points": (x.get("relative_to_indices_pct_points") or {}).get("000688"),\n')
          replace_once('scripts/state_manager.py',
              '"vs_shanghai_pct_points": row.get("vs_shanghai_pct_points"), "vs_chinext_pct_points": row.get("vs_chinext_pct_points"),',
              '"vs_shanghai_pct_points": row.get("vs_shanghai_pct_points"), "vs_chinext_pct_points": row.get("vs_chinext_pct_points"), "vs_star50_pct_points": row.get("vs_star50_pct_points"),')
          PY
          python -m py_compile scripts/cloud_runner_snapshot.py scripts/check_system_consistency.py scripts/build_research_features.py scripts/state_manager.py
      - name: Audit STAR50 placement and no unintended index changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=['000001.SH','399006.SZ','000688.SH','NDX','SOX','N225','KOSPI','TWII','HSTECH']
          m=json.loads(Path('config/market/market_monitor_config.json').read_text(encoding='utf-8'))
          p=json.loads(Path('config/market/provider_priority.json').read_text(encoding='utf-8'))
          assert m['formal_index_layer']['required_objects']==expected
          assert m['monitoring_layers']['index_monitor']['required_objects']==expected
          assert p['formal_index_objects']==expected
          assert p['object_fallback_policy']['000688.SH']=={'primary':'tencent_qq','fallback':['hithink_finance'],'direct_only':True}
          assert '000688' in Path('scripts/cloud_runner_snapshot.py').read_text(encoding='utf-8')
          assert 'vs_star50_pct_points' in Path('scripts/build_research_features.py').read_text(encoding='utf-8')
          assert '上证指数（000001）为 `腾讯 → 同花顺`' in Path('ETF与市场监测数据接口使用规范.md').read_text(encoding='utf-8')
          print('STAR50 formal index maintenance audit PASS')
          PY
      - name: Persist maintenance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF_SYSTEM_INDEX.md ETF与市场监测数据接口使用规范.md config/market/market_monitor_config.json config/market/provider_priority.json scripts/cloud_runner_snapshot.py scripts/check_system_consistency.py scripts/build_research_features.py scripts/state_manager.py
          git commit -m "market: add STAR50 to formal index monitoring"
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
