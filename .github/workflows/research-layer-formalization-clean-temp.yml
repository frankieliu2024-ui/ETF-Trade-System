name: research-layer-formalization-clean-temp
on:
  push:
    branches:
      - maintenance/research-layer-formalization-clean-20260827
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'system: formalize research evidence registry')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/research-layer-formalization-clean-20260827
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/_temp_apply_research_layer_formalization.py
      - name: Validate syntax and bridge
        run: |
          python -m py_compile scripts/build_research_execution_bridge.py scripts/build_state_context.py scripts/check_system_consistency_core.py
          python scripts/build_research_execution_bridge.py
      - name: Commit clean formal changes
        run: |
          rm -f scripts/_temp_apply_research_layer_formalization.py .github/workflows/research-layer-formalization-clean-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF规则_MASTER.md ETF_SYSTEM_INDEX.md scripts/build_research_execution_bridge.py scripts/build_state_context.py scripts/check_system_consistency_core.py
          git add -u scripts/_temp_apply_research_layer_formalization.py .github/workflows/research-layer-formalization-clean-temp.yml
          git commit -m "system: formalize research evidence registry"
      - name: Verify generated commit
        run: |
          CHECK_SHA=$(git rev-parse HEAD)
          GITHUB_SHA="$CHECK_SHA" python scripts/check_system_consistency.py
      - name: Push formal changes only
        run: |
          git checkout -- data/state/system_consistency.json data/state/research_execution_summary.json data/state/research_context.json data/state/decision_context.json || true
          git push origin HEAD:maintenance/research-layer-formalization-clean-20260827
