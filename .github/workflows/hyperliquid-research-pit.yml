name: Hyperliquid research PIT shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: hyperliquid-research-pit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect read-only Hyperliquid PIT observation
        run: python3 scripts/hyperliquid_pit_shadow_collector.py
      - name: Persist research observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/hyperliquid_pit
          if git diff --cached --quiet; then
            echo "No new observation"
          else
            git commit -m "research: persist Hyperliquid PIT observation"
            git push
          fi
