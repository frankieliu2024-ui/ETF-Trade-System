name: Hyperliquid research PIT shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: hyperliquid-research-pit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect read-only Hyperliquid PIT observation
        run: python3 scripts/hyperliquid_pit_shadow_collector.py --output-root hyperliquid-pit-output
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-pit-${{ github.run_id }}
          path: hyperliquid-pit-output
          retention-days: 30
          if-no-files-found: error
