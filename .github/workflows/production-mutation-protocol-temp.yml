name: production-mutation-protocol-temp
on:
  push:
    branches:
      - maintenance/production-mutation-protocol-20260827
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile protocol integration
        run: python -m py_compile scripts/check_production_mutation_protocol.py scripts/check_system_consistency.py
      - name: Audit all production writers
        run: python scripts/check_production_mutation_protocol.py
