name: ETF formal decision completion recovery

on:
  push:
    paths:
      - "requests/live_snapshot/*__business_decision_source.json"
  workflow_dispatch:
    inputs:
      bds_path:
        description: "Exact current Formal Decision business decision source path"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: etf-formal-completion-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve one current BDS
        id: resolve
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MANUAL_BDS_PATH: ${{ inputs.bds_path }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_BDS_PATH:-}" ]; then
            bds_path="$MANUAL_BDS_PATH"
          else
            git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null || git fetch --no-tags origin "${PUSH_BEFORE}"
            git cat-file -e "${PUSH_AFTER}^{commit}" 2>/dev/null || git fetch --no-tags origin "${PUSH_AFTER}"
            mapfile -t paths < <(git diff --name-only "${PUSH_BEFORE}" "${PUSH_AFTER}" | grep -E '^requests/live_snapshot/[^/]+__business_decision_source\\.json$' || true)
            if [ "${#paths[@]}" -ne 1 ]; then
              echo "Expected exactly one current BDS push, found ${#paths[@]}" >&2
              exit 1
            fi
            bds_path="${paths[0]}"
          fi
          test -f "$bds_path"
          source_request=$(python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); parent=str(p.get("parent_request_id") or "").strip(); print("requests/live_snapshot/"+parent+".json")' "$bds_path")
          test -f "$source_request"
          echo "bds_path=$bds_path" >> "$GITHUB_OUTPUT"
          echo "source_request=$source_request" >> "$GITHUB_OUTPUT"

      - name: Build and verify same-parent completion
        env:
          BDS_PATH: ${{ steps.resolve.outputs.bds_path }}
          SOURCE_REQUEST: ${{ steps.resolve.outputs.source_request }}
        run: |
          set -euo pipefail
          python scripts/recover_formal_decision_completion.py --bds-path "$BDS_PATH" --source-request "$SOURCE_REQUEST"
          completion_path=$(python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); parent=str(p.get("parent_request_id") or "").strip(); print("requests/live_snapshot/"+parent+"__scheduled_review_completion.json")' "$BDS_PATH")
          test -f "$completion_path"
          python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert p.get("request_type")=="SCHEDULED_REVIEW_COMPLETION"; assert p.get("parent_request_id"); assert p.get("request_id")==p["parent_request_id"]+"__scheduled_review_completion"; assert p.get("bds_path")' "$completion_path"
          echo "completion_path=$completion_path" >> "$GITHUB_ENV"

      - name: Persist completion on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ETF formal completion bot"
          git config user.email "etf-formal-completion-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            test -f "$completion_path"
            git add -- "$completion_path"
            if git diff --cached --quiet; then
              echo "Same-parent completion already exists on current main."
              exit 0
            fi
            git commit -m "handoff: persist Formal Decision completion"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not persist completion on latest main" >&2
              exit 1
            fi
          done
