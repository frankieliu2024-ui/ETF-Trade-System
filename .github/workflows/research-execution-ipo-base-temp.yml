name: Research execution IPO base temp
on:
  push:
    branches:
      - fix/research-execution-ipo-base-20260827
    paths:
      - .github/workflows/research-execution-ipo-base-temp.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-execution-ipo-base-20260827
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch temporary script index anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_research_execution_upgrade_temp.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace("anchor = '- `data/state/research_context.json`'", "anchor = '- 查询上下文：`data/state/query_context.json`、`data/state/decision_context.json`；其中 `decision_context.json` 是ChatGPT盘中快速读取的聚合决策上下文，并内嵌最新日内路径特征，不另建平行decision bundle'")
          p.write_text(t, encoding='utf-8')
          PY
      - name: Apply architecture patch
        run: python scripts/apply_research_execution_upgrade_temp.py
      - name: Validate Python syntax
        run: python -m py_compile scripts/build_research_execution_bridge.py scripts/build_state_context.py scripts/check_research_integration.py
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF规则_MASTER.md ETF_SYSTEM_INDEX.md scripts/build_research_execution_bridge.py scripts/build_state_context.py scripts/check_research_integration.py
          git commit -m "research: bridge evidence into capital execution"
          git push origin HEAD:fix/research-execution-ipo-base-20260827
