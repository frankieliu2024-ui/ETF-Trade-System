name: Research execution IPO base temp
on:
  push:
    branches:
      - fix/research-execution-ipo-base-20260827
    paths:
      - .github/workflows/research-execution-ipo-base-temp.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-execution-ipo-base-20260827
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bridge syntax
        run: python -m py_compile scripts/build_research_execution_bridge.py scripts/build_state_context.py scripts/check_research_integration.py
      - name: Build research execution bridge from current formal state
        run: python scripts/build_research_execution_bridge.py
      - name: Assert IPO-base coverage and no auto trade
        shell: bash
        run: |
          python - <<'PY'
          import json
          s=json.load(open('data/state/research_execution_summary.json',encoding='utf-8'))
          d=json.load(open('data/state/decision_context.json',encoding='utf-8'))
          assert s['read_only'] is True
          assert s['automatic_trade'] is False
          assert s['trade_signal'] is None
          assert len(s['ipo_base_stock_evidence']) == 2
          assert {x['code'] for x in s['ipo_base_stock_evidence']} == {'300750','601138'}
          assert d['research_execution_summary_file'] == 'data/state/research_execution_summary.json'
          assert len(d['ipo_base_stock_evidence']) == 2
          assert d['unified_capital_reallocation_contract']['direct_execution_contribution'] is True
          print(json.dumps({'portfolio_exposure':s['portfolio_exposure'],'ipo_base_stock_evidence':s['ipo_base_stock_evidence'],'execution_bridge':s['execution_bridge']},ensure_ascii=False))
          PY
      - name: Run research integration consistency extension
        run: python scripts/check_research_integration.py
