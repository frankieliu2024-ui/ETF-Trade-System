name: Apply low-cost alpha formal conversion patch

on:
  workflow_dispatch:
  push:
    branches:
      - research/formal-conversion-low-cost-alpha-20260828
    paths:
      - "scripts/apply_low_cost_alpha_conversion_patch.py"
      - ".github/workflows/apply-low-cost-alpha-conversion-patch.yml"

permissions:
  contents: write

concurrency:
  group: etf-low-cost-alpha-conversion-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply anchored patch
        run: python scripts/apply_low_cost_alpha_conversion_patch.py
      - name: Compile changed runtime modules
        run: python -m py_compile scripts/build_overseas_context.py scripts/build_state_context.py scripts/build_low_cost_alpha_evidence.py scripts/check_system_consistency_core.py
      - name: Commit intended branch-only integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF规则_MASTER.md ETF_SYSTEM_INDEX.md scripts/build_overseas_context.py scripts/build_state_context.py scripts/check_system_consistency_core.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "research: formally integrate scoped low-cost alpha evidence"
          git pull --rebase origin research/formal-conversion-low-cost-alpha-20260828
          git push origin HEAD:research/formal-conversion-low-cost-alpha-20260828
