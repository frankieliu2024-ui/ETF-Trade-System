name: AlphaGen research PoC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requests/research_backfill/alphagen_run_trigger.txt"

permissions:
  contents: write

concurrency:
  group: alphagen-research-poc
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      ALPHAGEN_COMMIT: 259687e8f316994426416c530a94842a2fe6405e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 pandas==2.2.2 scipy==1.13.1 gymnasium==0.28.1 stable-baselines3==2.0.0 sb3-contrib==2.0.0 shimmy==1.1.0 num2words
      - name: Fetch pinned AlphaGen without vendoring
        run: |
          git clone --filter=blob:none https://github.com/ICT-FinD-Lab/alphagen.git /tmp/alphagen
          git -C /tmp/alphagen checkout "$ALPHAGEN_COMMIT"
          test "$(git -C /tmp/alphagen rev-parse HEAD)" = "$ALPHAGEN_COMMIT"
          test ! -e /tmp/alphagen/LICENSE
      - name: Run AlphaGen stage1 PIT validation
        run: python scripts/run_alphagen_stage1_poc.py requests/research_backfill/20260825_alphagen_stage1.json --alphagen-root /tmp/alphagen
      - name: Enforce research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/backtests/alphagen_stage1_validation.json').read_text(encoding='utf-8'))
          s=json.loads(Path('data/state/alphagen_research_status.json').read_text(encoding='utf-8'))
          assert p['decision_eligible'] is False
          assert p['trade_signal'] is None
          assert p['trial_confirm'] is None
          assert p['portfolio_target'] is None
          assert p['master_override'] is False
          assert p['historical_decision_prohibited'] is True
          assert s['decision_eligible'] is False
          print(json.dumps({'interpretation':p['research_interpretation'],'runs':len(p['fold_results']),'failures':p['failure_count']},ensure_ascii=False))
          PY
      - name: Commit compact research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtests/alphagen_stage1_validation.json data/state/alphagen_research_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record AlphaGen stage1 validation"
          git pull --rebase origin main
          git push origin HEAD:main
