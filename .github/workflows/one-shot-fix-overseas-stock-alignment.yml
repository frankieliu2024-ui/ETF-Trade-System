name: One-shot patch overseas fallback and stock alignment

on:
  push:
    branches:
      - fix/overseas-redundancy-stock-time-alignment
    paths:
      - .github/workflows/one-shot-fix-overseas-stock-alignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overseas-redundancy-stock-time-alignment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('scripts/check_system_consistency.py')
          text = path.read_text(encoding='utf-8')
          old = '''    core_time_text = str(current.get("captured_at") or "")
              stock_time_texts = [str(item.get("as_of_beijing") or "") for item in (stock_market.get("objects") or {}).values() if item.get("as_of_beijing")]
              stock_time_aligned = True
              stock_time_detail = "not_comparable"
              if live_runtime and core_time_text and stock_time_texts:
                  try:
                      core_dt = datetime.fromisoformat(core_time_text.replace("Z", "+00:00"))
                      stock_delays = []
                      for stock_time in stock_time_texts:
                          stock_dt = datetime.fromisoformat(stock_time.replace("Z", "+00:00"))
                          stock_delays.append(round((core_dt - stock_dt).total_seconds()))
                      max_delay = max(stock_delays)
                      stock_time_aligned = max_delay <= 900
                      stock_time_detail = f"max_core_minus_stock_seconds={max_delay}"
                  except ValueError:
                      stock_time_aligned = False
                      stock_time_detail = "invalid_timestamp"
              check("stock_runtime:market_time_alignment", stock_time_aligned, stock_time_detail, warning=True)
          '''.replace('              ', '    ')
          new = '''    core_time_text = str(current.get("captured_at") or "")
              stock_items = [item for item in (stock_market.get("objects") or {}).values() if isinstance(item, dict)]
              stock_time_texts = [str(item.get("as_of_beijing") or "") for item in stock_items if item.get("as_of_beijing")]
              stock_time_aligned = True
              stock_time_detail = "not_comparable"
              if live_runtime and core_time_text and stock_time_texts:
                  try:
                      core_dt = datetime.fromisoformat(core_time_text.replace("Z", "+00:00"))
                      stock_dts = [datetime.fromisoformat(stock_time.replace("Z", "+00:00")) for stock_time in stock_time_texts]
                      stock_delays = [round((core_dt - stock_dt).total_seconds()) for stock_dt in stock_dts]
                      max_delay = max(stock_delays)
                      current_market_date = str(current.get("market_date") or "")
                      same_market_date = bool(current_market_date) and all(stock_dt.astimezone(SHANGHAI).date().isoformat() == current_market_date for stock_dt in stock_dts)
                      all_outside_session = bool(stock_items) and all(str(item.get("market_phase") or "").upper() == "OUTSIDE_SESSION" for item in stock_items)
                      all_stock_quality_pass = bool(stock_items) and all(str(item.get("quality_status") or "").upper() == "PASS" for item in stock_items)
                      close_reference = str(current.get("latest_valid_node") or "").lower() == "close" and same_market_date and all_outside_session and all_stock_quality_pass
                      stock_time_aligned = max_delay <= 900 or close_reference
                      if close_reference and max_delay > 900:
                          stock_time_detail = f"session_aligned_close_reference max_core_minus_stock_seconds={max_delay}"
                      else:
                          stock_time_detail = f"max_core_minus_stock_seconds={max_delay}"
                  except ValueError:
                      stock_time_aligned = False
                      stock_time_detail = "invalid_timestamp"
              check("stock_runtime:market_time_alignment", stock_time_aligned, stock_time_detail, warning=True)
          '''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('target stock alignment block not found; aborting without mutation')
          text = text.replace(old, new, 1)

          marker = '    check("providers:hstech_primary_fallback_policy", hstech_rule.get("primary") == "eastmoney_push2:124.HSTECH" and hstech_rule.get("fallback") == expected_hstech_fallback, f"primary={hstech_rule.get(\'primary\')} fallback={hstech_rule.get(\'fallback\')}")\n'
          addition = '''    overseas_direct_fallbacks = {
              "NDX": "eastmoney_push2:100.NDX",
              "N225": "eastmoney_push2:100.N225",
              "KOSPI": "eastmoney_push2:100.KS11",
              "TWII": "eastmoney_push2:100.TWII",
          }
              for object_id, direct_fallback in overseas_direct_fallbacks.items():
                  rule = fallback_policy.get(object_id) or {}
                  check(
                      f"providers:{object_id}:verified_direct_fallback",
                      rule.get("primary") == "yahoo_chart_api" and direct_fallback in (rule.get("fallback") or []),
                      f"primary={rule.get('primary')} fallback={rule.get('fallback')}",
                      warning=True,
                  )
          '''.replace('              ', '    ')
          if marker not in text:
              raise SystemExit('provider policy marker not found; aborting without mutation')
          text = text.replace(marker, marker + addition, 1)

          marker2 = '    check("overseas:hstech_no_invalid_yahoo_symbol", "^HSTECH" not in overseas_builder, "invalid Yahoo production symbol absent")\n'
          addition2 = '    check("overseas:verified_eastmoney_direct_fallbacks", all(token in overseas_builder for token in ["100.NDX", "100.N225", "100.KS11", "100.TWII", "fetch_eastmoney_index"]), "verified Eastmoney direct fallback chain present for NDX/N225/KOSPI/TWII")\n'
          if marker2 not in text:
              raise SystemExit('overseas builder marker not found; aborting without mutation')
          text = text.replace(marker2, marker2 + addition2, 1)
          path.write_text(text, encoding='utf-8')

          cfg_path = Path('config/market/market_monitor_config.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          fallbacks = {
              'NDX': 'eastmoney_push2:100.NDX',
              'N225': 'eastmoney_push2:100.N225',
              'KOSPI': 'eastmoney_push2:100.KS11',
              'TWII': 'eastmoney_push2:100.TWII',
          }
          for item in cfg.get('classes', {}).get('A', {}).get('objects', []):
              object_id = str(item.get('id') or '')
              if object_id in fallbacks:
                  prior = str(item.get('fallback_source') or '').strip()
                  values = [x for x in prior.split('|') if x]
                  if fallbacks[object_id] not in values:
                      values.insert(0, fallbacks[object_id])
                  item['fallback_source'] = '|'.join(values)
                  item['status'] = 'ACTIVE_WITH_FALLBACK'
          providers = cfg.get('providers', {})
          if 'eastmoney_push2' in providers:
              providers['eastmoney_push2']['scope'] = '恒生科技指数直接主源；已验证A股ETF/个股/部分指数直接备源；NDX/N225/KOSPI/TWII对象级直接备源'
          cfg['version'] = 'V1.5'
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m py_compile scripts/check_system_consistency.py scripts/build_overseas_context.py
          python -m unittest discover -s tests -p 'test_market*.py'
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-fix-overseas-stock-alignment.yml
          git add scripts/check_system_consistency.py config/market/market_monitor_config.json .github/workflows/one-shot-fix-overseas-stock-alignment.yml
          git commit -m "fix: align close-session stock timing and overseas provider audit"
          git push origin HEAD:fix/overseas-redundancy-stock-time-alignment
