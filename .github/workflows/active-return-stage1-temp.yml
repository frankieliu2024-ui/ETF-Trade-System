name: Active return Stage1 temp

on:
  push:
    paths:
      - ".github/workflows/active-return-stage1-temp.yml"
      - "requests/research_backfill/active_return_stage1_trigger.txt"

permissions:
  contents: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run active return Stage1
        run: python scripts/run_active_return_stage1.py
      - name: Enforce research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/state/active_return_research_status.json').read_text(encoding='utf-8'))
          assert s['decision_eligible'] is False
          assert s['trade_signal'] is None
          assert s['master_override'] is False
          assert s['production_integration'] is False
          PY
      - name: Persist research result only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtests/active_return_stage1_validation.json data/state/active_return_research_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record active return Stage1"
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
