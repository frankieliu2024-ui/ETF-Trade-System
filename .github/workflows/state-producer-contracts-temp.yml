name: state-producer-contracts-temp
on:
  push:
    branches:
      - maintenance/state-producer-contracts-20260827
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile maintenance checks
        run: python -m py_compile scripts/check_production_mutation_protocol.py scripts/runtime_self_heal.py
      - name: Validate producer contracts
        run: python scripts/check_production_mutation_protocol.py
