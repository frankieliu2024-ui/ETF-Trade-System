name: One-off promote TWSE TWII and sync Asia policy 2026-08-27
on:
  push:
    paths:
      - ".github/workflows/one-off-promote-twse-twii-and-sync-asia-policy-20260827.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply production patches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def must_replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing exact block in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 1) Provider policy config.
          p=Path('config/market/provider_priority.json'); cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg['version']='V1.10'
          cfg['providers']['twse_mis']={
            'kind':'台湾证券交易所官方MIS公开即时行情；当前仅验证台湾加权指数（TWII）tse_t00.tw',
            'requires_key':False,
            'role':'primary_for_TWII_after_open_session_parallel_validation_20260827',
            'adjusted':False
          }
          cfg['providers']['yahoo_chart_api']['role']='primary_for_formal_overseas_indices_except_HSTECH_N225_KOSPI_TWII_and_us_extended_hours; delayed_crosscheck_for_N225_KOSPI_TWII'
          cfg['providers']['eastmoney_push2delay']['kind']='东方财富push2备用host；对日经225指数（N225）为经开盘并行验证的首选生产endpoint；对韩国综合指数（KOSPI）和台湾加权指数（TWII）作为直接备源；仍属于东方财富同一provider家族，不计作独立第二数据源'
          cfg['providers']['eastmoney_push2delay']['role']='preferred_endpoint_for_N225_and_verified_direct_fallback_for_KOSPI_TWII'
          cfg['objects']['TWII']=['twse_mis:tse_t00.tw','eastmoney_push2delay:100.TWII','eastmoney_push2:100.TWII','yahoo_chart_api']
          cfg['object_fallback_policy']['TWII']={'primary':'twse_mis:tse_t00.tw','fallback':['eastmoney_push2delay:100.TWII','eastmoney_push2:100.TWII','yahoo_chart_api'],'direct_only':True}
          cfg['notes']['asia_direct_fallback']='2026-08-27开盘实测后的当前正式链：日经225指数（N225）=东方财富push2delay→东方财富标准host→Yahoo→513520代理；韩国综合指数（KOSPI）=Naver→东方财富push2delay→东方财富标准host→Yahoo；台湾加权指数（TWII）=台湾证券交易所官方MIS→东方财富push2delay→东方财富标准host→Yahoo。实际主备权威以object_fallback_policy和build_overseas_context为准。'
          cfg['notes']['n225_kospi_redundancy']='2026-08-27真实开盘验证：N225东方财富低延迟endpoint为秒级，Yahoo约15分钟延迟；进一步测试Stooq映射、日经官方HTML、Naver NII@NI225、Google Finance后，仍未获得另一个同时满足秒级/近实时、独立provider、真实可审计时间戳和稳定结构化字段的N225源。Naver页面明确为15分钟延迟，故不提升。KOSPI已由Naver形成独立实时主源。'
          cfg['notes']['twii_live_validation']='2026-08-27 09:11-09:12北京时间三轮开盘并行验证：台湾证券交易所官方MIS tse_t00.tw三轮均HTTP 200，provider tlong时点约落后19-22秒，OHLC/昨收完整；东方财富push2delay约29-51秒且同源标准host出现502；Yahoo本轮未形成完整1分钟OHLC。因此TWSE MIS提升为TWII正式主源。'
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 2) Production builder: add TWSE fetcher and TWII priority branch.
          target='scripts/build_overseas_context.py'
          insertion='''\n\ndef fetch_twse_taiex(generated_utc: datetime) -> dict:\n    params = {"ex_ch": "tse_t00.tw", "json": "1", "delay": "0", "_": str(int(generated_utc.timestamp() * 1000))}\n    url = "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?" + urllib.parse.urlencode(params)\n    req = urllib.request.Request(url, headers={"User-Agent": "ETF-Trade-System/2.2.16", "Referer": "https://mis.twse.com.tw/stock/fibest.jsp?stock=t00"})\n    with urllib.request.urlopen(req, timeout=20) as response:\n        status_code = int(response.status)\n        payload = json.load(response)\n    rows = payload.get("msgArray") or []\n    if len(rows) != 1:\n        raise RuntimeError(f"TWSE MIS TAIEX expected one row, got {len(rows)}")\n    data = rows[0]\n    def num(key):\n        raw = data.get(key)\n        if raw in (None, "", "-"):\n            return None\n        return float(str(raw).replace(",", ""))\n    required = {"open": num("o"), "high": num("h"), "low": num("l"), "close": num("z")}\n    if any(v is None for v in required.values()):\n        raise RuntimeError("TWSE MIS TAIEX missing OHLC fields")\n    raw_time = data.get("tlong")\n    if not raw_time:\n        raise RuntimeError("TWSE MIS TAIEX missing tlong provider timestamp")\n    dt_utc = parse_provider_datetime(raw_time, "Asia/Taipei")\n    local = dt_utc.astimezone(ZoneInfo("Asia/Taipei"))\n    latest = {\n        **required,\n        "volume": num("v"), "previous_close": num("y"),\n        "timestamp": int(dt_utc.timestamp()),\n        "as_of_utc": dt_utc.isoformat(timespec="seconds").replace("+00:00", "Z"),\n        "as_of_local": local.isoformat(timespec="seconds"),\n        "as_of_beijing": dt_utc.astimezone(BEIJING).isoformat(timespec="seconds"),\n        "market_date_local": local.date().isoformat(), "provider_timezone": "Asia/Taipei", "symbol": "tse_t00.tw",\n    }\n    phase = market_phase("Asia/Taipei", generated_utc)\n    return {\n        "object": "TWII", "name": "台湾加权指数", "reference_role": "TAIWAN_EQUITY",\n        "provider": "twse_mis", "provider_result": f"HTTP {status_code}", "provider_timestamp_field": "tlong",\n        "symbol": "tse_t00.tw", "market_timezone": "Asia/Taipei", "market_phase_at_generation": phase,\n        "time_relation_to_a_share": time_relation("TWII", latest, phase, generated_utc),\n        "quality_status": validate_latest(latest), "latest": latest,\n        "display_time_rule": "正式输出优先显示latest.as_of_beijing（北京时间）；同时保留台湾本地交易时点。",\n        "decision_note": "台湾证券交易所官方MIS为台湾加权指数正式实时主源；使用tlong作为provider时点，不得用请求时间代替行情时间。",\n    }\n'''
          must_replace(target,'\n\ndef fetch_eastmoney_index(object_id: str, spec: dict, generated_utc: datetime, secid: str, *, host: str = "push2.eastmoney.com") -> dict:',insertion+'\n\ndef fetch_eastmoney_index(object_id: str, spec: dict, generated_utc: datetime, secid: str, *, host: str = "push2.eastmoney.com") -> dict:')
          must_replace(target,'# N225/KOSPI priorities were promoted after three parallel live rounds on\n                # 2026-08-27. Yahoo remained ~15m/~20m delayed respectively, while the\n                # selected live paths stayed within seconds of capture. Other objects keep\n                # the existing Yahoo-first policy.\n                if object_id in {"N225", "KOSPI"}:','# N225/KOSPI/TWII priorities were promoted after live-session parallel validation on\n                # 2026-08-27. Production selection uses the first fresh, valid direct source;\n                # delayed Yahoo remains cross-check/fallback where appropriate.\n                if object_id in {"N225", "KOSPI", "TWII"}:')
          old='''                    if object_id == "N225":\n                        direct_chain = [\n                            (f"eastmoney_push2delay:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2delay.eastmoney.com")),\n                            (f"eastmoney_push2:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")),\n                            ("yahoo_chart_api", lambda: fetch_yahoo(object_id, spec, generated_utc)),\n                        ]\n                        configured_primary = f"eastmoney_push2delay:{secid}"\n                    else:\n                        direct_chain = [\n                            ("naver_finance:KOSPI", lambda: fetch_naver_kospi(generated_utc)),\n                            (f"eastmoney_push2delay:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2delay.eastmoney.com")),\n                            (f"eastmoney_push2:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")),\n                            ("yahoo_chart_api", lambda: fetch_yahoo(object_id, spec, generated_utc)),\n                        ]\n                        configured_primary = "naver_finance:KOSPI"\n'''
          new='''                    if object_id == "N225":\n                        direct_chain = [\n                            (f"eastmoney_push2delay:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2delay.eastmoney.com")),\n                            (f"eastmoney_push2:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")),\n                            ("yahoo_chart_api", lambda: fetch_yahoo(object_id, spec, generated_utc)),\n                        ]\n                        configured_primary = f"eastmoney_push2delay:{secid}"\n                    elif object_id == "KOSPI":\n                        direct_chain = [\n                            ("naver_finance:KOSPI", lambda: fetch_naver_kospi(generated_utc)),\n                            (f"eastmoney_push2delay:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2delay.eastmoney.com")),\n                            (f"eastmoney_push2:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")),\n                            ("yahoo_chart_api", lambda: fetch_yahoo(object_id, spec, generated_utc)),\n                        ]\n                        configured_primary = "naver_finance:KOSPI"\n                    else:\n                        direct_chain = [\n                            ("twse_mis:tse_t00.tw", lambda: fetch_twse_taiex(generated_utc)),\n                            (f"eastmoney_push2delay:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2delay.eastmoney.com")),\n                            (f"eastmoney_push2:{secid}", lambda: fetch_eastmoney_index(object_id, spec, generated_utc, secid, host="push2.eastmoney.com")),\n                            ("yahoo_chart_api", lambda: fetch_yahoo(object_id, spec, generated_utc)),\n                        ]\n                        configured_primary = "twse_mis:tse_t00.tw"\n'''
          must_replace(target,old,new)
          must_replace(target,'"decision_note": "东方财富对象级直接备源；仅在Yahoo主源不可用、无效或开放交易阶段明显延迟时启用。",','"decision_note": "东方财富对象级直接行情；按当前对象级正式主备策略使用，并始终以provider自身时间戳通过质量门禁。",')

          # 3) Data standard text sync.
          target='ETF与市场监测数据接口使用规范.md'
          must_replace(target,'> 版本：V1.9  ','> 版本：V1.10  ')
          old='''**Yahoo Chart API**：当前是纳斯达克100指数（NDX）、费城半导体指数（SOX）、日经225指数（N225）、韩国综合指数（KOSPI）、台湾加权指数（TWII）等正式海外/亚洲指数的主要直接源，也用于海外产业链个股、商品/宏观辅助对象和美股扩展时段5分钟级行情。Yahoo返回成功仍须经过时点、市场阶段和质量检查。恒生科技指数的Yahoo正式映射为 `HSTECH.HK`，不得使用已验证返回404的 `^HSTECH`。'''
          new='''**Yahoo Chart API**：当前仍是纳斯达克100指数（NDX）、费城半导体指数（SOX）等正式海外指数的主要直接源，也用于海外产业链个股、商品/宏观辅助对象和美股扩展时段5分钟级行情。经2026-08-27真实开盘验证，日经225指数（N225）、韩国综合指数（KOSPI）、台湾加权指数（TWII）的Yahoo盘中路径存在明显延迟或完整分钟OHLC不足，因此对这三个对象降为交叉验证/后备路径。Yahoo返回成功仍须经过时点、市场阶段和质量检查。恒生科技指数的Yahoo正式映射为 `HSTECH.HK`，不得使用已验证返回404的 `^HSTECH`。'''
          must_replace(target,old,new)
          marker='''**Eastmoney push2（东方财富公开行情接口）**：当前为恒生科技指数（HSTECH）的正式主源，使用已在真实交易时段验证的 `124.HSTECH`；同时作为除上证指数（000001）外多数已验证A股ETF/个股/指数对象的后备直连源。上证指数的 `secid=1.000001` 已验证并非可靠指数映射，因此不得作为上证指数备源。所有东方财富行情必须读取并校验provider行情时间戳，不得用workflow执行时间冒充行情时间。'''
          must_replace(target,marker,marker+'\n\n**TWSE MIS（台湾证券交易所官方即时行情）**：2026-08-27台湾市场开盘三轮并行实测中，台湾加权指数（TWII）的 `tse_t00.tw` 均返回HTTP 200、真实 `tlong` provider时间戳及完整OHLC/昨收，时点约落后19—22秒，优于本轮东方财富约29—51秒及Yahoo分钟数据缺失，现为台湾加权指数（TWII）正式主源。当前仅验证TWII，不自动扩展至其他台股对象。')
          old='''日经225指数（N225）当前主源仍为Yahoo；开放交易阶段若Yahoo明显延迟，直接切换东方财富 `100.N225`，主host异常时允许同一东方财富provider家族的 `push2delay` host做网络级重试，二者必须使用provider时间戳且不得视为两个独立数据源。韩国综合指数（KOSPI）当前主源仍为Yahoo；开放交易阶段优先使用东方财富 `100.KS11` 直连备源，若其不可用或明显延迟，再使用已验证的Naver Finance `KOSPI`实时指数JSON直连备源。Naver必须读取`localTradedAt`和市场状态，不得用请求时间代替行情时间。'''
          new='''日经225指数（N225）的当前正式链为：`eastmoney_push2delay:100.N225 → eastmoney_push2:100.N225 → yahoo_chart_api → ETF_PROXY_513520`。2026-08-27真实开盘多轮测试中，东方财富低延迟endpoint保持秒级，而Yahoo约延迟15分钟。进一步测试Stooq、日经官方页面、Naver `NII@NI225`、Google Finance后，仍未获得另一个同时满足独立provider、秒级/近实时、真实可审计时间戳与稳定结构化OHLC的正式候选；Naver页面明确为15分钟延迟。因此N225当前仍存在“缺少第二个独立秒级实时直连源”的冗余不足，必须如实保留，不得把东方财富两个host计作两个独立源。\n\n韩国综合指数（KOSPI）的当前正式链为：`naver_finance:KOSPI → eastmoney_push2delay:100.KS11 → eastmoney_push2:100.KS11 → yahoo_chart_api`。Naver使用`localTradedAt`和市场状态，作为经真实开盘并行验证的独立实时主源。\n\n台湾加权指数（TWII）的当前正式链为：`twse_mis:tse_t00.tw → eastmoney_push2delay:100.TWII → eastmoney_push2:100.TWII → yahoo_chart_api`。TWSE使用`tlong`作为provider时点；东方财富两个host属于同一provider家族；Yahoo保留为延迟型独立交叉验证/最后后备。'''
          must_replace(target,old,new)

          # 4) Add consistency semantic guard for current Asia policy.
          target='scripts/check_system_consistency_core.py'
          anchor='''    check("index_layer:monitor_vs_formal", monitor_indices == formal_indices, f"monitor={sorted(monitor_indices)} formal={sorted(formal_indices)}")\n'''
          addition='''    provider_priority = read_json("config/market/provider_priority.json")\n    twii_policy = (provider_priority.get("object_fallback_policy") or {}).get("TWII") or {}\n    n225_policy = (provider_priority.get("object_fallback_policy") or {}).get("N225") or {}\n    kospi_policy = (provider_priority.get("object_fallback_policy") or {}).get("KOSPI") or {}\n    check("provider_policy:twii_primary_twse", twii_policy.get("primary") == "twse_mis:tse_t00.tw" and twii_policy.get("fallback") == ["eastmoney_push2delay:100.TWII", "eastmoney_push2:100.TWII", "yahoo_chart_api"], f"TWII={twii_policy}")\n    check("provider_policy:n225_current_primary", n225_policy.get("primary") == "eastmoney_push2delay:100.N225", f"N225={n225_policy}")\n    check("provider_policy:kospi_current_primary", kospi_policy.get("primary") == "naver_finance:KOSPI", f"KOSPI={kospi_policy}")\n    standard_text = read_text(DATA_STANDARD)\n    check("data_standard:asia_current_provider_roles", all(token in standard_text for token in ("twse_mis:tse_t00.tw", "eastmoney_push2delay:100.N225", "naver_finance:KOSPI", "缺少第二个独立秒级实时直连源")), "Asia live provider roles and N225 redundancy limitation are explicit")\n'''
          must_replace(target,anchor,anchor+addition)

          # Syntax/config validation before commit.
          json.loads(Path('config/market/provider_priority.json').read_text(encoding='utf-8'))
          import py_compile
          py_compile.compile('scripts/build_overseas_context.py',doraise=True)
          py_compile.compile('scripts/check_system_consistency_core.py',doraise=True)
          print('patch-validation=PASS')
          PY
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_overseas_context.py scripts/check_system_consistency_core.py config/market/provider_priority.json ETF与市场监测数据接口使用规范.md
          git diff --cached --check
          git commit -m "fix: promote TWSE as TWII live primary"
          git pull --rebase origin main
          git push origin HEAD:main
