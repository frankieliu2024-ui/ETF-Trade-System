name: Hithink stock probe validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_hithink_stock.py"
      - ".github/workflows/stock-probe-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/probe_hithink_stock.py"
      - ".github/workflows/stock-probe-validation.yml"
  workflow_dispatch:
    inputs:
      code:
        description: "A-share ticker or thscode"
        required: true
        default: "688981"
      date:
        description: "Historical trading date YYYY-MM-DD"
        required: true
        default: "2026-08-21"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Hithink historical A-share bar
        id: probe
        continue-on-error: true
        env:
          PROBE_CODE: ${{ github.event.inputs.code || '688981' }}
          PROBE_DATE: ${{ github.event.inputs.date || '2026-08-21' }}
        run: |
          mkdir -p data/market/audit
          set +e
          python scripts/probe_hithink_stock.py "$PROBE_CODE" --date "$PROBE_DATE" --adjust none \
            --output "data/market/audit/hithink_stock_probe_${PROBE_CODE}_${PROBE_DATE}.json" \
            > /tmp/hithink_probe_stdout.txt 2> /tmp/hithink_probe_stderr.txt
          rc=$?
          export PROBE_RC="$rc"
          python - <<'PY'
          import json, os
          from pathlib import Path
          code = os.environ['PROBE_CODE']
          day = os.environ['PROBE_DATE']
          rc = int(os.environ['PROBE_RC'])
          result_path = Path(f'data/market/audit/hithink_stock_probe_{code}_{day}.json')
          stdout = Path('/tmp/hithink_probe_stdout.txt').read_text(encoding='utf-8', errors='replace') if Path('/tmp/hithink_probe_stdout.txt').exists() else ''
          stderr = Path('/tmp/hithink_probe_stderr.txt').read_text(encoding='utf-8', errors='replace') if Path('/tmp/hithink_probe_stderr.txt').exists() else ''
          if result_path.exists():
              try:
                  payload = json.loads(result_path.read_text(encoding='utf-8'))
              except Exception:
                  payload = {'ok': False, 'raw_result': result_path.read_text(encoding='utf-8', errors='replace')}
          else:
              payload = {'ok': False, 'provider': 'hithink-finance', 'thscode': f'{code}.SH' if code.startswith(('60','68')) else code, 'date': day, 'adjust': 'none'}
          payload['exit_code'] = rc
          if stdout.strip(): payload['stdout'] = stdout.strip()[-4000:]
          if stderr.strip(): payload['stderr'] = stderr.strip()[-4000:]
          result_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Persist validation audit result
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/audit/hithink_stock_probe_*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: record Hithink stock probe validation"
          git pull --rebase origin main
          git push origin HEAD:main
