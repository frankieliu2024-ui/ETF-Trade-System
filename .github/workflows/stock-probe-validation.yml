name: Hithink stock probe validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_hithink_stock.py"
      - ".github/workflows/stock-probe-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/probe_hithink_stock.py"
      - ".github/workflows/stock-probe-validation.yml"
  workflow_dispatch:
    inputs:
      code:
        description: "A-share ticker or thscode"
        required: true
        default: "688981"
      date:
        description: "Historical trading date YYYY-MM-DD"
        required: true
        default: "2026-08-21"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Hithink historical A-share bar
        env:
          PROBE_CODE: ${{ github.event.inputs.code || '688981' }}
          PROBE_DATE: ${{ github.event.inputs.date || '2026-08-21' }}
        run: |
          mkdir -p data/market/audit
          python scripts/probe_hithink_stock.py "$PROBE_CODE" --date "$PROBE_DATE" --adjust none \
            --output "data/market/audit/hithink_stock_probe_${PROBE_CODE}_${PROBE_DATE}.json"
      - name: Persist successful validation result
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/audit/hithink_stock_probe_*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: record Hithink stock probe validation"
          git pull --rebase origin main
          git push origin HEAD:main
