name: One-off post-Trial state cleanup
on:
  push:
    paths:
      - ".github/workflows/oneoff-post-trial-state-cleanup.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch fee pending logic and current ETF identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/sync_formal_files.py')
          s = p.read_text(encoding='utf-8')
          old = '    pending = summary.get("unknown_fee_flag", True)\n'
          new = '''    pending_fee_trades = [\n        t for t in (account.get("trades") or [])\n        if str(t.get("fee_status", "")).upper() in {"PENDING", "PENDING_CONFIRMATION", "UNKNOWN"}\n    ]\n    pending = bool(summary.get("unknown_fee_flag", True) or pending_fee_trades)\n'''
          if old not in s:
              raise SystemExit('sync_formal_files pending marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          d = Path('ETF当前状态_DASHBOARD.md')
          t = d.read_text(encoding='utf-8')
          replacements = {
            '持仓ETF：半导体设备ETF（561980）、科创50ETF（588000）、科创创业ETF（159781）、纳指ETF（159941）；观察ETF：德国ETF（159561）、日经ETF（513520）、黄金ETF（518880）、创新药ETF（159992）、通信ETF（515880）、电网设备ETF（159326）、恒生科技ETF（513180）':
            '持仓ETF：半导体设备ETF（561980）、科创50ETF（588000）、科创创业ETF（159781）、纳指ETF（159941）、通信ETF（515880）；观察ETF：德国ETF（159561）、日经ETF（513520）、黄金ETF（518880）、创新药ETF（159992）、电网设备ETF（159326）、恒生科技ETF（513180）',
            '当前持仓ETF：半导体设备ETF（561980）51,900份、科创50ETF（588000）14,100份、科创创业ETF（159781）19,500份、纳指ETF（159941）12,200份。':
            '当前持仓ETF：半导体设备ETF（561980）51,900份、科创50ETF（588000）14,100份、科创创业ETF（159781）19,500份、纳指ETF（159941）12,200份、通信ETF（515880）7,400份。',
            '当前观察ETF：德国ETF（159561）、日经ETF（513520）、黄金ETF（518880）、创新药ETF（159992）、通信ETF（515880）、电网设备ETF（159326）、恒生科技ETF（513180）。':
            '当前观察ETF：德国ETF（159561）、日经ETF（513520）、黄金ETF（518880）、创新药ETF（159992）、电网设备ETF（159326）、恒生科技ETF（513180）。'
          }
          for old_text, new_text in replacements.items():
              if old_text not in t:
                  raise SystemExit(f'Dashboard marker not found: {old_text[:50]}')
              t = t.replace(old_text, new_text, 1)
          d.write_text(t, encoding='utf-8')
          PY
      - name: Refresh formal account block
        run: python scripts/sync_formal_files.py
      - name: Run focused tests
        run: |
          python -m unittest tests.test_market_formal_file_sync
          python scripts/check_system_consistency.py
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync_formal_files.py ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md data/state/CURRENT.json
          git commit -m "fix: reconcile executed Trial state and pending fee status"
          git push origin HEAD:main
