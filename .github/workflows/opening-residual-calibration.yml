name: Opening residual production calibration

on:
  workflow_dispatch:
  push:
    branches:
      - research/low-cost-alpha-validation-20260828
    paths:
      - "scripts/run_opening_residual_production_calibration.py"
      - ".github/workflows/opening-residual-calibration.yml"

permissions:
  contents: read

concurrency:
  group: etf-opening-residual-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas requests
      - name: Compile
        run: python -m py_compile scripts/run_opening_residual_production_calibration.py
      - name: Run PIT calibration
        working-directory: scripts
        run: python run_opening_residual_production_calibration.py
      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: opening-residual-calibration-${{ github.run_id }}
          path: research/backtests/opening_residual_561980_production_calibration.json
          if-no-files-found: error
          retention-days: 14
