name: One-off finalize 20260827 close review
on:
  push:
    paths:
      - ".github/workflows/oneoff-finalize-20260827-close-review.yml"
permissions:
  contents: write
concurrency:
  group: production-main-writer
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Finalize 1500 account market review dashboard case chain
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          current = json.loads(Path('data/state/CURRENT.json').read_text(encoding='utf-8'))
          account = json.loads(Path('data/state/account_fact.json').read_text(encoding='utf-8'))
          review_event = json.loads(Path('events/reviews/2026-08-27.json').read_text(encoding='utf-8'))
          review = review_event.get('review') or review_event.get('formal_review') or {}

          assert current.get('market_date') == '2026-08-27'
          assert current.get('latest_valid_node') == 'close'
          assert current.get('node_status') == 'READY'
          assert current.get('latest_snapshot') == 'data/market/snapshots/2026-08-27_152016.json'
          assert account.get('status') == 'VALID'
          assert account.get('updated_at') == '2026-08-27T15:03:00+08:00'
          risk = float((review.get('etf_strategy_known_net') or {}).get('etf_strategy_risk_rate_pct'))
          equity = float((review.get('etf_strategy_known_net') or {}).get('known_net_strategy_equity'))
          assert abs(risk - (-6.1814)) < 0.001
          assert abs(equity - 187637.19) < 0.01

          # Dashboard: keep a single authoritative dynamic risk value in the managed block,
          # remove the stale duplicate numeric snapshot, and preserve the latest formal close decision.
          dash_path = Path('ETF当前状态_DASHBOARD.md')
          dash = dash_path.read_text(encoding='utf-8')
          old_section = re.compile(r"\n## ETF策略风险口径（V2\.2\.18）\n.*?(?=\n## 当前状态使用边界)", re.S)
          replacement = (
              "\n## ETF策略风险口径（V2.2.18）\n\n"
              "- ETF策略计划本金、Known-net权益、累计Known-net损益、策略风险率和费用状态均以顶部“云端实时状态（自动同步）”及最新正式review为准，本节不再保存第二份动态数值副本。\n"
              "- 当前风险许可与金额边界只服从ETF规则_MASTER.md和最新正式review；已执行成交优先于旧决策。\n"
          )
          dash, n = old_section.subn(replacement, dash, count=1)
          assert n == 1, 'dashboard stale risk section not found'
          marker = '最近一次正式决策未随本次账户维护请求提供；脚本不自行推断。'
          formal_block = (
              "### 最近一次正式收盘复盘\n\n"
              "- 正式收盘有效时点：2026-08-27 15:00:00（北京时间）；显式close节点14/14核心对象数据可用。\n"
              "- ETF策略Known-net权益：187,637.19元；累计Known-net损益：-12,362.81元；策略风险率：约-6.18%，仍处风险观察区。\n"
              "- 风险许可：允许Trial；Confirm关闭。\n"
              "- 唯一主候选：通信ETF（515880），机会状态为Trial机会；上午Trial已执行7,400份@0.671元，收盘0.678元，T日反馈增强。\n"
              "- 金额与动作：本节点新增0元；通信ETF（515880）继续Trial验证，其余ETF持有管理，不减仓、不退出。\n"
              "- 0元主因：风险观察区当日允许的一次5,000元Trial已经执行，Confirm仍关闭。"
          )
          assert marker in dash, 'dashboard decision placeholder not found'
          dash = dash.replace(marker, formal_block, 1)
          dash_path.write_text(dash, encoding='utf-8')

          # CASE: keep the same hypothesis continuous from Trial execution into T-day close validation.
          exp_path = Path('ETF交易复盘与经验库_2026.md')
          exp = exp_path.read_text(encoding='utf-8')
          exp = exp.replace(
              '更新时点：2026-08-27（已纳入中国银河证券2026-07-13至2026-08-25对账单事实、8月25日两笔ETF卖出费用确认、8月26日正式收盘复盘，以及8月27日通信ETF（515880）Trial真实买入成交；本次买入费用待确认）',
              '更新时点：2026-08-27（已纳入中国银河证券2026-07-13至2026-08-25对账单事实、8月25日两笔ETF卖出费用确认、8月26日正式收盘复盘，以及8月27日通信ETF（515880）Trial真实买入成交与T日正式收盘验证；本次买入费用待确认）',
              1,
          )
          old_result = '- 结果：真实成交已经执行，生命周期正式进入Trial；截至本CASE建立时尚未到达后续T+验证节点，不提前写Trial成功、失败、Confirm或退出结论。'
          new_result = '- 结果：真实成交已经执行，生命周期正式进入Trial。2026-08-27 15:00正式收盘，通信ETF（515880）收0.678元，较0.671元实际成交价约+1.04%，全天约+4.63%，11只ETF横截面排名第一；科创50指数（000688）收涨约+3.77%，本地科技成长反馈增强。该结果只记为T日正向验证增强，不提前写Trial成功、Confirm或规则升级。'
          assert old_result in exp, 'CASE result line not found'
          exp = exp.replace(old_result, new_result, 1)
          old_judgment = '- 判断质量：进行中。事前决策符合风险观察区“允许Trial、Confirm关闭”和固定5,000元Trial边界，并有目标ETF自身反馈；是否属于高质量机会仍须由后续Trial验证结果检验，不能用决策后行情倒推。'
          new_judgment = '- 判断质量：进行中，T日证据增强。事前决策符合风险观察区“允许Trial、Confirm关闭”和固定5,000元Trial边界；收盘后可确认目标ETF自身强度及A股科技反馈继续增强，但这只能评价已经发生的T日验证，不能用15:00结果倒推09:56决策必然正确，跨日持续性仍须后续节点检验。'
          assert old_judgment in exp, 'CASE judgment line not found'
          exp = exp.replace(old_judgment, new_judgment, 1)
          old_eff = '- 资本使用效率：待验证。资金来自既有现金，没有为本次Trial机械卖出旧仓；后续须继续与现金、全部持仓ETF、全部观察ETF及可释放资本统一比较，判断这4,965.40元继续占用是否仍优于替代用途。'
          new_eff = '- 资本使用效率：T日初步正向、仍待跨日验证。资金来自既有现金，没有为本次Trial机械卖出旧仓；15:00时该笔资本取得正反馈，且通信ETF（515880）仍是下一单位资本重新获得许可时的主比较对象，但风险观察区当日Trial额度已使用、Confirm关闭，因此不追加。后续继续与现金、全部持仓ETF、全部观察ETF及可释放资本统一比较。'
          assert old_eff in exp, 'CASE efficiency line not found'
          exp = exp.replace(old_eff, new_eff, 1)
          exp_path.write_text(exp, encoding='utf-8')

          # Machine-verifiable closure record.
          closure = {
              'schema_version': '1.0',
              'market_date': '2026-08-27',
              'chain': ['account', 'market_close', 'formal_review', 'dashboard', 'case'],
              'account_fact_updated_at': account.get('updated_at'),
              'close_snapshot': current.get('latest_snapshot'),
              'formal_review_path': 'events/reviews/2026-08-27.json',
              'dashboard_path': 'ETF当前状态_DASHBOARD.md',
              'case_id': 'CASE-20260827-01',
              'known_net_equity': equity,
              'risk_rate_pct': risk,
              'status': 'CLOSED',
              'note': '账户、15:00显式close、正式review、Dashboard和同一Trial CASE已完成一致闭环；通信ETF买入费用仍待券商确认，不影响本次闭环状态。'
          }
          out = Path('data/state/close_review_closure_2026-08-27.json')
          out.write_text(json.dumps(closure, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Final semantic assertions.
          check_dash = dash_path.read_text(encoding='utf-8')
          check_exp = exp_path.read_text(encoding='utf-8')
          assert '约184,628.79元' not in check_dash
          assert '约-7.69%' not in check_dash
          assert 'ETF策略Known-net权益：187,637.19元' in check_dash
          assert '2026-08-27 15:00正式收盘' in check_exp
          assert 'T日证据增强' in check_exp
          print(json.dumps(closure, ensure_ascii=False))
          PY
      - name: Publish closure and self-remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-finalize-20260827-close-review.yml
          git add ETF当前状态_DASHBOARD.md ETF交易复盘与经验库_2026.md data/state/close_review_closure_2026-08-27.json
          git commit -m "review: close 20260827 account market review dashboard case chain"
          git pull --rebase origin main
          git push origin HEAD:main
