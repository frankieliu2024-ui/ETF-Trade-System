name: One-off finalize 20260827 close review
on:
  push:
    paths:
      - ".github/workflows/oneoff-finalize-20260827-close-review.yml"
permissions:
  contents: write
concurrency:
  group: production-main-writer
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply formal close review without recapturing market
        run: |
          python scripts/refresh_gate.py --guard-request requests/live_snapshot/20260827_1523_formal_close_review.json
          python scripts/process_state_sync_request.py requests/live_snapshot/20260827_1523_formal_close_review.json
          python scripts/build_e2e_status.py
          python scripts/build_state_context.py
          python scripts/build_query_context.py
          python scripts/build_post_market_review.py
          python - <<'PY'
          import json
          from pathlib import Path
          cur=json.loads(Path('data/state/CURRENT.json').read_text(encoding='utf-8'))
          rev=json.loads(Path('events/reviews/2026-08-27.json').read_text(encoding='utf-8'))
          assert cur['latest_valid_node']=='close'
          r=rev['formal_review'] if 'formal_review' in rev else rev
          risk=((r.get('etf_strategy_known_net') or {}).get('etf_strategy_risk_rate_pct'))
          assert abs(float(risk)-(-6.1814)) < 0.001, risk
          print('formal close review finalized', risk)
          PY
      - name: Publish formal close state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state post_market_review events ETF当前状态_DASHBOARD.md ETF市场行情档案_2026.md ETF交易复盘与经验库_2026.md
          git reset -- data/state/system_consistency.json || true
          git commit -m "review: finalize 20260827 formal close state"
          git pull --rebase origin main
          git push origin HEAD:main
