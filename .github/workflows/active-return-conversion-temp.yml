name: Active return conversion temp

on:
  push:
    paths:
      - ".github/workflows/active-return-conversion-temp.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wire validated active-return evidence into research contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_state_context.py')
          s=p.read_text(encoding='utf-8')
          reps=[
          ('from build_margin_financing_evidence import build as build_margin_financing_evidence\n',
           'from build_margin_financing_evidence import build as build_margin_financing_evidence\nfrom build_active_return_evidence import build as build_active_return_evidence\n'),
          ('    margin_financing_summary = compact_margin_financing(margin_financing)\n\n    contribution_audit',
           '    margin_financing_summary = compact_margin_financing(margin_financing)\n\n    active_return = build_active_return_evidence(ROOT)\n    atomic_json_write(ROOT / "data" / "state" / "active_return_evidence.json", active_return)\n\n    contribution_audit'),
          ('            "margin_financing": margin_financing_summary,\n',
           '            "margin_financing": margin_financing_summary,\n            "active_return": active_return,\n'),
          ('            "margin_financing_evidence": "data/state/margin_financing_evidence.json",\n',
           '            "margin_financing_evidence": "data/state/margin_financing_evidence.json",\n            "active_return_evidence": "data/state/active_return_evidence.json",\n'),
          ('    context["research_evidence"]["margin_financing_evidence"] = margin_financing_summary\n',
           '    context["research_evidence"]["margin_financing_evidence"] = margin_financing_summary\n    context["research_evidence"]["active_return_evidence"] = active_return\n'),
          ('    context["margin_financing_evidence_file"] = "data/state/margin_financing_evidence.json"\n',
           '    context["margin_financing_evidence_file"] = "data/state/margin_financing_evidence.json"\n    context["active_return_evidence_file"] = "data/state/active_return_evidence.json"\n'),
          ('        "margin_financing_use_in_current_decision": margin_financing.get("use_in_current_decision", False),\n',
           '        "margin_financing_use_in_current_decision": margin_financing.get("use_in_current_decision", False),\n        "active_return_status": active_return.get("status"),\n        "active_return_use_in_current_decision": active_return.get("use_in_current_decision", False),\n')]
          for old,new in reps:
              if old not in s:
                  raise SystemExit(f'missing expected patch anchor: {old[:80]!r}')
              s=s.replace(old,new,1)
          s=s.replace('经验证的ETF份额与融资杠杆证据', '经验证的ETF份额、融资杠杆与主动收益方法证据', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/build_state_context.py scripts/build_active_return_evidence.py
      - name: Build state context and assert active-return boundary
        run: |
          python scripts/build_state_context.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/state/active_return_evidence.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/state/research_context.json').read_text(encoding='utf-8'))
          d=json.loads(Path('data/state/decision_context.json').read_text(encoding='utf-8'))
          assert e['status']=='READY'
          assert e['use_in_current_decision'] is True
          assert e['decision_eligible'] is False and e['trade_signal'] is None
          assert 'active_return' in r['validated_evidence_summary']
          assert 'active_return_evidence' in d['research_evidence']
          PY
      - name: Persist wiring and derived evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_state_context.py data/state/active_return_evidence.json data/state/research_context.json data/state/decision_context.json
          git commit -m "research: integrate validated active return evidence"
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
