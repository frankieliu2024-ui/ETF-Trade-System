name: One-off historical trade to CASE audit 20260827
on:
  push:
    paths:
      - ".github/workflows/oneoff-historical-trade-case-audit-20260827.yml"
permissions:
  contents: read
concurrency:
  group: historical-trade-case-audit-20260827
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all historical securities trades and CASE mapping
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          exp_path = root / 'ETF交易复盘与经验库_2026.md'
          arc_path = root / 'ETF市场行情档案_2026.md'
          exp = exp_path.read_text(encoding='utf-8')
          arc = arc_path.read_text(encoding='utf-8')

          start = exp.index('### 2.1 2026-07-13以来完整证券成交索引')
          end = exp.index('### 2.2 银证转账与非交易现金流水', start)
          section = exp[start:end]
          rows = []
          for line in section.splitlines():
              if not line.startswith('|2026-'):
                  continue
              cols = [c.strip() for c in line.strip().strip('|').split('|')]
              if len(cols) < 10:
                  continue
              dt, name, code, side, qty, px, principal, fee, cashflow, remark = cols[:10]
              m = re.search(r'(CASE-\d{8}-\d{2})', remark)
              rows.append({
                  'datetime': dt, 'name': name, 'code': code, 'side': side,
                  'quantity': qty, 'price': px, 'fee': fee, 'remark': remark,
                  'case_id': m.group(1) if m else None,
              })

          case_headings = set(re.findall(r'^###\s+\d+(?:\.\d+)?\s+(CASE-\d{8}-\d{2})[:：]', exp, re.M))
          # More permissive fallback for headings with slightly different numbering.
          case_headings |= set(re.findall(r'^###\s+.*?(CASE-\d{8}-\d{2})[:：]', exp, re.M))

          missing_case = [r for r in rows if not r['case_id']]
          broken_case = [r for r in rows if r['case_id'] and r['case_id'] not in case_headings]

          event_rows = []
          for path in sorted((root / 'events' / 'trades').glob('*.json')):
              try:
                  e = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  event_rows.append({'path': str(path), 'parse_error': repr(exc)})
                  continue
              event_id = str(e.get('event_id') or '')
              linked_case = None
              # AUTO_CASE_INTAKE mapping is the authoritative explicit event→CASE bridge for current events.
              mm = re.search(rf'^{re.escape(event_id)}｜- 已归入(CASE-\d{{8}}-\d{{2}})｜', exp, re.M) if event_id else None
              if mm:
                  linked_case = mm.group(1)
              event_rows.append({
                  'path': str(path), 'event_id': event_id,
                  'status': e.get('execution_status'), 'code': e.get('code'),
                  'side': e.get('side'), 'quantity': e.get('quantity'),
                  'linked_decision_id': e.get('linked_decision_id'),
                  'mapped_case': linked_case,
                  'archive_event_marker': (f'{event_id}｜' in arc) if event_id else False,
                  'experience_event_marker': (f'{event_id}｜' in exp) if event_id else False,
              })

          archive_presence = []
          for r in rows:
              # Objective archive should contain enough exact transaction identity to trace the fact.
              time_token = r['datetime']
              code = r['code']
              archive_presence.append({
                  'datetime': time_token, 'code': code,
                  'archive_has_datetime': time_token in arc,
                  'archive_has_code': code in arc,
              })

          report = {
              'trade_index_count': len(rows),
              'etf_count': sum(1 for r in rows if 'ETF' in r['name']),
              'stock_count': sum(1 for r in rows if 'ETF' not in r['name']),
              'case_heading_count': len(case_headings),
              'case_headings': sorted(case_headings),
              'mapped_trade_count': sum(1 for r in rows if r['case_id']),
              'missing_case_count': len(missing_case),
              'missing_case_rows': missing_case,
              'broken_case_reference_count': len(broken_case),
              'broken_case_reference_rows': broken_case,
              'machine_trade_events': event_rows,
              'archive_exact_datetime_missing': [x for x in archive_presence if not x['archive_has_datetime']],
              'principles': [
                  'Point-in-Time: historical mapping may group trades into a CASE but must not invent contemporaneous Trial/Confirm decisions.',
                  'Initial allocation or IPO-base establishment may be assigned to a factual baseline CASE if it is not a later-rule backfill.',
                  'Every actual security trade should have one human-readable CASE ownership, while multiple trades may belong to one lifecycle CASE.',
              ],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
