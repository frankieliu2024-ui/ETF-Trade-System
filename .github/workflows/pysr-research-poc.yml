name: PySR research PoC

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pysr-research-poc
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.2" "scipy==1.13.1" "requests==2.32.3" "pysr==1.5.10"
          python - <<'PY'
          import pysr
          print("PySR", pysr.__version__)
          PY
      - name: Run PySR stage1
        run: |
          python scripts/run_pysr_stage1_poc.py requests/research_backfill/20260825_pysr_stage1.json
      - name: Enforce research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/backtests/pysr_stage1_validation.json').read_text(encoding='utf-8'))
          s=json.loads(Path('data/state/pysr_research_status.json').read_text(encoding='utf-8'))
          assert r['decision_eligible'] is False
          assert r['trade_signal'] is None
          assert r['trial_confirm'] is None
          assert r['portfolio_target'] is None
          assert r['master_override'] is False
          assert r['historical_decision_prohibited'] is True
          assert s['decision_eligible'] is False
          assert s['trade_signal'] is None
          assert s['master_override'] is False
          print(json.dumps({'status':s['status'],'research_interpretation':s['research_interpretation'],'runs':s['fold_horizon_runs'],'failures':s['failure_count']},ensure_ascii=False))
          PY
      - name: Commit compact research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtests/pysr_stage1_validation.json data/state/pysr_research_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record PySR stage1 validation"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
