name: Manual LLM research critique validation

on:
  workflow_dispatch:
    inputs:
      use_case:
        description: "Bounded read-only research use case"
        required: true
        type: choice
        default: "review_critique"
        options:
          - review_critique
          - active_return_regime_hypotheses
      review_path:
        description: "Frozen formal review JSON path (review_critique only)"
        required: false
        default: "events/reviews/2026-09-11.json"

permissions:
  contents: read

concurrency:
  group: manual-llm-research-critique
  cancel-in-progress: false

jobs:
  critique:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run one bounded DeepSeek post-market critique
        if: ${{ inputs.use_case == 'review_critique' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_SINGLE_CALL: "1"
        run: |
          set +x
          python scripts/run_review_research_critique.py "${{ inputs.review_path }}" --enable-once --observability > result.json
      - name: Run one bounded DeepSeek active-return regime hypothesis call
        if: ${{ inputs.use_case == 'active_return_regime_hypotheses' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_SINGLE_CALL: "1"
        run: |
          set +x
          python scripts/run_deepseek_active_return_regime_hypotheses.py --enable-once --observability > result.json
      - name: Validate read-only result envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("result.json").read_text(encoding="utf-8"))
          if result.get("formal_state_write") is not False:
              raise SystemExit("formal state write is prohibited")
          if result.get("production_action") is not None:
              raise SystemExit("trading action is prohibited")
          summary = {
              "use_case": "${{ inputs.use_case }}",
              "status": result.get("status"),
              "provider": result.get("provider"),
              "model": result.get("model"),
              "call_count": result.get("call_count", 0),
              "schema_valid": True,
              "research_only": True,
              "formal_state_write": False,
              "trading_action": False,
          }
          if result.get("response_observability") is not None:
              summary["response_observability"] = result["response_observability"]
          with open("${{ github.step_summary }}", "a", encoding="utf-8") as fh:
              fh.write("Manual bounded LLM research validation\n")
              json.dump(summary, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY
      - name: Upload read-only research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-research-result
          path: result.json
          if-no-files-found: ignore
