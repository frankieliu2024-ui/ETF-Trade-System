name: On-demand market data

on:
  push:
    branches: [main]
    paths:
      - "requests/market_data/**.json"
      - "scripts/process_market_data_request.py"
      - "scripts/run_full_snapshot_recovery.py"
      - ".github/workflows/on-demand-market-data.yml"
  pull_request:
    branches: [main]
    paths:
      - "requests/market_data/**.json"
      - "scripts/process_market_data_request.py"
      - "scripts/run_full_snapshot_recovery.py"
      - ".github/workflows/on-demand-market-data.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: on-demand-market-data-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Hithink CLI
        run: npm install --global @hithink-tech/hithink-finance-cli
      - name: Process pending request files
        shell: bash
        run: |
          set +e
          mkdir -p data/market/on_demand/results data/market/on_demand/datasets
          found=0
          failed=0
          for req in requests/market_data/*.json; do
            [ -e "$req" ] || continue
            found=1
            rid=$(python - "$req" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]); obj=json.loads(p.read_text(encoding='utf-8'))
          print(obj.get('request_id') or p.stem)
          PY
          )
            if [ -f "data/market/on_demand/results/${rid}.json" ]; then
              continue
            fi
            python scripts/process_market_data_request.py "$req"
            rc=$?
            if [ $rc -ne 0 ]; then failed=1; fi
          done
          echo "found=$found failed=$failed"
          exit 0
      - name: Recover full market state when requested
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: python scripts/run_full_snapshot_recovery.py
      - name: Persist results and recovered runtime state
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/on_demand/results data/market/on_demand/datasets data/market/snapshots data/state/CURRENT.json data/state/runtime_health.json data/state/system_consistency.json data/state/market_delta.json data/state/overseas_context.json data/state/stock_context.json data/state/stock_market_context.json data/state/dashboard_update_candidate.json data/state/decision_context.json data/state/query_context.json data/state/chatgpt_task_probe.json data/state/full_snapshot_recovery.json post_market_review/post_market_review_event.json data/state/review_context.json events/events.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: persist on-demand and recovered market state"
          git pull --rebase origin main
          git push origin HEAD:main
