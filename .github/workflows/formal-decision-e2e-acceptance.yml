name: Formal Decision automated E2E acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/formal_entry_contract.py"
      - "scripts/notification_center.py"
      - "scripts/business_decision_source.py"
      - "scripts/process_state_sync_request.py"
      - "scripts/build_query_context.py"
      - "scripts/runtime_self_heal.py"
      - "scripts/build_e2e_status.py"
      - "scripts/report_delivery_request.py"
      - "tests/test_formal_decision_e2e_contract.py"
      - "tests/test_formal_decision_production_e2e.py"
      - "docs/Formal Decision执行与用户回复协议.md"
      - "docs/生产变更与并发写入协议_V1.0.md"
      - ".github/workflows/decision-notification.yml"
  push:
    branches: [main]
    paths:
      - "scripts/formal_entry_contract.py"
      - "scripts/notification_center.py"
      - "scripts/business_decision_source.py"
      - "scripts/process_state_sync_request.py"
      - "scripts/formal_entry_contract.py"
      - "scripts/build_query_context.py"
      - "scripts/runtime_self_heal.py"
      - "scripts/build_e2e_status.py"
      - "scripts/report_delivery_request.py"
      - "tests/test_formal_decision_production_e2e.py"
      - "docs/Formal Decision执行与用户回复协议.md"
      - "docs/生产变更与并发写入协议_V1.0.md"
      - ".github/workflows/decision-notification.yml"
      - "tests/test_formal_decision_e2e_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('etf-formal-decision-e2e-pr-{0}', github.event.pull_request.number) || 'etf-main-canonical-writer' }}
  cancel-in-progress: false

jobs:
  formal-decision-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - name: Verify acceptance source SHA
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD_SHA=$HEAD_SHA"
          echo "PR_HEAD_SHA=$PR_HEAD_SHA"
          echo "BASE_SHA=$BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "acceptance checkout SHA does not match PR head" >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run three-entry and REPORT handoff contract acceptance
        run: |
          python -m unittest -v tests.test_formal_decision_e2e_contract
      - name: Run controlled three-entry production handoff acceptance
        run: |
          python -m unittest -v tests.test_formal_decision_production_e2e
      - name: Run notification workflow structural acceptance
        run: |
          python -m unittest -v tests.test_notification_workflow_structure
      - name: Assert acceptance scope
        run: |
          test -f scripts/formal_entry_contract.py
          test -f scripts/notification_center.py
          test -f scripts/business_decision_source.py
          test -f scripts/process_state_sync_request.py
          test -f scripts/notification_center.py
          echo "Formal Decision automated E2E acceptance scope verified"
      - name: Persist merged-main acceptance identity
        run: |
          mkdir -p "$RUNNER_TEMP/formal-decision-acceptance"
          python - <<'PY' > "$RUNNER_TEMP/formal-decision-acceptance/result.json"
          import json, os
          print(json.dumps({
              "input_sha": os.environ["GITHUB_SHA"],
              "acceptance_sha": os.environ["GITHUB_SHA"],
              "final_main_sha": os.environ["GITHUB_SHA"],
              "sha_stable": True,
              "state_write_commits": [],
              "acceptance_window_id": f"acceptance:{os.environ['GITHUB_RUN_ID']}:{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}",
              "writer_runs_during_window": [],
              "blocked_or_isolated_writers": ["etf-main-canonical-writer"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "status": "MERGED_BUT_NOT_ACCEPTED",
              "acceptance_scope": "CONTRACT_ONLY_AND_CONTROLLED_SIMULATION",
              "real_production_evidence": "MISSING",
              "entry_results": {
                  "CHATGPT_MANUAL_FORMAL_ANALYSIS": "REAL_PRODUCTION_EVIDENCE_MISSING",
                  "CHATGPT_MANUAL_SCHEDULED_FORMAL_ANALYSIS": "REAL_PRODUCTION_EVIDENCE_MISSING",
                  "CHATGPT_SCHEDULED_FORMAL_ANALYSIS": "REAL_PRODUCTION_EVIDENCE_MISSING",
              },
              "pushplus": "UNVERIFIED_EXTERNAL_SEND",
          }))
          PY
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: formal-decision-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-decision-acceptance/result.json
