name: Formal Decision business contract

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/formal_entry_contract.py"
      - "scripts/notification_center.py"
      - "scripts/business_decision_source.py"
      - "scripts/process_state_sync_request.py"
      - "scripts/build_query_context.py"
      - "scripts/runtime_self_heal.py"
      - "scripts/build_e2e_status.py"
      - "scripts/report_delivery_request.py"
      - "scripts/manual_formal_decision_completion.py"
      - "tests/test_formal_decision_e2e_contract.py"
      - "tests/test_formal_decision_production_e2e.py"
      - "tests/test_formal_decision_production_source.py"
      - "docs/Formal Decision执行与用户回复协议.md"
      - ".github/workflows/decision-notification.yml"
      # Stable PR business-CI coverage: source, tests, protocols and workflow changes
      # must not silently receive zero checks. This remains contract-only and
      # never reads or writes dynamic production state.
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - fix/formal-decision-final-content-pushplus-closure-v2
    paths:
      - "scripts/formal_entry_contract.py"
      - "scripts/notification_center.py"
      - "scripts/business_decision_source.py"
      - "scripts/process_state_sync_request.py"
      - "scripts/formal_entry_contract.py"
      - "scripts/build_query_context.py"
      - "scripts/runtime_self_heal.py"
      - "scripts/build_e2e_status.py"
      - "scripts/report_delivery_request.py"
      - "scripts/manual_formal_decision_completion.py"
      - "tests/test_formal_decision_production_e2e.py"
      - "tests/test_formal_decision_production_source.py"
      - "docs/Formal Decision执行与用户回复协议.md"
      - "docs/生产变更与并发写入协议_V1.0.md"
      - ".github/workflows/decision-notification.yml"
      - "tests/test_formal_decision_e2e_contract.py"
      - ".github/workflows/formal-decision-e2e-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Independent ordinary PR CI: compile and run directly affected regression tests.
  # This remains in the existing PR workflow; it does not read or write production state
  # and is separate from the Formal Decision business contract job.
  ordinary-pr-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile affected Python modules
        run: |
          python -m py_compile \
            scripts/notification_center.py \
            scripts/process_state_sync_request.py \
            scripts/scheduled_review_completion.py \
            scripts/user_visible_presentation.py
      - name: Run affected notification and contract tests
        run: |
          python -m unittest -v \
            tests.test_notification_active_report_contract \
            tests.test_formal_decision_e2e_contract

  formal-decision-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile production Python modules
        shell: bash
        run: python -m compileall -q scripts
      - name: Run three-entry and REPORT handoff contract acceptance
        run: |
          python -m unittest -v tests.test_formal_decision_e2e_contract
      - name: Run controlled three-entry production handoff acceptance
        run: |
          python -m unittest -v tests.test_formal_decision_production_e2e
      - name: Run notification workflow structural acceptance
        run: |
          python -m unittest -v tests.test_notification_workflow_structure
      - name: Assert acceptance scope
        run: |
          test -f scripts/formal_entry_contract.py
          test -f scripts/notification_center.py
          test -f scripts/business_decision_source.py
          test -f scripts/process_state_sync_request.py
          test -f scripts/notification_center.py
          echo "Formal Decision automated E2E acceptance scope verified"

