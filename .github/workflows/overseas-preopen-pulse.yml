name: Overseas pre-open pulse

on:
  workflow_dispatch:
  # During the overlapping A-share/APAC session, a newly published canonical
  # A-share CURRENT is an independent, event-driven wake-up for the same APAC
  # workflow. This reduces reliance on GitHub schedule punctuality without
  # creating a second market-data, event, dedupe, or PushPlus implementation.
  push:
    branches: [main]
    paths:
      - "data/state/CURRENT.json"
      # A GLOBAL request is a wake-up for every existing market-domain
      # producer.  The overseas workflow remains the sole APAC owner.
      - "requests/live_snapshot/**global*.json"
  schedule:
    # Unified ten-minute pulse clock with Beijing boundary coverage 07:55-16:05.
    # Boundary pulses run for pre-open/tail context; market calendars and phases
    # decide whether an object is a valid market fact or outside its session.
    - cron: "55 23 * * 0-4" # Beijing 07:55 Mon-Fri
    - cron: "5,15,25,35,45,55 0-7 * * 1-5" # Beijing 08:05-15:55 Mon-Fri
    - cron: "5 8 * * 1-5" # Beijing 16:05 Mon-Fri

permissions:
  contents: write

concurrency:
  group: etf-overseas-preopen-pulse
  cancel-in-progress: false

jobs:
  overseas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      SCHEDULED_FOR: ${{ github.event.schedule || github.event_name }}
      SCHEDULED_CRON: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase pulse workspace before provider calls
        run: |
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve scheduled pulse slot
        id: pulse_gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from scripts.scheduled_pulse_slot import resolve_scheduled_pulse
          pulse = resolve_scheduled_pulse(
              os.environ.get("SCHEDULED_CRON", ""),
              datetime.now(timezone.utc),
              cadence_seconds=600,
              occurrence_id=os.environ.get("GITHUB_RUN_ID", ""),
          )
          eligible = os.environ.get("GITHUB_EVENT_NAME") != "schedule" or pulse["eligible"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"eligible={'true' if eligible else 'false'}\n")
              for key, value in pulse.items(): handle.write(f"{key}={' ' if value is None else value}\n")
          print({"eligible": eligible, **pulse})
          PY

      - uses: actions/setup-node@v7
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        with:
          node-version: "22"
      - name: Install hithink-finance CLI
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: npm install --global @hithink-tech/hithink-finance-cli
      - name: Preserve previous APAC pulse for sudden-move comparison
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: |
          [ -f data/state/overseas_context.json ] && cp data/state/overseas_context.json data/state/overseas_context_previous.json || true
          python -c 'import json; from pathlib import Path; p=Path("data/state/hyperliquid_pulse_latest.json"); old=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; latest=old.get("latest") or {}; Path("/tmp/previous-hyperliquid-generation.txt").write_text(str(latest.get("generation_identity") or latest.get("identity") or ""), encoding="utf-8")'
      - name: Select Hyperliquid collection tier
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: |
          if [ "${SCHEDULED_CRON}" = "55 23 * * 0-4" ] || [ "${SCHEDULED_CRON}" = "5 8 * * 1-5" ]; then
            echo "HYPERLIQUID_COLLECTION_MODE=FULL" >> "$GITHUB_ENV"
          else
            echo "HYPERLIQUID_COLLECTION_MODE=CORE" >> "$GITHUB_ENV"
          fi
      - name: Refresh formal overseas and Asia-Pacific index context
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: python scripts/build_overseas_context.py
      - name: Verify Hyperliquid pulse persistence
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: python scripts/validate_hyperliquid_pulse_persistence.py
      - name: Verify Hyperliquid node was regenerated for this pulse
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          context = json.loads(Path("data/state/overseas_context.json").read_text(encoding="utf-8"))
          hyperliquid = context.get("hyperliquid") or {}
          current = str(hyperliquid.get("generation_identity") or "").strip()
          if not current or hyperliquid.get("regeneration_required") is not True:
              raise SystemExit("Hyperliquid pulse did not publish a regeneration identity")
          previous = Path("/tmp/previous-hyperliquid-generation.txt").read_text(encoding="utf-8").strip()
          if previous and current == previous:
              raise SystemExit("Hyperliquid pulse reused the previous generation identity")
          print({"generation_identity": current, "previous": previous or None})
          PY
      - name: Refresh US extended-hours context
        if: ${{ steps.pulse_gate.outputs.eligible == 'true' }}
        run: python scripts/build_us_extended_hours_context.py
      - name: Record overseas pulse runtime health
        if: always()
        env:
          SCHEDULED_SLOT_AT: ${{ steps.pulse_gate.outputs.scheduled_slot_at }}
          SCHEDULE_DELAY_SECONDS: ${{ steps.pulse_gate.outputs.schedule_delay_seconds }}
          SCHEDULE_DELAY_CLASS: ${{ steps.pulse_gate.outputs.schedule_delay_class }}
          NATURAL_PULSE_IDENTITY: ${{ steps.pulse_gate.outputs.natural_pulse_identity }}
          NATURAL_PULSE_IDENTITY_STATUS: ${{ steps.pulse_gate.outputs.natural_pulse_identity_status }}
          NATURAL_PULSE_ELIGIBLE: ${{ steps.pulse_gate.outputs.natural_pulse_eligible }}
          PULSE_GATE_ELIGIBLE: ${{ steps.pulse_gate.outputs.eligible }}
        run: python scripts/build_overseas_runtime_health.py
      # Decision preparation is request-bound/recovery-owned. A scheduled
      # overseas fact pulse publishes canonical market facts and health only;
      # formal requests rebuild query_context from those facts when needed.
      - name: Commit overseas contexts and runtime health
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/overseas_context.json data/state/us_extended_hours_context.json data/state/overseas_runtime_health.json
          [ -f data/state/overseas_context_previous.json ] && git add data/state/overseas_context_previous.json || true
          # Keep the bounded recent pulse index as the canonical PIT readback source.
          [ -f data/state/hyperliquid_pulse_index.json ] && git add data/state/hyperliquid_pulse_index.json || true
          [ -f data/state/hyperliquid_pulse_latest.json ] && git add data/state/hyperliquid_pulse_latest.json || true
          [ -f data/state/discovery_pulse_latest.json ] && git add data/state/discovery_pulse_latest.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh overseas pulse and notifications"
          # Builders/audits may touch unrelated tracked state. Only the owned pulse
          # commit is allowed to participate in the rebase/push transaction.
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
