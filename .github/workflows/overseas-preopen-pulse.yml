name: Overseas pre-open pulse

on:
  workflow_dispatch:
  schedule:
    # UTC / Beijing time.
    # 23:00-23:50 UTC previous day = Beijing 07:00-07:50.
    - cron: "*/10 23 * * 0-4"
    # 00:00-00:50 UTC = Beijing 08:00-08:50.
    - cron: "*/10 0 * * 1-5"
    # 01:00/01:10 UTC = Beijing 09:00/09:10.
    - cron: "0,10 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-overseas-preopen-pulse
  cancel-in-progress: false

jobs:
  overseas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      SCHEDULED_FOR: ${{ github.event.schedule || github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run system consistency preflight
        run: python scripts/check_system_consistency.py
      - name: Refresh formal overseas and Asia index context
        run: python scripts/build_overseas_context.py
      - name: Refresh US extended-hours context
        run: python scripts/build_us_extended_hours_context.py
      - name: Record overseas pulse runtime health
        if: always()
        run: python scripts/build_overseas_runtime_health.py
      - name: Rebuild on-demand query context
        if: success()
        run: python scripts/build_query_context.py
      - name: Commit overseas contexts and runtime health
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/overseas_context.json data/state/us_extended_hours_context.json data/state/query_context.json data/state/overseas_runtime_health.json data/state/runtime_health.json data/state/system_consistency.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh overseas pulse and runtime health"
          git pull --rebase origin main
          git push origin HEAD:main
