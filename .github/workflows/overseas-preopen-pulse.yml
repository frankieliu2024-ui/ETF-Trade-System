name: Overseas pre-open pulse

on:
  workflow_dispatch:
  # During the overlapping A-share/APAC session, a newly published canonical
  # A-share CURRENT is an independent, event-driven wake-up for the same APAC
  # workflow. This reduces reliance on GitHub schedule punctuality without
  # creating a second market-data, event, dedupe, or PushPlus implementation.
  push:
    branches: [main]
    paths:
      - "data/state/CURRENT.json"
  schedule:
    # UTC / Beijing time.
    # 20:15/20:30 UTC = Beijing 04:15/04:30. Independent schedule backstop for
    # the fixed US cash-session close summary if the dedicated US pulse misses.
    - cron: "15,30 20 * * 1-5"
    # 23:00-23:50 UTC previous day = Beijing 07:00-07:50.
    - cron: "*/10 23 * * 0-4"
    # 00:00-07:50 UTC = Beijing 08:00-15:50, covering Asia-Pacific sessions.
    - cron: "*/10 0-7 * * 1-5"
    # 08:00-08:30 UTC = Beijing 16:00-16:30, covering APAC close after Hong Kong.
    - cron: "0,10,20,30 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-overseas-preopen-pulse
  cancel-in-progress: false

jobs:
  overseas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      SCHEDULED_FOR: ${{ github.event.schedule || github.event_name }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase pulse workspace before provider calls
        run: |
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install hithink-finance CLI
        run: npm install --global @hithink-tech/hithink-finance-cli
      - name: Run system consistency live audit without retaining audit state
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/check_system_consistency.py
          rc=$?
          git restore --worktree --staged data/state/system_consistency.json 2>/dev/null || git checkout -- data/state/system_consistency.json || true
          exit $rc
      - name: Preserve previous APAC pulse for sudden-move comparison
        run: |
          [ -f data/state/overseas_context.json ] && cp data/state/overseas_context.json /tmp/overseas_context_prev.json || true
      - name: Refresh formal overseas and Asia-Pacific index context
        run: python scripts/build_overseas_context.py
      - name: Refresh US extended-hours context
        run: python scripts/build_us_extended_hours_context.py
      - name: Backstop US regular-session open/close summary from refreshed context
        id: us_summary_notify
        continue-on-error: true
        run: python scripts/send_us_session_summary.py
      - name: Send value-driven APAC opening signal or fixed close summary when due
        id: apac_summary_notify
        continue-on-error: true
        run: python scripts/send_regional_session_summary.py --market apac
      - name: Send APAC monitored-object value event when due
        id: apac_shock_notify
        continue-on-error: true
        env:
          PREVIOUS_CONTEXT_PATH: /tmp/overseas_context_prev.json
        run: python scripts/send_market_shock_notification.py --market asia
      - name: Record overseas pulse runtime health
        if: always()
        run: python scripts/build_overseas_runtime_health.py
      - name: Rebuild on-demand query context
        if: success()
        run: python scripts/build_query_context.py
      - name: Commit overseas contexts, notifications and runtime health
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/overseas_context.json data/state/us_extended_hours_context.json data/state/query_context.json data/state/overseas_runtime_health.json data/state/notification_center.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh overseas pulse and notifications"
          # Builders/audits may touch unrelated tracked state. Only the owned pulse
          # commit is allowed to participate in the rebase/push transaction.
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Surface market notification delivery failure without blocking market data
        if: ${{ steps.us_summary_notify.outcome == 'failure' || steps.apac_summary_notify.outcome == 'failure' || steps.apac_shock_notify.outcome == 'failure' }}
        run: |
          echo "Market notification delivery failed; refreshed market data remains valid."
          exit 1
