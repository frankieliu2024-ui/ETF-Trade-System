name: One-off formal risk precedence repair retry

on:
  push:
    paths:
      - '.github/workflows/oneoff-risk-precedence-repair-retry.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse validated patch body and run scoped gates
        shell: bash
        run: |
          awk '/python - <<.PY./ {capture=1; next} capture && /^          PY$/ {exit} capture {sub(/^          /, ""); print}' .github/workflows/oneoff-risk-precedence-repair.yml > /tmp/risk_patch.py
          python /tmp/risk_patch.py
          python -m py_compile scripts/process_state_sync_request.py scripts/build_e2e_status.py scripts/check_system_consistency.py
          python scripts/build_e2e_status.py >/tmp/e2e.json
          python -m unittest discover -s tests -p 'test_market_*.py'
          python -m unittest discover -s tests -p 'test_state_sync*.py'
          python -m unittest discover -s tests -p 'test_notification*.py'
          git diff --check
      - name: Commit production repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/process_state_sync_request.py scripts/build_e2e_status.py scripts/check_system_consistency.py ETF当前状态_DASHBOARD.md data/state/e2e_status.json
          git commit -m 'fix: enforce formal ETF risk precedence and auto-reconcile e2e'
          git pull --rebase origin main
          git push origin HEAD:main
