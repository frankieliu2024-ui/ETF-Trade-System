name: Share-flow formal integration verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requests/research_backfill/share_flow_formal_integration_verify.txt"

permissions:
  contents: write

concurrency:
  group: share-flow-formal-integration-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build share-flow evidence and state context
        run: |
          python scripts/build_etf_share_flow_evidence.py
          python scripts/build_state_context.py
      - name: Enforce formal research boundary and wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/state/etf_share_flow_evidence.json').read_text(encoding='utf-8'))
          d=json.loads(Path('data/state/decision_context.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/state/research_context.json').read_text(encoding='utf-8'))
          assert e['status'] == 'READY'
          assert e['use_in_current_decision'] is True
          assert e['decision_eligible'] is False
          assert e['trade_signal'] is None
          assert e['trial_confirm'] is None
          assert e['portfolio_target'] is None
          assert e['master_override'] is False
          assert e['capital_efficiency_score'] is None
          assert d['research_evidence']['etf_share_flow_evidence']['status'] == e['status']
          assert d['etf_share_flow_evidence_file'] == 'data/state/etf_share_flow_evidence.json'
          assert r['paths']['etf_share_flow_evidence'] == 'data/state/etf_share_flow_evidence.json'
          print(json.dumps({'status':e['status'],'coverage':e.get('coverage'),'use_in_current_decision':e.get('use_in_current_decision'),'price_as_of_market_date':e.get('price_as_of_market_date'),'top3':[(x['display_name'],x['conditional_increment_rank']) for x in (e.get('items') or [])[:3]]},ensure_ascii=False))
          PY
      - name: Commit formal read-only evidence wiring artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/etf_share_flow_evidence.json data/state/research_context.json data/state/decision_context.json data/state/dashboard_update_candidate.json data/state/research_evidence_delta.json data/state/execution_quality.json data/state/skfolio_risk_evidence.json data/state/research_master_candidates.json data/state/intraday_path_features.json data/state/provider_metrics.json data/state/relative_strength.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: publish minimal ETF share-flow evidence"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
