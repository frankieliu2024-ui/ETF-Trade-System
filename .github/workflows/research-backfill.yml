name: ETF research historical backfill

on:
  push:
    branches:
      - main
    paths:
      - "requests/research_backfill/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: "Research backfill request JSON path"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: etf-research-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run requested historical research backfill
        shell: bash
        env:
          INPUT_REQUEST_PATH: ${{ github.event.inputs.request_path || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REQUEST_PATH" ]; then
            python scripts/backfill_research_daily_history.py "$INPUT_REQUEST_PATH"
          else
            files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/research_backfill/*.json')
            test -n "$files"
            for f in $files; do
              python scripts/backfill_research_daily_history.py "$f"
            done
          fi
      - name: Commit compact historical research facts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- events/research/daily_features data/state/historical_backfill_status.json data/market/audit/research_backfill
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: backfill ETF daily evidence"
          git pull --rebase origin main
          git push origin HEAD:main
