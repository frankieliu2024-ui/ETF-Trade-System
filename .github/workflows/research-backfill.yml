name: ETF research historical backfill

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Research backfill request JSON path"
        required: true
        default: "requests/research_backfill/20260824_stage1.json"

permissions:
  contents: write

concurrency:
  group: etf-research-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run requested historical research backfill
        run: python scripts/backfill_research_daily_history.py "${{ github.event.inputs.request_path }}"
      - name: Commit compact historical research facts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- events/research/daily_features data/state/historical_backfill_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: backfill ETF daily evidence"
          git pull --rebase origin main
          git push origin HEAD:main
