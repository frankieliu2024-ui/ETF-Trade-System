name: Low-cost alpha validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/low-cost-alpha-validation-20260828
    paths:
      - "scripts/run_low_cost_alpha_batch1.py"
      - "scripts/run_low_cost_alpha_batch1_regime_recheck.py"
      - "scripts/run_margin_feedback_interaction.py"
      - ".github/workflows/low-cost-alpha-validation.yml"

permissions:
  contents: read

concurrency:
  group: etf-low-cost-alpha-validation
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas requests akshare
      - name: Compile
        run: python -m py_compile scripts/run_low_cost_alpha_batch1.py scripts/run_low_cost_alpha_batch1_regime_recheck.py scripts/run_margin_feedback_interaction.py
      - name: Run hypotheses 1-4
        working-directory: scripts
        run: |
          python run_low_cost_alpha_batch1.py
          python run_low_cost_alpha_batch1_regime_recheck.py
      - name: Run hypothesis 5 margin interaction
        working-directory: scripts
        run: python run_margin_feedback_interaction.py
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: low-cost-alpha-validation-${{ github.run_id }}
          path: |
            research/backtests/low_cost_alpha_batch1_validation.json
            research/backtests/low_cost_alpha_batch1_regime_recheck.json
            research/backtests/margin_feedback_interaction_validation.json
          if-no-files-found: error
          retention-days: 14
