name: One-off align runtime canonical facts 20260827
on:
  push:
    paths:
      - ".github/workflows/oneoff-align-runtime-canonical-facts-20260827.yml"
permissions:
  contents: write
concurrency:
  group: production-main-writer
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Align canonical runtime facts
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) CURRENT: remove stale hard-coded rule version and refresh canonical
          # rule/trade references whenever CURRENT is updated.
          p=Path('scripts/state_manager.py')
          s=p.read_text(encoding='utf-8')
          old='''        "last_trade_event_id": "", "rules_version": "V2.2.16", "generated_at": "",\n'''
          new='''        "last_trade_event_id": "", "rules_version": "", "generated_at": "",\n'''
          if old not in s:
              raise RuntimeError('state_manager default version anchor not found')
          s=s.replace(old,new,1)
          old='''    current["account_fact"] = {k: account.get(k, "") for k in ("status", "updated_at", "source")}\n    current["needs_account_update"] = account["status"] != "VALID"\n    current["generated_at"] = now_utc()\n'''
          new='''    current["account_fact"] = {k: account.get(k, "") for k in ("status", "updated_at", "source")}\n    current["needs_account_update"] = account["status"] != "VALID"\n    master = root / "ETF规则_MASTER.md"\n    if master.exists():\n        first = master.read_text(encoding="utf-8").splitlines()[0] if master.stat().st_size else ""\n        current["rules_version"] = next((x for x in first.split() if x.startswith("V") and x[1:2].isdigit()), current.get("rules_version", ""))\n    formal_action = account.get("formal_action") or {}\n    if str(formal_action.get("execution_status") or "").upper() == "EXECUTED" and formal_action.get("last_executed_event_id"):\n        current["last_trade_event_id"] = str(formal_action.get("last_executed_event_id"))\n    current["generated_at"] = now_utc()\n'''
          if old not in s:
              raise RuntimeError('state_manager update_current anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) Phase4: formal risk comes from E2E's authoritative formal-review
          # reconciliation, not the stale historical reconstruction file.
          p=Path('scripts/build_phase4_automation.py')
          s=p.read_text(encoding='utf-8')
          old='''    risk = ((equity.get("summary") or {}).get("known_net_current_strategy_return_pct"))\n    zone = _risk_zone(risk)\n'''
          new='''    risk = ((((e2e.get("components") or {}).get("risk") or {}).get("etf_strategy_risk_pct")))\n    if risk is None:\n        risk = ((equity.get("summary") or {}).get("known_net_current_strategy_return_pct"))\n    zone = _risk_zone(risk)\n'''
          if old not in s:
              raise RuntimeError('phase4 trigger risk anchor not found')
          s=s.replace(old,new,1)
          old='''    risk = ((equity.get("summary") or {}).get("known_net_current_strategy_return_pct"))\n    risk_zone = _risk_zone(risk)\n'''
          new='''    risk = ((((e2e.get("components") or {}).get("risk") or {}).get("etf_strategy_risk_pct")))\n    if risk is None:\n        risk = ((equity.get("summary") or {}).get("known_net_current_strategy_return_pct"))\n    risk_zone = _risk_zone(risk)\n'''
          if old not in s:
              raise RuntimeError('phase4 ranking risk anchor not found')
          s=s.replace(old,new,1)

          # 3) Account-trigger semantics: only recent, unresolved position/cash facts
          # can trigger reassessment. Mark-to-market fields and reconciled trades are ignored.
          anchor='''def _display(name: Any, code: Any) -> str:\n    return f"{name}（{code}）" if name and code else str(code or name or "未知标的")\n\n\ndef _quality(row: dict) -> str:\n'''
          helper='''def _display(name: Any, code: Any) -> str:\n    return f"{name}（{code}）" if name and code else str(code or name or "未知标的")\n\n\ndef _material_unreconciled_account_changes(account: dict) -> list[dict]:\n    ignored = {"total_asset", "stock_market_value", "market_value", "holding_pnl", "daily_pnl", "daily_pnl_pct"}\n    cutoff = datetime.now(TZ) - timedelta(minutes=30)\n    rows = []\n    for event in account.get("account_change_events_after_confirmed_at") or []:\n        if str(event.get("reconciliation_status") or "").upper() != "UNRECONCILED_ACCOUNT_CHANGE":\n            continue\n        obj = str(event.get("object") or "").strip()\n        if obj in ignored:\n            continue\n        try:\n            event_time = datetime.fromisoformat(str(event.get("event_time") or event.get("occurred_at") or "").replace("Z", "+00:00"))\n            if event_time.tzinfo is None:\n                event_time = event_time.replace(tzinfo=TZ)\n            event_time = event_time.astimezone(TZ)\n        except ValueError:\n            continue\n        if event_time < cutoff:\n            continue\n        if event.get("code") and abs(float(event.get("quantity_delta") or 0)) > 0:\n            rows.append(event)\n        elif obj == "cash" and abs(float(event.get("amount_delta") or 0)) >= 10:\n            rows.append(event)\n    return rows\n\n\ndef _quality(row: dict) -> str:\n'''
          if anchor not in s:
              raise RuntimeError('phase4 account helper anchor not found')
          s=s.replace(anchor,helper,1)
          old='''    if account.get("account_change_events_after_confirmed_at"):\n        event = account["account_change_events_after_confirmed_at"][-1]\n'''
          new='''    account_changes = _material_unreconciled_account_changes(account)\n    if account_changes:\n        event = account_changes[-1]\n'''
          if old not in s:
              raise RuntimeError('phase4 account trigger anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and rebuild runtime state
        run: |
          python -m py_compile scripts/state_manager.py scripts/build_phase4_automation.py
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          from state_manager import update_current
          root=Path('.').resolve()
          cur=json.loads((root/'data/state/CURRENT.json').read_text(encoding='utf-8'))
          update_current(root=root, market_date=cur['market_date'], node=cur['latest_valid_node'], captured_at=cur['captured_at'], latest_snapshot=cur.get('latest_snapshot',''), snapshot_commit=cur.get('snapshot_commit',''), node_status=cur.get('node_status','READY'), data_freshness=cur.get('data_freshness') or {})
          PY
          python scripts/build_e2e_status.py
          python scripts/build_state_context.py
          python scripts/build_query_context.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('data/state')
          current=json.loads((s/'CURRENT.json').read_text(encoding='utf-8'))
          e2e=json.loads((s/'e2e_status.json').read_text(encoding='utf-8'))
          trig=json.loads((s/'decision_trigger.json').read_text(encoding='utf-8'))
          rank=json.loads((s/'capital_efficiency_ranking.json').read_text(encoding='utf-8'))
          assert current['rules_version']=='V2.2.18', current['rules_version']
          assert current['last_trade_event_id']=='20260827_100843_515880_buy', current['last_trade_event_id']
          assert e2e['components']['risk']['etf_strategy_risk_pct']==-7.69
          assert rank['risk_zone']=='RISK_OBSERVATION', rank['risk_zone']
          assert trig['risk_zone']=='RISK_OBSERVATION', trig['risk_zone']
          assert trig['trigger_type']!='ACCOUNT_STRUCTURE_CHANGED', trig
          print('canonical runtime facts PASS')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/state_manager.py scripts/build_phase4_automation.py data/state/CURRENT.json data/state/e2e_status.json data/state/decision_trigger.json data/state/capital_efficiency_ranking.json data/state/dashboard_update_candidate.json data/state/decision_context.json data/state/query_context.json data/state/intraday_path_features.json data/state/market_regime_context.json data/state/market_structure_context.json data/state/research_context.json data/state/research_evidence_delta.json data/state/research_execution_summary.json data/state/research_master_candidates.json data/state/execution_quality.json data/state/skfolio_risk_evidence.json events/research/daily_features/2026-08-27.json || true
          git commit -m "fix: align runtime state with canonical formal facts"
          git push origin HEAD:main
