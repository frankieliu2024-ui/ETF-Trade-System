name: ETF minute source PoC

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/minute_source_capability_poc.py"
      - ".github/workflows/minute-source-poc.yml"

permissions:
  contents: write

concurrency:
  group: etf-minute-source-poc
  cancel-in-progress: false

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase before PoC
        run: |
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile PoC
        run: python -m py_compile scripts/minute_source_capability_poc.py
      - name: Run ETF minute source PoC
        run: python scripts/minute_source_capability_poc.py
      - name: Commit PoC result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/minute_source_poc.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: record ETF minute source PoC"
          git pull --rebase origin main
          git push origin HEAD:main
