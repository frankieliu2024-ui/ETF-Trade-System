name: 561980 index rebalance PIT research

on:
  push:
    branches:
      - research/561980-index-rebalance-pit-20260829
    paths:
      - 'research/backtests/audit_931865_rebalance_sources.py'
      - '.github/workflows/561980-index-rebalance-pit-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebalance-source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile research script
        run: python -m py_compile research/backtests/audit_931865_rebalance_sources.py
      - name: Audit official 931865 rebalance sources
        run: |
          mkdir -p /tmp/931865-audit
          python research/backtests/audit_931865_rebalance_sources.py --out /tmp/931865-audit
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: 931865-rebalance-source-audit
          path: /tmp/931865-audit
          retention-days: 14
