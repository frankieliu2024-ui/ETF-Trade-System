name: ETF consistency validation probe

on:
  push:
    branches: [main]
    paths:
      - "requests/consistency_probe.txt"

permissions:
  contents: write

concurrency:
  group: etf-consistency-validation-probe
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical consistency checks
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/check_system_consistency.py
          rc1=$?
          python scripts/check_research_integration.py
          rc2=$?
          echo "rc1=$rc1" >> "$GITHUB_OUTPUT"
          echo "rc2=$rc2" >> "$GITHUB_OUTPUT"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            exit 1
          fi
      - name: Persist canonical consistency state
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/system_consistency.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "state: refresh system consistency"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce validation result
        if: ${{ steps.checks.outcome == 'failure' }}
        run: exit 1
