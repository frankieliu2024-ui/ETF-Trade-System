name: actions-node24-upgrade-temp

on:
  push:
    branches:
      - maintenance/actions-node24-runtime-20260827
    paths:
      - "scripts/apply_actions_node24_upgrade_temp.py"

permissions:
  contents: write

concurrency:
  group: actions-node24-upgrade-temp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build Node 24 workflow mirrors
        run: python scripts/apply_actions_node24_upgrade_temp.py
      - name: Verify deprecated action majors are gone in transformed workspace
        shell: bash
        run: |
          if git grep -n -E 'actions/checkout@v4|actions/setup-python@v5' -- '.github/workflows/*.yml' '.github/workflows/*.yaml'; then
            echo 'Deprecated Node 20 action major remains' >&2
            exit 1
          fi
      - name: Validate production mutation protocol against transformed workspace
        run: python scripts/check_production_mutation_protocol.py
      - name: Persist only validated mirrors and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows
          git add maintenance/actions_node24_workflows.json maintenance/actions_node24_blobs
          if git diff --cached --quiet; then
            echo 'No validated mirrors generated' >&2
            exit 1
          fi
          git commit -m "ops: persist validated Node 24 workflow mirrors"
          git push origin HEAD:maintenance/actions-node24-runtime-20260827
