name: ETF trade fact correction

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Path of one bounded trade-fact correction request"
        required: true
        type: string
  push:
    paths:
      - "requests/trade_fact_correction/*.json"

permissions:
  contents: write

concurrency:
  group: etf-main-state-writer
  cancel-in-progress: false

jobs:
  correction:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve one correction request
        id: request
        shell: bash
        env:
          INPUT_REQUEST_PATH: ${{ github.event.inputs.request_path || '' }}
        run: |
          set -euo pipefail
          request="$INPUT_REQUEST_PATH"
          if [ -z "$request" ]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/trade_fact_correction/*.json')
            if [ "${#changed[@]}" -ne 1 ]; then
              echo "Expected exactly one trade-fact correction request, got ${#changed[@]}" >&2
              exit 1
            fi
            request="${changed[0]}"
          fi
          case "$request" in requests/trade_fact_correction/*.json) ;; *) echo "invalid correction request path" >&2; exit 1;; esac
          test -f "$request"
          echo "request_path=$request" >> "$GITHUB_OUTPUT"
      - name: Apply confirmed trade fact corrections
        run: python scripts/apply_trade_fact_correction.py "${{ steps.request.outputs.request_path }}"
      - name: Verify correction scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only
          git diff --name-only | grep -E '^(events/trades/|data/state/execution_quality.json|data/state/trade_fact_correction_receipt.json|ETF交易复盘与经验库_2026.md|ETF市场行情档案_2026.md)' >/dev/null
          if git diff --name-only | grep -E '^(data/state/account_fact.json|data/state/CURRENT.json|ETF当前状态_DASHBOARD.md)$'; then
            echo "trade-fact correction touched account/current/dashboard state" >&2
            exit 1
          fi
      - name: Commit correction projection
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- events/trades data/state/execution_quality.json data/state/trade_fact_correction_receipt.json ETF交易复盘与经验库_2026.md ETF市场行情档案_2026.md requests/trade_fact_correction
          git diff --cached --quiet && exit 0
          git commit -m "maint: apply bounded trade fact correction"
          git push origin HEAD:main

