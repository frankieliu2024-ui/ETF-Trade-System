name: ordinary-pr-ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Every PR targeting main must create an independent current-head run.
  # Scope decisions belong inside the job; top-level paths filtering silently
  # suppresses required checks for otherwise valid business PRs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etf-ordinary-pr-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ordinary-pr-ci:
    name: ordinary-pr-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile affected Python modules
        run: |
          python -m py_compile \
            scripts/notification_center.py \
            scripts/process_state_sync_request.py \
            scripts/scheduled_review_completion.py \
            scripts/run_scheduled_system_review_actor.py \
            scripts/user_visible_presentation.py \
            scripts/build_e2e_status.py \
            scripts/check_system_consistency.py \
            scripts/check_system_consistency_core.py \
            scripts/semantic_latest_main.py \
            scripts/state_manager.py
      - name: Run affected notification, contract, and state-consistency tests
        run: |
          python -m unittest -v \
            tests.test_notification_active_report_contract \
            tests.test_formal_decision_e2e_contract \
            tests.test_post_close_review_canonical \
            tests.test_market_risk_metric_guard \
            tests.test_workflow_sha_snapshot \
            tests.test_dashboard_projection \
            tests.test_system_review_notification_run_readback
