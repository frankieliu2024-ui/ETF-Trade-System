name: ETF runtime self-healing watchdog

on:
  workflow_dispatch:
  # External wake-only ingress for #385. The comment carries no market data;
  # it only awakens this existing canonical watchdog when the marker matches.
  issue_comment:
    types: [created]
  # Existing producer completions are event-driven wake opportunities for the
  # same watchdog. They do not add a producer, state store, or recovery path.
  workflow_run:
    workflows:
      - "ETF market snapshot"
      - "ETF opening-auction CURRENT fallback"
      - "Overseas pre-open pulse"
      - "US extended-hours pulse"
      - "ETF system consistency"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "ETF规则_MASTER.md"
      - "scripts/runtime_self_heal.py"
      - "scripts/production_health_guard.py"
      - "config/runtime_policy.json"
      - ".github/workflows/self-healing-watchdog.yml"
      - ".github/workflows/us-extended-hours-pulse.yml"
      - ".github/workflows/overseas-preopen-pulse.yml"
  schedule:
    # Beijing 08:07-09:07: cover APAC open before the A-share watchdog starts.
    - cron: "7,27,47 0 * * 1-5"
    - cron: "7 1 * * 1-5"
    # Beijing 09:19-09:59: redundant watchdog offset from production snapshot cron.
    - cron: "19,29,39,49,59 1 * * 1-5"
    # Beijing 10:04-10:54.
    - cron: "4,14,24,34,44,54 2 * * 1-5"
    # Beijing 11:04-11:34.
    - cron: "4,14,24,34 3 * * 1-5"
    # Beijing 13:04-14:54.
    - cron: "4,14,24,34,44,54 5-6 * * 1-5"
    # Beijing 15:04/15:14 close-grace watchdog.
    - cron: "4,14 7 * * 1-5"
    # Beijing 15:27-16:27: cover Hong Kong/APAC tail after A-share watchdog ends.
    - cron: "27,47 7 * * 1-5"
    - cron: "7,27 8 * * 1-5"
    # US pre-market/regular/post-market heartbeat guard. The Python gate below
    # checks America/New_York phase, so these broad UTC schedules are harmless
    # outside an active US session and automatically handle DST/standard time.
    - cron: "7,27,47 9-23 * * 1-5"
    - cron: "7,27,47 0-1 * * 2-6"

permissions:
  contents: write
  actions: write

concurrency:
  group: etf-runtime-self-healing-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    # issue_comment is a wake-only external ingress. Restrict it to Issue #385
    # and the exact prefix so ordinary issue/PR comments cannot run production.
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.number == 385 && startsWith(github.event.comment.body, '[ETF_L0_WAKE]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Assess deterministic runtime health
        id: assess
        shell: bash
        run: |
          python scripts/runtime_self_heal.py --assess
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('data/state/self_healing_status.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"action={data.get('recommended_action', 'NONE')}\n")
              f.write(f"classification={data.get('classification', 'UNKNOWN')}\n")
          print(f"classification={data.get('classification')} action={data.get('recommended_action')}")
          PY

      - name: Assess dedicated cross-market pulse heartbeats
        id: pulse_guard
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path('.')
          policy = json.loads((root/'config/runtime_policy.json').read_text(encoding='utf-8'))
          threshold = int(policy.get('degraded_max_age_seconds', 1500))
          now_utc = datetime.now(timezone.utc)
          now_bj = now_utc.astimezone(ZoneInfo('Asia/Shanghai'))
          now_et = now_utc.astimezone(ZoneInfo('America/New_York'))

          def parse(raw):
              if not raw:
                  return None
              try:
                  return datetime.fromisoformat(str(raw).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  return None

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          # APAC union activity window: Japan/Korea begin 08:00 Beijing; Hong Kong
          # is the last monitored market to close at 16:00 Beijing.
          bj_min = now_bj.hour * 60 + now_bj.minute
          apac_active = now_bj.weekday() < 5 and 8*60 <= bj_min < 16*60
          apac_health = load('data/state/overseas_runtime_health.json')
          apac_stamp = parse(apac_health.get('finished_at'))
          apac_age = int((now_utc-apac_stamp).total_seconds()) if apac_stamp else None
          need_apac = apac_active and (apac_age is None or apac_age > threshold)

          et_min = now_et.hour * 60 + now_et.minute
          us_active = now_et.weekday() < 5 and 4*60 <= et_min <= 20*60
          us_health = load('data/state/us_pulse_runtime_health.json')
          us_stamp = parse(us_health.get('finished_at'))
          us_age = int((now_utc-us_stamp).total_seconds()) if us_stamp else None

          # Fresh PRE_MARKET data must not suppress the first REGULAR pulse.
          def expected_us_phase(et_minute):
              if 4 * 60 <= et_minute < 9 * 60 + 30:
                  return "PRE_MARKET"
              if 9 * 60 + 30 <= et_minute < 16 * 60:
                  return "REGULAR"
              if 16 * 60 <= et_minute <= 20 * 60:
                  return "POST_MARKET"
              return None

          us_context = load('data/state/us_extended_hours_context.json')
          expected_phase = expected_us_phase(et_min)
          objects = us_context.get('objects') or {}

          def object_phase(code):
              item = objects.get(code) or {}
              latest = item.get('latest') or {}
              return str(item.get('market_phase_of_latest') or latest.get('session') or '').upper()

          def object_fresh(code):
              item = objects.get(code) or {}
              return str(item.get('freshness_status') or '').upper() == 'FRESH'

          if expected_phase == "REGULAR":
              phase_ready = all(object_phase(code) == "REGULAR" and object_fresh(code) for code in ("NDX", "SOX"))
          elif expected_phase in {"PRE_MARKET", "POST_MARKET"}:
              phase_ready = all(object_phase(code) == expected_phase and object_fresh(code) for code in ("QQQ", "SOXX"))
          else:
              phase_ready = True

          need_us = us_active and (us_age is None or us_age > threshold or not phase_ready)

          result = {
              'checked_at': now_utc.isoformat(timespec='seconds'),
              'threshold_seconds': threshold,
              'apac_active': apac_active,
              'apac_heartbeat_age_seconds': apac_age,
              'need_apac_dispatch': need_apac,
              'us_active': us_active,
              'us_heartbeat_age_seconds': us_age,
              'need_us_dispatch': need_us,
          }
          print(json.dumps(result, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"need_apac={'true' if need_apac else 'false'}\n")
              f.write(f"need_us={'true' if need_us else 'false'}\n")
          PY

      - name: Redispatch stale APAC pulse through canonical workflow
        if: ${{ steps.pulse_guard.outputs.need_apac == 'true' }}
        shell: bash
        run: |
          active=$(gh run list --workflow overseas-preopen-pulse.yml --limit 5 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" != "0" ]; then
            echo "APAC pulse already queued/in progress; no duplicate dispatch."
            exit 0
          fi
          gh workflow run overseas-preopen-pulse.yml --ref main
          echo "Dispatched canonical APAC pulse because dedicated heartbeat was stale."

      - name: Redispatch stale US pulse through canonical workflow
        if: ${{ steps.pulse_guard.outputs.need_us == 'true' }}
        shell: bash
        run: |
          active=$(gh run list --workflow us-extended-hours-pulse.yml --limit 5 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" != "0" ]; then
            echo "US pulse already queued/in progress; no duplicate dispatch."
            exit 0
          fi
          gh workflow run us-extended-hours-pulse.yml --ref main
          echo "Dispatched canonical US pulse because dedicated heartbeat was stale."

      - name: Recover missing US notification batch through canonical workflow
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'US extended-hours pulse' && github.event.workflow_run.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="${{ github.event.workflow_run.id }}"
          source_completed_at="${{ github.event.workflow_run.updated_at }}"
          sleep 10
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/decision-notification.yml/runs?per_page=30")"
          success_count=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            if echo "$jobs_json" | jq -e '.jobs[].steps[]? | select(.name == "Send US session summary when due" and .conclusion == "success")' >/dev/null; then
              success_count=1
              break
            fi
          done < <(echo "$runs_json" | jq -r --arg completed "$source_completed_at" '.workflow_runs[] | select(.created_at >= $completed) | .id')
          if [ "$success_count" = "1" ]; then
            echo "Primary US notification batch already executed; no fallback dispatch."
            exit 0
          fi
          active="$(echo "$runs_json" | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" != "0" ]; then
            echo "US notification consumer is queued/in progress; no duplicate fallback dispatch."
            exit 0
          fi
          gh workflow run decision-notification.yml --ref main -f recovery_market=us -f recovery_source_run_id="$source_run_id"
          echo "Dispatched canonical US notification batch fallback for pulse $source_run_id."

      - name: Run read-only comprehensive production health aggregate
        shell: bash
        run: |
          python scripts/production_health_guard.py

      - name: Rebuild derived contexts safely
        if: ${{ steps.assess.outputs.action == 'REBUILD_DERIVED_CONTEXTS' }}
        run: |
          python scripts/build_state_context.py
          python scripts/build_query_context.py
          python scripts/runtime_self_heal.py --assess

      - name: Repair deterministic metadata drift
        if: ${{ steps.assess.outputs.action == 'SYNC_RULES_VERSION_METADATA' }}
        run: |
          python scripts/runtime_self_heal.py --repair-safe
          python scripts/build_state_context.py
          python scripts/build_query_context.py
          python scripts/runtime_self_heal.py --assess

      - name: Dispatch replacement market snapshot
        if: ${{ steps.assess.outputs.action == 'REFRESH_SNAPSHOT' }}
        run: |
          active=$(gh run list --workflow market-snapshot.yml --limit 5 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" != "0" ]; then
            echo "Canonical market snapshot already queued/in progress; no duplicate dispatch."
            exit 0
          fi
          gh workflow run market-snapshot.yml --ref main -f node=scheduled -f probe_only=false
          python scripts/runtime_self_heal.py --record-trigger

      - name: Persist bounded self-healing state and deterministic repairs
        if: ${{ steps.assess.outputs.action != 'NONE' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/state/self_healing_status.json data/state/CURRENT.json data/state/query_context.json data/state/decision_context.json data/state/intraday_path_features.json data/state/decision_trigger.json data/state/capital_efficiency_ranking.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: record deterministic runtime self-healing"
          # Derived builders may touch other tracked state files. Keep only the
          # owned repair commit before rebasing so concurrent state commits do
          # not make git pull --rebase fail on a dirty worktree.
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Escalate persistent or structural failure
        if: ${{ steps.assess.outputs.action == 'ESCALATE' }}
        run: |
          echo "Self-healing stopped at the safety boundary. Manual/Codex diagnosis is required."
          cat data/state/self_healing_status.json
          exit 1
