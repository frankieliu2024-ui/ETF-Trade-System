name: One-off audit repair 515880 Trial sync
on:
  push:
    paths:
      - ".github/workflows/oneoff-audit-repair-515880-trial-sync.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repair script
        run: python scripts/oneoff_repair_515880_trial_sync.py
      - name: Run focused checks
        run: |
          python -m py_compile scripts/process_state_sync_request.py scripts/check_trade_event_formal_sync.py
          python scripts/check_trade_event_formal_sync.py
          python scripts/check_system_consistency.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF规则_MASTER.md ETF当前状态_DASHBOARD.md ETF交易复盘与经验库_2026.md ETF市场行情档案_2026.md scripts/process_state_sync_request.py scripts/check_trade_event_formal_sync.py .github/workflows/system-consistency.yml
          git commit -m "fix: complete executed Trial synchronization across formal records"
          git push origin HEAD:main
