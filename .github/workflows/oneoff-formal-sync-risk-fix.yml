name: One-off formal-file risk precedence fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-formal-sync-risk-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make formal-file sync honor latest formal review risk
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sync_formal_files.py')
          text=p.read_text(encoding='utf-8')
          old='''def canonical_risk(equity: dict) -> float | None:\n    summary = equity.get("summary") or {}\n    for key in ("known_net_current_strategy_return_pct", "current_strategy_return_pct_gross"):\n        try:\n            return float(summary[key])\n        except (KeyError, TypeError, ValueError):\n            continue\n    return None\n'''
          new='''def canonical_risk(equity: dict) -> float | None:\n    # A later formal post-close review outranks the auxiliary historical equity\n    # reconstruction. This prevents account-maintenance sync from regressing the\n    # Dashboard risk metric to an older reconstruction value.\n    review_dir = ROOT / "events" / "reviews"\n    candidates = []\n    for path in review_dir.glob("*.json") if review_dir.exists() else []:\n        try:\n            event = load_json(path)\n            review = event.get("review") or event.get("formal_review") or {}\n            fact = review.get("etf_strategy_known_net") or {}\n            risk = float(fact.get("etf_strategy_risk_rate_pct"))\n            equity_value = float(fact.get("known_net_strategy_equity"))\n            stamp = str(event.get("updated_at_beijing") or event.get("account_updated_at") or "")\n        except (OSError, json.JSONDecodeError, TypeError, ValueError):\n            continue\n        if stamp:\n            candidates.append((stamp, risk, equity_value))\n    if candidates:\n        return max(candidates, key=lambda x: x[0])[1]\n    summary = equity.get("summary") or {}\n    for key in ("known_net_current_strategy_return_pct", "current_strategy_return_pct_gross"):\n        try:\n            return float(summary[key])\n        except (KeyError, TypeError, ValueError):\n            continue\n    return None\n'''
          if old not in text: raise SystemExit('canonical_risk pattern not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile scripts/sync_formal_files.py scripts/process_state_sync_request.py scripts/build_e2e_status.py scripts/check_system_consistency.py
          python scripts/sync_formal_files.py
          python scripts/build_e2e_status.py >/tmp/e2e.json
          python -m unittest discover -s tests -p 'test_state_sync*.py'
          python -m unittest discover -s tests -p 'test_notification*.py'
          git diff --check
      - name: Commit production fix and reconciled state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync_formal_files.py ETF当前状态_DASHBOARD.md data/state/e2e_status.json data/state/CURRENT.json ETF交易复盘与经验库_2026.md ETF市场行情档案_2026.md
          git commit -m 'fix: prevent formal-file sync from regressing ETF risk'
          git pull --rebase origin main
          git push origin HEAD:main
