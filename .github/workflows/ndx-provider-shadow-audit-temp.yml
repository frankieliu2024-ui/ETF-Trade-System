name: NDX provider shadow audit temp

on:
  push:
    branches: [audit/ndx-provider-shadow-20260826]
    paths:
      - ".github/workflows/ndx-provider-shadow-audit-temp.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare Yahoo and Eastmoney NDX100 in parallel
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone

          HEADERS={'User-Agent':'ETF-Trade-System/provider-shadow-audit'}

          def timed_get_json(url):
              start_wall=datetime.now(timezone.utc)
              start=time.perf_counter()
              req=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(req,timeout=20) as r:
                  payload=json.load(r)
              end=time.perf_counter()
              received=datetime.now(timezone.utc)
              return payload, start_wall, received, round((end-start)*1000,2)

          yurl='https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX?range=1d&interval=1m&includePrePost=false'
          params={'secid':'100.NDX100','fltt':'2','invt':'2','fields':'f43,f44,f45,f46,f57,f58,f60,f86,f124'}
          eurl='https://push2.eastmoney.com/api/qt/stock/get?'+urllib.parse.urlencode(params)

          with ThreadPoolExecutor(max_workers=2) as ex:
              fy=ex.submit(timed_get_json,yurl)
              fe=ex.submit(timed_get_json,eurl)
              ypayload,ystart,yrecv,ylat=fy.result()
              epayload,estart,erecv,elat=fe.result()

          y=ypayload['chart']['result'][0]
          ts=y.get('timestamp') or []
          q=(y.get('indicators',{}).get('quote') or [{}])[0]
          yi=None
          for i in range(len(ts)-1,-1,-1):
              vals={k:(q.get(k) or [None]*len(ts))[i] for k in ('open','high','low','close')}
              if all(v is not None for v in vals.values()):
                  yi=(int(ts[i]),vals)
                  break
          if not yi: raise RuntimeError('Yahoo no complete NDX row')

          e=epayload.get('data') or {}
          raw=e.get('f124') or e.get('f86')
          if raw in (None,'',0,'0'): raise RuntimeError('Eastmoney provider timestamp missing')
          ets=int(float(raw)); ets=ets//1000 if ets>10_000_000_000 else ets
          evals={'open':e.get('f46'),'high':e.get('f44'),'low':e.get('f45'),'close':e.get('f43')}
          if any(v in (None,'-') for v in evals.values()): raise RuntimeError('Eastmoney missing OHLC')

          yts,yvals=yi
          ydt=datetime.fromtimestamp(yts,timezone.utc)
          edt=datetime.fromtimestamp(ets,timezone.utc)
          common=max(yrecv,erecv)
          out={
            'common_observation_utc':common.isoformat(timespec='milliseconds'),
            'request_start_skew_ms':round((estart-ystart).total_seconds()*1000,2),
            'yahoo':{
              'request_start_utc':ystart.isoformat(timespec='milliseconds'),
              'response_received_utc':yrecv.isoformat(timespec='milliseconds'),
              'http_latency_ms':ylat,
              'provider_timestamp':yts,
              'as_of_utc':ydt.isoformat(timespec='seconds'),
              'freshness_at_response_seconds':round((yrecv-ydt).total_seconds(),3),
              'close':yvals['close']
            },
            'eastmoney':{
              'request_start_utc':estart.isoformat(timespec='milliseconds'),
              'response_received_utc':erecv.isoformat(timespec='milliseconds'),
              'http_latency_ms':elat,
              'provider_timestamp':ets,
              'timestamp_field':'f124' if e.get('f124') not in (None,'',0,'0') else 'f86',
              'as_of_utc':edt.isoformat(timespec='seconds'),
              'freshness_at_response_seconds':round((erecv-edt).total_seconds(),3),
              'close':evals['close']
            },
            'eastmoney_minus_yahoo_provider_seconds':ets-yts,
            'price_gap_pct':round((float(evals['close'])-float(yvals['close']))/float(yvals['close'])*100,6)
          }
          print('NDX100_PARALLEL_RESULT='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
