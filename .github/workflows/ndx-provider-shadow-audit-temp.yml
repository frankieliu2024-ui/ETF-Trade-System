name: Apply confirmed Asia direct fallbacks temp

on:
  push:
    branches: [audit/ndx-provider-shadow-20260826]
    paths:
      - ".github/workflows/ndx-provider-shadow-audit-temp.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply object-level provider configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pp=Path('config/market/provider_priority.json')
          p=json.loads(pp.read_text(encoding='utf-8'))
          p['version']='V1.7'
          p['providers']['eastmoney_push2']['kind']='公开行情接口，支持已验证A股ETF/个股/部分指数直接行情；恒生科技指数124.HSTECH为主源；纳斯达克100指数100.NDX100及日经225指数100.N225、韩国综合指数100.KS11、台湾加权指数100.TWII为已确认对象级直接备源'
          p['providers']['eastmoney_push2']['role']='primary_for_HSTECH_and_verified_direct_fallback_for_A_share_NDX_and_confirmed_asia_indices'
          p['objects']['N225']=['yahoo_chart_api','eastmoney_push2:100.N225','ETF_PROXY_513520']
          p['objects']['KOSPI']=['yahoo_chart_api','eastmoney_push2:100.KS11']
          p['objects']['TWII']=['yahoo_chart_api','eastmoney_push2:100.TWII']
          p['object_fallback_policy']['N225']={'primary':'yahoo_chart_api','fallback':['eastmoney_push2:100.N225','ETF_PROXY_513520'],'direct_only':False}
          p['object_fallback_policy']['KOSPI']={'primary':'yahoo_chart_api','fallback':['eastmoney_push2:100.KS11'],'direct_only':True}
          p['object_fallback_policy']['TWII']={'primary':'yahoo_chart_api','fallback':['eastmoney_push2:100.TWII'],'direct_only':True}
          p.setdefault('notes',{})['asia_direct_fallback']='日经225指数（N225）、韩国综合指数（KOSPI）、台湾加权指数（TWII）保留Yahoo主源；根据用户已确认的东方财富对象映射，分别启用100.N225、100.KS11、100.TWII作为直接备源。N225仍保留513520仅作最后ETF代理。'
          pp.write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          mp=Path('config/market/market_monitor_config.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['version']='V1.6'
          m['providers']['eastmoney_push2']['scope']='恒生科技指数直接主源；已验证A股ETF/个股/部分指数直接备源；纳斯达克100指数（NDX）及已确认日经225指数（N225）、韩国综合指数（KOSPI）、台湾加权指数（TWII）对象级直接备源'
          entries={x['id']:x for x in m['classes']['A']['objects']}
          entries['N225']['fallback_source']='eastmoney_push2:100.N225|513520 proxy'; entries['N225']['status']='ACTIVE_WITH_FALLBACK'
          entries['KOSPI']['fallback_source']='eastmoney_push2:100.KS11'; entries['KOSPI']['status']='ACTIVE_WITH_FALLBACK'
          entries['TWII']['fallback_source']='eastmoney_push2:100.TWII'; entries['TWII']['status']='ACTIVE_WITH_FALLBACK'
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sp=Path('scripts/build_overseas_context.py')
          s=sp.read_text(encoding='utf-8')
          old='EASTMONEY_DIRECT_FALLBACKS = {\n    "NDX": "100.NDX100",\n}'
          new='EASTMONEY_DIRECT_FALLBACKS = {\n    "NDX": "100.NDX100",\n    "N225": "100.N225",\n    "KOSPI": "100.KS11",\n    "TWII": "100.TWII",\n}'
          if old not in s:
              raise SystemExit('expected fallback mapping block not found')
          sp.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate exact wiring
        shell: bash
        run: |
          python -m py_compile scripts/build_overseas_context.py
          python - <<'PY'
          import json
          p=json.load(open('config/market/provider_priority.json',encoding='utf-8'))
          m=json.load(open('config/market/market_monitor_config.json',encoding='utf-8'))
          expected={'N225':'eastmoney_push2:100.N225','KOSPI':'eastmoney_push2:100.KS11','TWII':'eastmoney_push2:100.TWII'}
          for obj,fb in expected.items():
              assert p['object_fallback_policy'][obj]['primary']=='yahoo_chart_api'
              assert p['object_fallback_policy'][obj]['fallback'][0]==fb
              row=next(x for x in m['classes']['A']['objects'] if x['id']==obj)
              assert row['preferred_source']=='yahoo_chart_api'
              assert row['status']=='ACTIVE_WITH_FALLBACK'
              assert fb in row['fallback_source']
          s=open('scripts/build_overseas_context.py',encoding='utf-8').read()
          assert '"N225": "100.N225"' in s and '"KOSPI": "100.KS11"' in s and '"TWII": "100.TWII"' in s
          print('ASIA_FALLBACK_WIRING_OK')
          PY
      - name: Commit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/market/provider_priority.json config/market/market_monitor_config.json scripts/build_overseas_context.py
          git commit -m "market: add confirmed Asia index direct fallbacks"
          git push origin HEAD:main
