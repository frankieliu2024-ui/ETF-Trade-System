name: NDX100 fallback consistency audit temp

on:
  push:
    branches: [audit/ndx-provider-shadow-20260826]
    paths:
      - ".github/workflows/ndx-provider-shadow-audit-temp.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and validate NDX wiring
        shell: bash
        run: |
          python -m py_compile scripts/build_overseas_context.py
          python - <<'PY'
          import json
          p=json.load(open('config/market/provider_priority.json',encoding='utf-8'))
          m=json.load(open('config/market/market_monitor_config.json',encoding='utf-8'))
          assert p['object_fallback_policy']['NDX']['primary']=='yahoo_chart_api'
          assert p['object_fallback_policy']['NDX']['fallback']==['eastmoney_push2:100.NDX100']
          assert p['objects']['NDX']==['yahoo_chart_api','eastmoney_push2:100.NDX100']
          ndx=next(x for x in m['classes']['A']['objects'] if x['id']=='NDX')
          assert ndx['preferred_source']=='yahoo_chart_api'
          assert ndx['fallback_source']=='eastmoney_push2:100.NDX100'
          assert ndx['status']=='ACTIVE_WITH_FALLBACK'
          s=open('scripts/build_overseas_context.py',encoding='utf-8').read()
          assert '"NDX": "100.NDX100"' in s
          assert '100.NDX"' not in s
          print('NDX_WIRING_OK')
          PY
      - name: Refresh current audit contexts
        shell: bash
        run: |
          python scripts/build_us_extended_hours_context.py
          python scripts/build_state_context.py
          python scripts/build_query_context.py
      - name: Run formal consistency checks
        shell: bash
        run: |
          python scripts/check_system_consistency.py
          python scripts/check_research_integration.py
          python scripts/maintenance_guard.py
          python scripts/build_e2e_status.py
      - name: Print audit result
        shell: bash
        run: |
          python - <<'PY'
          import json
          for path in ['data/state/system_consistency.json','data/state/maintenance_health.json','data/state/e2e_status.json']:
              d=json.load(open(path,encoding='utf-8'))
              print(path, json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
