name: One-off overseas language and provider repair 2026-08-27

on:
  push:
    paths:
      - ".github/workflows/one-off-overseas-language-provider-repair-20260827.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing replacement target in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 1) User-facing Chinese quality language in overseas context.
          p=Path('scripts/build_overseas_context.py'); s=p.read_text(encoding='utf-8')
          anchor='BEIJING = ZoneInfo("Asia/Shanghai")\n\n'
          insert='''BEIJING = ZoneInfo("Asia/Shanghai")\n\nQUALITY_STATUS_CN = {\n    "PASS": "数据可用",\n    "DEGRADED": "数据受限",\n    "FAILED": "当前不可用",\n    "MISSING": "当前缺失",\n}\nFRESHNESS_STATUS_CN = {\n    "FRESH": "时点正常",\n    "DELAYED": "存在延迟",\n    "STALE": "时点过旧",\n    "SESSION_REFERENCE": "已结束交易时段参考",\n    "PREVIOUS_SESSION_REFERENCE": "上一交易时段参考",\n    "MISSING": "当前缺失",\n}\n\n'''
          if 'QUALITY_STATUS_CN' not in s:
              if anchor not in s: raise SystemExit('missing overseas language anchor')
              s=s.replace(anchor,insert,1)

          # Add Naver KOSPI direct adapter before Eastmoney adapter.
          marker='def fetch_eastmoney_index(object_id: str, spec: dict, generated_utc: datetime, secid: str, *, host: str = "push2.eastmoney.com") -> dict:\n'
          if 'def fetch_naver_kospi' not in s:
              fn='''def fetch_naver_kospi(generated_utc: datetime) -> dict:\n    url = "https://polling.finance.naver.com/api/realtime/domestic/index/KOSPI"\n    req = urllib.request.Request(url, headers={"User-Agent": "ETF-Trade-System/2.2.16"})\n    with urllib.request.urlopen(req, timeout=20) as response:\n        status_code = int(response.status)\n        payload = json.load(response)\n    rows = payload.get("datas") or []\n    if len(rows) != 1:\n        raise RuntimeError(f"Naver KOSPI expected one row, got {len(rows)}")\n    data = rows[0]\n    def num(key):\n        raw = data.get(key + "Raw", data.get(key))\n        if raw in (None, "", "-"):\n            return None\n        return float(str(raw).replace(",", ""))\n    required = {"open": num("openPrice"), "high": num("highPrice"), "low": num("lowPrice"), "close": num("closePrice")}\n    if any(v is None for v in required.values()):\n        raise RuntimeError("Naver KOSPI missing OHLC fields")\n    raw_time = data.get("localTradedAt")\n    if not raw_time:\n        raise RuntimeError("Naver KOSPI missing localTradedAt")\n    local = datetime.fromisoformat(str(raw_time))\n    if local.tzinfo is None:\n        local = local.replace(tzinfo=ZoneInfo("Asia/Seoul"))\n    dt_utc = local.astimezone(timezone.utc)\n    latest = {\n        **required,\n        "volume": num("accumulatedTradingVolume"),\n        "amount": num("accumulatedTradingValue"),\n        "timestamp": int(dt_utc.timestamp()),\n        "as_of_utc": dt_utc.isoformat(timespec="seconds").replace("+00:00", "Z"),\n        "as_of_local": local.isoformat(timespec="seconds"),\n        "as_of_beijing": dt_utc.astimezone(BEIJING).isoformat(timespec="seconds"),\n        "market_date_local": local.date().isoformat(),\n        "provider_timezone": "Asia/Seoul",\n        "symbol": "KOSPI",\n    }\n    phase = market_phase("Asia/Seoul", generated_utc)\n    return {\n        "object": "KOSPI", "name": "韩国综合指数", "reference_role": "KOREA_EQUITY",\n        "provider": "naver_finance", "provider_result": f"HTTP {status_code}",\n        "provider_timestamp_field": "localTradedAt", "symbol": "KOSPI", "market_timezone": "Asia/Seoul",\n        "market_phase_at_generation": phase,\n        "time_relation_to_a_share": time_relation("KOSPI", latest, phase, generated_utc),\n        "quality_status": validate_latest(latest), "latest": latest,\n        "display_time_rule": "正式输出优先显示latest.as_of_beijing（北京时间）；同时保留韩国本地交易时点。",\n        "decision_note": "Naver Finance公开实时指数JSON；使用localTradedAt作为provider时点，作为韩国综合指数直连备源。",\n    }\n\n\n'''
              if marker not in s: raise SystemExit('missing eastmoney marker')
              s=s.replace(marker,fn+marker,1)

          old='''                secid = EASTMONEY_DIRECT_FALLBACKS.get(object_id)\n                if secid and (record is None or primary_error):\n                    provider_id = f"eastmoney_push2:{secid}"\n                    try:\n                        fallback = fetch_eastmoney_index(object_id, spec, generated_utc, secid)\n                        fallback_summary = provider_attempt(fallback, provider_id, generated_utc)\n                        attempts.append(fallback_summary)\n                        if fallback.get("quality_status") == "PASS" and fallback_summary.get("stable_for_10m_pulse") is True:\n                            record = fallback\n                            record["selection_basis"] = "yahoo_primary_unavailable_or_degraded_then_verified_eastmoney_direct_fallback"\n                        elif record is None:\n                            record = fallback\n                    except Exception as fallback_exc:\n                        attempts.append(failed_attempt(provider_id, str(fallback_exc)[-500:], generated_utc, timezone_name=spec["timezone"]))\n\n                if record is None:\n                    raise RuntimeError(primary_error or "no usable direct source")\n                if secid:\n                    record["provider_attempts"] = attempts\n                    record["direct_source_chain"] = ["yahoo_chart_api", f"eastmoney_push2:{secid}"]\n                    record["configured_primary"] = "yahoo_chart_api"\n'''
          new='''                secid = EASTMONEY_DIRECT_FALLBACKS.get(object_id)\n                if secid and (record is None or primary_error):\n                    eastmoney_selected = False\n                    for host in ("push2.eastmoney.com", "push2delay.eastmoney.com"):\n                        provider_family = "eastmoney_push2" if host.startswith("push2.") else "eastmoney_push2delay"\n                        provider_id = f"{provider_family}:{secid}"\n                        try:\n                            fallback = fetch_eastmoney_index(object_id, spec, generated_utc, secid, host=host)\n                            fallback_summary = provider_attempt(fallback, provider_id, generated_utc)\n                            attempts.append(fallback_summary)\n                            if fallback.get("quality_status") == "PASS" and fallback_summary.get("stable_for_10m_pulse") is True:\n                                record = fallback\n                                record["selected_provider_id"] = provider_id\n                                record["selection_basis"] = "yahoo_primary_delayed_then_verified_eastmoney_direct_fallback"\n                                eastmoney_selected = True\n                                break\n                            elif record is None:\n                                record = fallback\n                        except Exception as fallback_exc:\n                            attempts.append(failed_attempt(provider_id, str(fallback_exc)[-500:], generated_utc, timezone_name=spec["timezone"]))\n                    if object_id == "KOSPI" and not eastmoney_selected:\n                        provider_id = "naver_finance:KOSPI"\n                        try:\n                            fallback = fetch_naver_kospi(generated_utc)\n                            fallback_summary = provider_attempt(fallback, provider_id, generated_utc)\n                            attempts.append(fallback_summary)\n                            if fallback.get("quality_status") == "PASS" and fallback_summary.get("stable_for_10m_pulse") is True:\n                                record = fallback\n                                record["selected_provider_id"] = provider_id\n                                record["selection_basis"] = "yahoo_and_eastmoney_unavailable_or_delayed_then_naver_direct_fallback"\n                            elif record is None:\n                                record = fallback\n                        except Exception as fallback_exc:\n                            attempts.append(failed_attempt(provider_id, str(fallback_exc)[-500:], generated_utc, timezone_name=spec["timezone"]))\n\n                if record is None:\n                    raise RuntimeError(primary_error or "no usable direct source")\n                if secid:\n                    record["provider_attempts"] = attempts\n                    record["direct_source_chain"] = ["yahoo_chart_api", f"eastmoney_push2:{secid}", f"eastmoney_push2delay:{secid}"] + (["naver_finance:KOSPI"] if object_id == "KOSPI" else [])\n                    record["configured_primary"] = "yahoo_chart_api"\n'''
          if old not in s: raise SystemExit('missing generic fallback block')
          s=s.replace(old,new,1)

          old2='''    overall = "PASS" if pass_count == len(OBJECTS) else ("DEGRADED" if pass_count else "FAILED")\n    return {\n        "generated_at": now_utc(),\n        "generated_at_beijing": generated_beijing.isoformat(timespec="seconds"),\n        "display_timezone": "Asia/Shanghai", "a_share_reference_timezone": "Asia/Shanghai",\n        "scope": "FORMAL_OVERSEAS_AND_ASIA_INDEX_LAYER", "quality_status": overall,\n'''
          new2='''    for record in objects.values():\n        raw_quality = str(record.get("quality_status") or "MISSING").upper()\n        raw_freshness = str(record.get("freshness_status") or "MISSING").upper()\n        record["quality_status_cn"] = QUALITY_STATUS_CN.get(raw_quality, "状态待确认")\n        record["freshness_status_cn"] = FRESHNESS_STATUS_CN.get(raw_freshness, "时点待确认")\n    overall = "PASS" if pass_count == len(OBJECTS) else ("DEGRADED" if pass_count else "FAILED")\n    return {\n        "generated_at": now_utc(),\n        "generated_at_beijing": generated_beijing.isoformat(timespec="seconds"),\n        "display_timezone": "Asia/Shanghai", "a_share_reference_timezone": "Asia/Shanghai",\n        "scope": "FORMAL_OVERSEAS_AND_ASIA_INDEX_LAYER", "quality_status": overall,\n        "quality_status_cn": QUALITY_STATUS_CN.get(overall, "状态待确认"),\n'''
          if old2 not in s: raise SystemExit('missing overall block')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          # 2) Router exposes Chinese quality/time labels; raw enums remain machine-only.
          p=Path('scripts/market_quote_router.py'); s=p.read_text(encoding='utf-8')
          anchor='''MARKET_NAMES = {\n    "CN": "中国大陆",\n    "HK": "中国香港",\n    "TW": "中国台湾",\n    "JP": "日本",\n    "KR": "韩国",\n    "US": "美国",\n}\n\n'''
          mapping='''MARKET_NAMES = {\n    "CN": "中国大陆",\n    "HK": "中国香港",\n    "TW": "中国台湾",\n    "JP": "日本",\n    "KR": "韩国",\n    "US": "美国",\n}\n\nQUALITY_STATUS_CN = {"PASS": "数据可用", "DEGRADED": "数据受限", "FAILED": "当前不可用", "UNKNOWN": "状态待确认", "MISSING": "当前缺失"}\nFRESHNESS_STATUS_CN = {"FRESH": "时点正常", "DEGRADED": "存在延迟", "STALE": "时点过旧", "SESSION_REFERENCE": "已结束交易时段参考", "PREVIOUS_SESSION_REFERENCE": "上一交易时段参考", "UNKNOWN": "时点待确认"}\n\n'''
          if 'QUALITY_STATUS_CN =' not in s:
              if anchor not in s: raise SystemExit('missing router mapping anchor')
              s=s.replace(anchor,mapping,1)
          old='''        "freshness": _freshness(_beijing_time(timestamp), now, policy),\n        "quality_status": str(row.get("quality_status") or row.get("status") or "UNKNOWN").upper(),\n'''
          new='''        "freshness": _freshness(_beijing_time(timestamp), now, policy),\n        "freshness_cn": FRESHNESS_STATUS_CN.get(_freshness(_beijing_time(timestamp), now, policy), "时点待确认"),\n        "quality_status": str(row.get("quality_status") or row.get("status") or "UNKNOWN").upper(),\n        "quality_status_cn": QUALITY_STATUS_CN.get(str(row.get("quality_status") or row.get("status") or "UNKNOWN").upper(), "状态待确认"),\n'''
          if old not in s: raise SystemExit('missing router quote status block')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 3) Query-context prose should not instruct user-facing output with internal enums.
          p=Path('scripts/build_query_context.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('"EXPLICIT_DEGRADED_OR_MISSING"','"EXPLICIT_DATA_LIMIT_OR_MISSING"')
          s=s.replace('使用前必须按查询时刻重新计算FRESH/DEGRADED/STALE。','使用前必须按查询时刻重新判断为“时点正常／存在延迟／时点过旧”。')
          p.write_text(s,encoding='utf-8')

          # 4) Formal human-readable language boundary.
          p=Path('ETF与市场监测数据接口使用规范.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('> 版本：V1.7  ','> 版本：V1.8  ',1).replace('> 更新日期：2026-08-26  ','> 更新日期：2026-08-27  ',1)
          s=s.replace('单一对象暂时获取失败时必须明确 `DEGRADED`／`FAILED` 或使用明确代理，不得静默从正式监测中消失。','单一对象暂时获取失败时，正式用户输出必须写成“数据受限”／“当前不可用”或说明所用代理，不得直接向用户暴露机器状态码，也不得静默从正式监测中消失。机器JSON内部可保留英文枚举供程序判断。')
          marker='数据是正式分析的前置基础。不存在足够新鲜、时点清晰且通过质量检查的数据时，只能明确说明数据不足；不得用旧值、不同市场错位时点或未核验接口结果补齐结论。\n'
          addition='''数据是正式分析的前置基础。不存在足够新鲜、时点清晰且通过质量检查的数据时，只能明确说明数据不足；不得用旧值、不同市场错位时点或未核验接口结果补齐结论。\n\n### 1.1 用户可见状态语言\n\n机器状态码只服务程序判断，正式对用户输出统一使用中文业务语言：`PASS`→“数据可用”，`DEGRADED`→“数据受限”，`FAILED`→“当前不可用”；`FRESH`→“时点正常”，`DELAYED`→“存在延迟”，`STALE`→“时点过旧”，`SESSION_REFERENCE`→“已结束交易时段参考”，`PREVIOUS_SESSION_REFERENCE`→“上一交易时段参考”。必要时可在技术审计中括号附机器码，但交易分析、盘前、盘中、盘后正式输出不得只给英文内部枚举。\n'''
          if '### 1.1 用户可见状态语言' not in s:
              if marker not in s: raise SystemExit('missing standard marker')
              s=s.replace(marker,addition,1)
          s=s.replace('**Yahoo Chart API**：当前是纳斯达克100指数（NDX）、费城半导体指数（SOX）、日经225指数（N225）、韩国综合指数（KOSPI）、台湾加权指数（TWII）等正式海外/亚洲指数的主要直接源','**Yahoo Chart API**：当前是纳斯达克100指数（NDX）、费城半导体指数（SOX）、日经225指数（N225）、韩国综合指数（KOSPI）、台湾加权指数（TWII）等正式海外/亚洲指数的主要直接源')
          oldsrc='''恒生科技指数（HSTECH）的当前正式链为：`eastmoney_push2:124.HSTECH → yahoo_chart_api:HSTECH.HK → hithink-finance:HS2083 → ETF_PROXY_513180`。前三项均为直接指数路径；只有直接路径均不可用时，才允许使用恒生科技ETF（513180）作为 `PROXY` 辅助，代理不得冒充恒生科技指数本身。\n'''
          newsrc=oldsrc+'''\n日经225指数（N225）当前主源仍为Yahoo；开放交易阶段若Yahoo明显延迟，直接切换东方财富 `100.N225`，主host异常时允许同一东方财富provider家族的 `push2delay` host做网络级重试，二者必须使用provider时间戳且不得视为两个独立数据源。韩国综合指数（KOSPI）当前主源仍为Yahoo；开放交易阶段优先使用东方财富 `100.KS11` 直连备源，若其不可用或明显延迟，再使用已验证的Naver Finance `KOSPI`实时指数JSON直连备源。Naver必须读取`localTradedAt`和市场状态，不得用请求时间代替行情时间。\n'''
          if 'Naver Finance `KOSPI`' not in s:
              if oldsrc not in s: raise SystemExit('missing standard source insertion marker')
              s=s.replace(oldsrc,newsrc,1)
          p.write_text(s,encoding='utf-8')

          # MASTER terminology only; no rule change.
          p=Path('ETF规则_MASTER.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('标记DEGRADED／FAILED或使用明确代理','明确说明“数据受限／当前不可用”或使用明确代理')
          p.write_text(s,encoding='utf-8')

          # Index terminology in human-readable instructions.
          p=Path('ETF_SYSTEM_INDEX.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('检查FRESH／DEGRADED／STALE','检查“时点正常／存在延迟／时点过旧”')
          p.write_text(s,encoding='utf-8')

          # 5) Provider config.
          p=Path('config/market/provider_priority.json'); cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg['version']='V1.8'
          cfg['providers']['naver_finance']={
              'kind':'Naver Finance公开韩国市场行情JSON；当前仅验证韩国综合指数KOSPI实时直连',
              'requires_key':False,
              'role':'verified_direct_fallback_for_KOSPI',
              'adjusted':False
          }
          cfg['providers']['eastmoney_push2delay']={
              'kind':'东方财富push2备用host；仅作为同一provider家族网络级重试，不计作独立数据源',
              'requires_key':False,
              'role':'network_retry_for_verified_eastmoney_overseas_index_paths',
              'adjusted':False
          }
          cfg['objects']['N225']=['yahoo_chart_api','eastmoney_push2:100.N225','eastmoney_push2delay:100.N225','ETF_PROXY_513520']
          cfg['objects']['KOSPI']=['yahoo_chart_api','eastmoney_push2:100.KS11','eastmoney_push2delay:100.KS11','naver_finance:KOSPI']
          cfg['object_fallback_policy']['N225']['fallback']=['eastmoney_push2:100.N225','eastmoney_push2delay:100.N225','ETF_PROXY_513520']
          cfg['object_fallback_policy']['KOSPI']['fallback']=['eastmoney_push2:100.KS11','eastmoney_push2delay:100.KS11','naver_finance:KOSPI']
          cfg.setdefault('notes',{})['n225_kospi_redundancy']='2026-08-27 live probe: Eastmoney 100.N225/100.KS11 returned current provider timestamps; push2delay is same-provider network retry, not independent source. Naver KOSPI returned OPEN, delayTime=0 and localTradedAt and is a verified independent direct fallback. Sina int_nikkei lacked OHLC/provider timestamp and Tencent tested symbols did not map, so neither was promoted.'
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')

          # Syntax + simple assertions.
          assert 'quality_status_cn' in Path('scripts/build_overseas_context.py').read_text(encoding='utf-8')
          assert 'naver_finance:KOSPI' in Path('scripts/build_overseas_context.py').read_text(encoding='utf-8')
          assert '用户可见状态语言' in Path('ETF与市场监测数据接口使用规范.md').read_text(encoding='utf-8')
          PY
          python -m py_compile scripts/build_overseas_context.py scripts/market_quote_router.py scripts/build_query_context.py
          python scripts/build_overseas_context.py
          python scripts/build_us_extended_hours_context.py
          python scripts/build_query_context.py
          python scripts/check_system_consistency.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/repair
          cp scripts/build_overseas_context.py scripts/market_quote_router.py scripts/build_query_context.py ETF与市场监测数据接口使用规范.md ETF规则_MASTER.md ETF_SYSTEM_INDEX.md config/market/provider_priority.json data/state/overseas_context.json data/state/us_extended_hours_context.json data/state/query_context.json data/state/system_consistency.json /tmp/repair/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/repair/build_overseas_context.py scripts/build_overseas_context.py
          cp /tmp/repair/market_quote_router.py scripts/market_quote_router.py
          cp /tmp/repair/build_query_context.py scripts/build_query_context.py
          cp /tmp/repair/ETF与市场监测数据接口使用规范.md ETF与市场监测数据接口使用规范.md
          cp /tmp/repair/ETF规则_MASTER.md ETF规则_MASTER.md
          cp /tmp/repair/ETF_SYSTEM_INDEX.md ETF_SYSTEM_INDEX.md
          cp /tmp/repair/provider_priority.json config/market/provider_priority.json
          cp /tmp/repair/overseas_context.json data/state/overseas_context.json
          cp /tmp/repair/us_extended_hours_context.json data/state/us_extended_hours_context.json
          cp /tmp/repair/query_context.json data/state/query_context.json
          cp /tmp/repair/system_consistency.json data/state/system_consistency.json
          git add scripts/build_overseas_context.py scripts/market_quote_router.py scripts/build_query_context.py ETF与市场监测数据接口使用规范.md ETF规则_MASTER.md ETF_SYSTEM_INDEX.md config/market/provider_priority.json data/state/overseas_context.json data/state/us_extended_hours_context.json data/state/query_context.json data/state/system_consistency.json
          git commit -m "fix: localize market quality language and strengthen Asia fallbacks"
          git push origin HEAD:main
