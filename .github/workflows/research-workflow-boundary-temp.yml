name: research-workflow-boundary-temp
on:
  push:
    branches:
      - maintenance/research-workflow-main-write-containment-clean-20260827
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile protocol check
        run: python -m py_compile scripts/check_production_mutation_protocol.py
      - name: Validate production mutation protocol
        run: python scripts/check_production_mutation_protocol.py
