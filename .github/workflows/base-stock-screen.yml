name: IPO base-stock screen

on:
  push:
    branches: [main]
    paths:
      - "requests/base_stock_screen/**.json"
      - "scripts/screen_ipo_base_stocks.py"
      - ".github/workflows/base-stock-screen.yml"

permissions:
  contents: write

concurrency:
  group: ipo-base-stock-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Run pending screens
        shell: bash
        run: |
          mkdir -p research/base_stock_screen
          for req in requests/base_stock_screen/*.json; do
            [ -e "$req" ] || continue
            rid=$(python - "$req" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]); print(json.loads(p.read_text(encoding='utf-8'))['request_id'])
          PY
          )
            [ -f "research/base_stock_screen/${rid}.json" ] && continue
            python scripts/screen_ipo_base_stocks.py "$req"
          done
      - name: Persist screen results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/base_stock_screen
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist IPO base-stock screen"
          git pull --rebase origin main
          git push origin HEAD:main
