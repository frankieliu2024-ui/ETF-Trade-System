name: ETF formal decision pulse trigger

# Compatibility-only wake remains visible for audit, but this workflow must not
# create Formal Decision requests or start a second market-fact production chain.
# The canonical Formal Decision task consumes current-main fixed-node facts;
# decision reminders remain owned by the existing notification pipeline.
on:
  workflow_run:
    workflows: ["ETF market snapshot"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: etf-formal-decision-pulse-trigger
  cancel-in-progress: false

jobs:
  audit_only:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record legacy pulse is intentionally non-producing
        run: |
          echo "No Formal Decision request created."
          echo "No market-snapshot workflow dispatched."
          echo "Canonical Formal Decision and notification pipelines remain unchanged."
