name: Low-cost alpha stage2

on:
  workflow_dispatch:
  push:
    branches:
      - research/low-cost-alpha-validation-20260828
    paths:
      - "scripts/run_low_cost_alpha_stage2.py"
      - ".github/workflows/low-cost-alpha-stage2.yml"

permissions:
  contents: read

concurrency:
  group: etf-low-cost-alpha-stage2
  cancel-in-progress: true

jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas requests akshare
      - name: Compile
        run: python -m py_compile scripts/run_low_cost_alpha_stage2.py
      - name: Run focused robustness validation
        working-directory: scripts
        run: python run_low_cost_alpha_stage2.py
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: low-cost-alpha-stage2-${{ github.run_id }}
          path: research/backtests/low_cost_alpha_stage2_validation.json
          if-no-files-found: error
          retention-days: 14
