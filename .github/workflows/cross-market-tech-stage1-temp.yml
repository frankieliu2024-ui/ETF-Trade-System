name: Cross-market tech Stage1 A temp

on:
  push:
    branches: [main]
    paths:
      - "requests/research_backfill/cross_market_tech_run_trigger.txt"

permissions:
  contents: write

concurrency:
  group: cross-market-tech-stage1-a
  cancel-in-progress: false

jobs:
  stage1_a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.2" "requests==2.32.3"
      - name: Run strict PIT cross-market Stage1 A
        run: |
          python scripts/run_cross_market_tech_stage1_a.py requests/research_backfill/20260825_cross_market_tech_stage1.json
      - name: Enforce research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/backtests/cross_market_tech_stage1_a_validation.json').read_text(encoding='utf-8'))
          s=json.loads(Path('data/state/cross_market_tech_stage1_a_status.json').read_text(encoding='utf-8'))
          assert r['decision_eligible'] is False
          assert r['trade_signal'] is None
          assert r['trial_confirm'] is None
          assert r['portfolio_target'] is None
          assert r['master_override'] is False
          assert r['production_context_integration'] is False
          assert s['decision_eligible'] is False
          assert s['trade_signal'] is None
          assert s['master_override'] is False
          print(json.dumps(s,ensure_ascii=False))
          PY
      - name: Commit Stage A result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtests/cross_market_tech_stage1_a_validation.json data/state/cross_market_tech_stage1_a_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record cross-market tech Stage1 A"
          git pull --rebase origin main
          git push origin HEAD:main
