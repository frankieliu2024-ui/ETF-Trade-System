name: Stock alignment semantic fix temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-alignment-semantic-fix-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch session-aware stock alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_system_consistency.py')
          s = p.read_text(encoding='utf-8')
          old = '''    core_time_text = str(current.get("captured_at") or "")
    stock_time_texts = [str(item.get("as_of_beijing") or "") for item in (stock_market.get("objects") or {}).values() if item.get("as_of_beijing")]
    stock_time_aligned = True
    stock_time_detail = "not_comparable"
    if live_runtime and core_time_text and stock_time_texts:
        try:
            core_dt = datetime.fromisoformat(core_time_text.replace("Z", "+00:00"))
            stock_delays = []
            for stock_time in stock_time_texts:
                stock_dt = datetime.fromisoformat(stock_time.replace("Z", "+00:00"))
                stock_delays.append(round((core_dt - stock_dt).total_seconds()))
            max_delay = max(stock_delays)
            stock_time_aligned = max_delay <= 900
            stock_time_detail = f"max_core_minus_stock_seconds={max_delay}"
        except ValueError:
            stock_time_aligned = False
            stock_time_detail = "invalid_timestamp"
    check("stock_runtime:market_time_alignment", stock_time_aligned, stock_time_detail, warning=True)
'''
          new = '''    core_time_text = str(current.get("captured_at") or "")
    stock_items = [item for item in (stock_market.get("objects") or {}).values() if isinstance(item, dict)]
    stock_time_texts = [str(item.get("as_of_beijing") or "") for item in stock_items if item.get("as_of_beijing")]
    stock_time_aligned = True
    stock_time_detail = "not_comparable"
    if live_runtime and core_time_text and stock_time_texts:
        try:
            core_dt = datetime.fromisoformat(core_time_text.replace("Z", "+00:00"))
            stock_dts = [datetime.fromisoformat(stock_time.replace("Z", "+00:00")) for stock_time in stock_time_texts]
            stock_delays = [round((core_dt - stock_dt).total_seconds()) for stock_dt in stock_dts]
            max_delay = max(stock_delays)
            current_market_date = str(current.get("market_date") or "")
            same_market_date = bool(current_market_date) and all(
                stock_dt.astimezone(SHANGHAI).date().isoformat() == current_market_date for stock_dt in stock_dts
            )
            all_outside_session = bool(stock_items) and all(
                str(item.get("market_phase") or "").upper() == "OUTSIDE_SESSION" for item in stock_items
            )
            all_stock_quality_pass = bool(stock_items) and all(
                str(item.get("quality_status") or "").upper() == "PASS" for item in stock_items
            )
            close_reference = (
                str(current.get("latest_valid_node") or "").lower() == "close"
                and same_market_date
                and all_outside_session
                and all_stock_quality_pass
            )
            stock_time_aligned = max_delay <= 900 or close_reference
            if close_reference and max_delay > 900:
                stock_time_detail = f"session_aligned_close_reference max_core_minus_stock_seconds={max_delay}"
            else:
                stock_time_detail = f"max_core_minus_stock_seconds={max_delay}"
        except ValueError:
            stock_time_aligned = False
            stock_time_detail = "invalid_timestamp"
    check("stock_runtime:market_time_alignment", stock_time_aligned, stock_time_detail, warning=True)
'''
          if old not in s:
              raise SystemExit('target block not found; no mutation made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/check_system_consistency.py
          python -m unittest discover -s tests -p 'test_market*.py'
      - name: Persist fix and remove temp workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/stock-alignment-semantic-fix-temp.yml
          git add scripts/check_system_consistency.py .github/workflows/stock-alignment-semantic-fix-temp.yml
          git commit -m "fix: make stock timing audit session-aware"
          git pull --rebase origin main
          git push origin HEAD:main
