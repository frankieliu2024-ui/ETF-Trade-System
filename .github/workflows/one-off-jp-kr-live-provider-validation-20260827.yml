name: One-off JP KR live provider validation 2026-08-27
on:
  push:
    paths:
      - ".github/workflows/one-off-jp-kr-live-provider-validation-20260827.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parallel live probes
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse, datetime, concurrent.futures
          from pathlib import Path
          from zoneinfo import ZoneInfo

          BJ=ZoneInfo('Asia/Shanghai')
          UA='Mozilla/5.0 ETF-Trade-System/2.2.16 live-validation'

          def read_url(url, headers=None, encoding='utf-8'):
              req=urllib.request.Request(url,headers=headers or {'User-Agent':UA})
              t0=time.time()
              with urllib.request.urlopen(req,timeout=12) as r:
                  raw=r.read(); status=r.status
              return status, raw.decode(encoding,errors='replace'), round((time.time()-t0)*1000,1)

          def yahoo(symbol):
              url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(symbol,safe='')+'?interval=1m&range=1d&includePrePost=false'
              st,txt,ms=read_url(url)
              j=json.loads(txt); r=j['chart']['result'][0]; ts=r.get('timestamp') or []
              q=(r.get('indicators',{}).get('quote') or [{}])[0]
              if not ts: raise RuntimeError('no timestamp')
              i=len(ts)-1
              while i>=0 and (q.get('close') or [None])[i] is None: i-=1
              if i<0: raise RuntimeError('no close')
              z=ZoneInfo(r.get('meta',{}).get('exchangeTimezoneName') or 'UTC')
              dt=datetime.datetime.fromtimestamp(ts[i],datetime.timezone.utc)
              return {'http':st,'latency_ms':ms,'price':q['close'][i],'open':q['open'][i],'high':q['high'][i],'low':q['low'][i],'provider_ts':ts[i],'as_of_beijing':dt.astimezone(BJ).isoformat(timespec='seconds'),'as_of_local':dt.astimezone(z).isoformat(timespec='seconds')}

          def eastmoney(secid, host):
              fields='f43,f44,f45,f46,f47,f48,f57,f58,f60,f86,f124'
              url=f'https://{host}/api/qt/stock/get?secid={secid}&fltt=2&invt=2&fields={fields}'
              st,txt,ms=read_url(url)
              d=json.loads(txt).get('data') or {}
              ts=d.get('f86') or d.get('f124')
              if not ts: raise RuntimeError('missing f86/f124')
              dt=datetime.datetime.fromtimestamp(int(ts),datetime.timezone.utc)
              return {'http':st,'latency_ms':ms,'price':d.get('f43'),'open':d.get('f46'),'high':d.get('f44'),'low':d.get('f45'),'previous_close':d.get('f60'),'provider_ts':int(ts),'as_of_beijing':dt.astimezone(BJ).isoformat(timespec='seconds'),'name':d.get('f58'),'symbol':d.get('f57')}

          def naver_kospi():
              url='https://polling.finance.naver.com/api/realtime/domestic/index/KOSPI'
              st,txt,ms=read_url(url)
              row=(json.loads(txt).get('datas') or [None])[0]
              if not row: raise RuntimeError('no row')
              def n(k):
                  v=row.get(k+'Raw',row.get(k)); return float(str(v).replace(',','')) if v not in (None,'','-') else None
              raw=row.get('localTradedAt'); dt=datetime.datetime.fromisoformat(raw)
              if dt.tzinfo is None: dt=dt.replace(tzinfo=ZoneInfo('Asia/Seoul'))
              return {'http':st,'latency_ms':ms,'price':n('closePrice'),'open':n('openPrice'),'high':n('highPrice'),'low':n('lowPrice'),'volume':n('accumulatedTradingVolume'),'provider_ts':int(dt.timestamp()),'as_of_beijing':dt.astimezone(BJ).isoformat(timespec='seconds'),'as_of_local':dt.isoformat(timespec='seconds'),'delayTime':row.get('delayTime'),'marketStatus':row.get('marketStatus')}

          probes={
            'N225_yahoo': lambda:yahoo('^N225'),
            'N225_eastmoney_primary': lambda:eastmoney('100.N225','push2.eastmoney.com'),
            'N225_eastmoney_delayhost': lambda:eastmoney('100.N225','push2delay.eastmoney.com'),
            'KOSPI_yahoo': lambda:yahoo('^KS11'),
            'KOSPI_eastmoney_primary': lambda:eastmoney('100.KS11','push2.eastmoney.com'),
            'KOSPI_eastmoney_delayhost': lambda:eastmoney('100.KS11','push2delay.eastmoney.com'),
            'KOSPI_naver': naver_kospi,
          }
          rounds=[]
          for rno in range(3):
              started=datetime.datetime.now(datetime.timezone.utc)
              result={}
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(probes)) as ex:
                  fut={ex.submit(fn):name for name,fn in probes.items()}
                  for f in concurrent.futures.as_completed(fut):
                      name=fut[f]
                      try: result[name]={'ok':True,**f.result()}
                      except Exception as e: result[name]={'ok':False,'error':repr(e)}
              rounds.append({'round':rno+1,'captured_at_beijing':started.astimezone(BJ).isoformat(timespec='seconds'),'results':result})
              if rno<2: time.sleep(20)
          # Basic cross-provider diagnostics per round.
          for rr in rounds:
              now=datetime.datetime.fromisoformat(rr['captured_at_beijing'])
              for name,x in rr['results'].items():
                  if x.get('ok') and x.get('as_of_beijing'):
                      dt=datetime.datetime.fromisoformat(x['as_of_beijing'])
                      x['delay_seconds_vs_capture']=round((now-dt).total_seconds(),1)
              for prefix in ('N225','KOSPI'):
                  vals=[x['price'] for n,x in rr['results'].items() if n.startswith(prefix) and x.get('ok') and isinstance(x.get('price'),(int,float))]
                  if vals:
                      rr[prefix+'_price_spread_pct']=round((max(vals)-min(vals))/((max(vals)+min(vals))/2)*100,4)
          out={'generated_at_beijing':datetime.datetime.now(datetime.timezone.utc).astimezone(BJ).isoformat(timespec='seconds'),'rounds':rounds}
          p=Path('data/market/audit/jp_kr_live_provider_validation_20260827.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/market/audit/jp_kr_live_provider_validation_20260827.json /tmp/jpkr.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/market/audit
          cp /tmp/jpkr.json data/market/audit/jp_kr_live_provider_validation_20260827.json
          git add -f data/market/audit/jp_kr_live_provider_validation_20260827.json
          git commit -m "audit: validate Japan Korea live providers in parallel" || exit 0
          git push origin HEAD:main
