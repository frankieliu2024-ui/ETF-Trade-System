name: ETF minute path shadow validation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_minute_path_features.py"
      - "scripts/probe_index_minute_acceptance.py"
      - "scripts/probe_stock_minute_production.py"
      - "scripts/validate_minute_context_integration.py"
      - "config/minute_path_validation_policy.json"
      - ".github/workflows/minute-path-shadow.yml"

permissions:
  contents: read

concurrency:
  group: etf-minute-path-shadow
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile minute-path modules
        run: python -m py_compile scripts/build_minute_path_features.py scripts/probe_index_minute_acceptance.py scripts/probe_stock_minute_production.py scripts/validate_minute_context_integration.py
      - name: Build Tencent 1-minute ETF path shadow evidence
        run: python scripts/build_minute_path_features.py
      - name: Build Tencent index-minute and 10m acceptance PoC
        run: python scripts/probe_index_minute_acceptance.py
      - name: Validate current A-share stock minute production semantics
        run: python scripts/probe_stock_minute_production.py
      - name: Validate minute evidence against current formal contexts
        run: python scripts/validate_minute_context_integration.py
      - name: Upload shadow, PoC and integration validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: minute-path-shadow-${{ github.run_id }}
          path: |
            data/state/minute_path_features.json
            data/state/minute_index_acceptance_poc.json
            data/state/stock_minute_production_poc.json
            data/state/minute_context_integration_validation.json
          if-no-files-found: error
          retention-days: 14

# This workflow is now validation-on-change/manual only. The minute path has a
# formal object-level production gate and fallback in build_state_context.py;
# repeated weekday shadow cron no longer provides enough incremental value to
# justify ten scheduled attempts per day.
