name: One-off fix Shanghai index provider warning
# Triggered after workflow is present on default branch.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-shanghai-index-warning.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace stale single-source assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_system_consistency.py')
          text = p.read_text(encoding='utf-8')
          old = '    check("providers:single_source_shanghai_index", "000001.SH" not in fallback_policy, "000001.SH remains single-source until a verified Eastmoney index mapping exists", warning=True)'
          new = '''    shanghai_rule = fallback_policy.get("000001.SH") or {}
    shanghai_direct_sources = [shanghai_rule.get("primary"), *(shanghai_rule.get("fallback") or [])]
    shanghai_multisource_ok = (
        shanghai_rule.get("direct_only") is True
        and shanghai_rule.get("primary") == "tencent_qq"
        and "hithink_finance" in shanghai_direct_sources
    )
    check("providers:shanghai_index_direct_fallback", shanghai_multisource_ok, f"000001.SH direct sources={shanghai_direct_sources}", warning=True)'''
          if old not in text:
              raise SystemExit('stale assertion not found; refusing blind patch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/check_system_consistency.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_system_consistency.py
          git commit -m "fix: validate Shanghai index Tencent direct fallback"
          git pull --rebase origin main
          git push origin HEAD:main
