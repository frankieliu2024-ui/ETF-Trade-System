name: ETF completion ingress consumer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: etf-completion-ingress-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      INGRESS_URL: https://etf-completion-ingress.frankieliu2024.workers.dev
      INGRESS_SECRET: ${{ secrets.ETF_INGRESS_SECRET }}
      ETF_GITHUB_PAT: ${{ secrets.ETF_COMPLETION_INGRESS_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claim one queued completion
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$INGRESS_URL/claim" \
            -H "X-ETF-Ingress-Secret: $INGRESS_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/claim.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/claim.json", encoding="utf-8"))
          if not payload.get("ok"):
              raise SystemExit("claim failed")
          with open("/tmp/claim_found", "w", encoding="utf-8") as f:
              f.write("true" if payload.get("found") else "false")
          if payload.get("found"):
              with open("/tmp/claim_key", "w", encoding="utf-8") as f:
                  f.write(str(payload["key"]))
              with open("/tmp/claim_token", "w", encoding="utf-8") as f:
                  f.write(str(payload["claim_token"]))
          PY
          echo "found=$(cat /tmp/claim_found)" >> "$GITHUB_OUTPUT"

      - name: Stop cleanly when queue is empty
        if: steps.claim.outputs.found != 'true'
        run: echo "No pending completion."

      - name: Materialize the claimed completion
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          claim = json.load(open("/tmp/claim.json", encoding="utf-8"))
          payload = claim["payload"]
          request_id = str(payload["request_id"])
          path = f"requests/live_snapshot/{request_id}__scheduled_review_completion.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          with open("/tmp/completion_path", "w", encoding="utf-8") as f:
              f.write(path)
          PY
          test -s /tmp/completion_path

      - name: Execute the single completion owner
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.scheduled_review_completion_owner import execute_post_handoff
          target = Path(open("/tmp/completion_path", encoding="utf-8").read().strip())
          result = execute_post_handoff(target)
          print(json.dumps(result, ensure_ascii=False))
          Path("/tmp/owner_result.json").write_text(
              json.dumps(result, ensure_ascii=False), encoding="utf-8"
          )
          if not result.get("ok"):
              raise SystemExit("completion owner did not reach confirmed terminal state")
          PY

      - name: Acknowledge the same claimed completion
        if: success() && steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          body = json.dumps({
              "key": open("/tmp/claim_key", encoding="utf-8").read().strip(),
              "claim_token": open("/tmp/claim_token", encoding="utf-8").read().strip(),
          }).encode()
          req = urllib.request.Request(
              os.environ["INGRESS_URL"] + "/ack",
              data=body,
              method="POST",
              headers={
                  "X-ETF-Ingress-Secret": os.environ["INGRESS_SECRET"],
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode())
          print(json.dumps(result, ensure_ascii=False))
          if not result.get("acknowledged"):
              raise SystemExit("ack failed")
          PY
