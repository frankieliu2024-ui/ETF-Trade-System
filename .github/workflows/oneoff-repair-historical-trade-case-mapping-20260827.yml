name: One-off repair historical trade CASE mapping 20260827
on:
  push:
    paths:
      - ".github/workflows/oneoff-repair-historical-trade-case-mapping-20260827.yml"
permissions:
  contents: write
concurrency:
  group: production-main-writer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synchronize latest main before mutation
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply historical trade CASE repair
        run: python scripts/oneoff_historical_trade_case_repair_20260827.py
      - name: Validate focused repair before commit
        run: |
          python -m py_compile scripts/check_system_consistency.py scripts/oneoff_historical_trade_case_repair_20260827.py
          grep -q 'CASE-20260713-01：初始ETF组合建立与连续增仓' ETF交易复盘与经验库_2026.md
          grep -q 'CASE-20260728-01：打新底仓建立' ETF交易复盘与经验库_2026.md
          grep -q 'CASE-20260827-01 Trial；关联决策20260827_095649_515880_trial_5000' ETF交易复盘与经验库_2026.md
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('ETF交易复盘与经验库_2026.md').read_text(encoding='utf-8')
          start = text.index('### 2.1 2026-07-13以来完整证券成交索引')
          end = text.index('### 2.2 银证转账与非交易现金流水', start)
          rows = [x for x in text[start:end].splitlines() if x.startswith('|2026-')]
          assert len(rows) == 27, len(rows)
          for row in rows:
              assert len(set(re.findall(r'CASE-\d{8}-\d{2}', row))) == 1, row
          print('focused audit: 27/27 rows have exactly one CASE id')
          PY
      - name: Commit production repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF交易复盘与经验库_2026.md scripts/check_system_consistency.py
          if git diff --cached --quiet; then
            echo "No repair diff to commit"
            exit 0
          fi
          git commit -m "fix: complete historical trade CASE ownership audit"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
