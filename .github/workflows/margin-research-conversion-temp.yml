name: Margin research conversion temp

on:
  push:
    branches: [main]
    paths:
      - "requests/research_backfill/margin_research_conversion_trigger.txt"

permissions:
  contents: write

concurrency:
  group: margin-research-conversion
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETF_SYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh validated research contexts
        run: |
          python scripts/build_state_context.py
          python scripts/build_query_context.py
      - name: Enforce conversion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/state/margin_financing_evidence.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/state/research_context.json').read_text(encoding='utf-8'))
          d=json.loads(Path('data/state/decision_context.json').read_text(encoding='utf-8'))
          assert e['decision_eligible'] is False and e['trade_signal'] is None and e['master_override'] is False
          assert 'margin_financing' in r['validated_evidence_summary']
          assert 'margin_financing_evidence' in d['research_evidence']
          assert d['research_evidence']['margin_financing_evidence']['trade_signal'] is None
          print(json.dumps({'margin_status':e.get('status'),'fact_latest_date':e.get('fact_latest_date'),'use_in_current_decision':e.get('use_in_current_decision')},ensure_ascii=False))
          PY
      - name: Commit formal research conversion state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/margin_financing_evidence.json data/state/research_context.json data/state/decision_context.json data/state/query_context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: activate validated margin financing evidence"
          git pull --rebase origin main
          git push origin HEAD:main
